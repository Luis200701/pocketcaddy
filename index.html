<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101217">
<title>Pocket Caddy</title>
<!--
  Pocket Caddy
  ------------
  Ansichten (ueber den Teil hinter dem # gesteuert):
    #            Startseite: Verlauf aller gespeicherten Runden
    #JJMMTT-...  Scorecard einer Runde (so kommt es aus dem QR-Code)
    #menu/xyz    Menuepunkte

  Gespeichert wird derzeit ausschliesslich lokal im Browser (localStorage).
  Es geht nichts an einen Server, und alles hinter dem # wird von Browsern
  ohnehin nie an den Server geschickt.

  Datenformat des QR-Codes:  JJMMTT-PSPSPS...
    JJMMTT  Datum, z.B. 260816 = 16.08.2026
    danach  je Loch zwei Zeichen: erst Par, dann Schlaege
            Schlaege als Hex-Ziffer, damit 10 in ein Zeichen passt
            (bei Par 6 sind bis zu Par+4 = 10 Schlaege moeglich): a = 10

  Datensatz einer gespeicherten Runde (Speicherformat v2):
    id         eindeutige Kennung, unabhaengig vom Inhalt
    code       die Zeichenkette aus dem QR-Code
    date       JJMMTT
    createdAt  Zeitpunkt des Speicherns (ms)
    updatedAt  Zeitpunkt der letzten Aenderung (ms)
    deleted    true = geloescht, Eintrag bleibt als Grabstein erhalten

  Warum id, updatedAt und deleted schon jetzt:
  Ohne eigene Kennung waeren zwei identische Runden am selben Tag nicht
  unterscheidbar. Ohne updatedAt koennte ein spaeterer Abgleich nicht
  entscheiden, welche Fassung neuer ist. Und ohne Grabsteine kaeme eine
  geloeschte Runde beim naechsten Abgleich vom Server zurueck.
-->
<style>
  :root{
    --bg:#101217; --card:#161921; --bar:#1a1d24; --lime:#a3e635;
    --txt:#fff; --mut:#7c8593; --good:#5ede8f; --bad:#ff5c5c;
    --line:#ffffff14;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:0 0 calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;max-width:520px;margin:0 auto}
  .topbar .brand{font-size:14px;letter-spacing:.16em;text-transform:uppercase;
                 color:var(--mut);font-weight:600}
  .iconbtn{background:transparent;border:0;color:var(--txt);padding:8px;margin:-8px;
           cursor:pointer;display:flex;border-radius:10px}
  .iconbtn:active{background:#ffffff12}
  .iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;
               stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .topbtns{display:flex;gap:4px}

  /* Scanner */
  .scanview{position:fixed;inset:0;background:#000;z-index:40;
            display:flex;flex-direction:column;
            opacity:0;pointer-events:none;transition:opacity .2s}
  .scanview.on{opacity:1;pointer-events:auto}
  .scanview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scantop{position:relative;z-index:2;display:flex;justify-content:space-between;
           align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .scantop .close{background:#00000080;border:0;color:#fff;width:40px;height:40px;
                  border-radius:999px;display:flex;align-items:center;justify-content:center}
  .scantop .close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
                      stroke-linecap:round;stroke-linejoin:round}
  .scanframe{position:relative;z-index:2;margin:auto;width:min(72vw,300px);
             aspect-ratio:1;border-radius:20px;
             box-shadow:0 0 0 2000px rgba(0,0,0,.55);}
  .scanframe::before{content:"";position:absolute;inset:0;border-radius:20px;
                     border:2.5px solid var(--lime)}
  .scanmsg{position:relative;z-index:2;text-align:center;color:#fff;
           font-size:14.5px;padding:22px 30px calc(30px + env(safe-area-inset-bottom));
           line-height:1.6}
  .scanmsg b{display:block;margin-bottom:6px;font-size:16px}
  .scanmsg .err{color:#ff8a8a}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .stat{background:var(--card);border-radius:14px;padding:14px 10px;text-align:center}
  .stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .k{font-size:11px;color:var(--mut);letter-spacing:.07em;
           text-transform:uppercase;margin-top:6px}

  .sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 12px}
  .sectionhead .t{font-size:13px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--mut);font-weight:600}
  .sectionhead .c{font-size:12.5px;color:var(--mut)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border-radius:14px;padding:14px 16px;
        display:flex;align-items:center;gap:14px;cursor:pointer;border:0;width:100%;
        text-align:left;color:inherit;font:inherit}
  .item:active{background:var(--bar)}
  .item .big{font-size:24px;font-weight:800;min-width:54px;font-variant-numeric:tabular-nums}
  .item .meta{flex:1;min-width:0}
  .item .meta .d{display:block;font-size:15px}
  .item .meta .s{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
  .item .chev{color:var(--mut);flex:none;display:flex}
  .item .chev svg{width:18px;height:18px;fill:none;stroke:currentColor;
                  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .empty{background:var(--card);border-radius:14px;padding:28px 22px;text-align:center;
         color:var(--mut);line-height:1.7}
  .empty b{color:var(--txt);display:block;margin-bottom:8px;font-size:17px}

  .date{text-align:center;font-size:14px;color:var(--mut);margin-bottom:2px}
  .datewrap{display:flex;justify-content:center}
  .datebtn{display:inline-flex;align-items:center;gap:8px;background:transparent;
           border:1px solid var(--line);border-radius:999px;color:var(--mut);
           font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
  .datebtn:active{background:#ffffff10}
  .datebtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
               stroke-linecap:round;stroke-linejoin:round;flex:none}
  .datebtn .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
                background:#ffffff14;border-radius:99px;padding:3px 7px}
  #dateInput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  /* Datum steht am Bildschirm im antippbaren Knopf, in der Unterzeile waere
     es doppelt. Im PDF ist der Knopf ausgeblendet, dort wird es gebraucht. */
  #subDate{display:none}
  #subDate + .dot{display:none}
  .total{margin:14px 0 24px;text-align:center}
  .total .num{font-size:64px;font-weight:800;line-height:1}
  .total .sub{font-size:13px;color:var(--mut);letter-spacing:.1em;
              text-transform:uppercase;margin-top:8px}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border-radius:14px;overflow:hidden}
  th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
     font-weight:600;text-align:right;padding:12px 14px;background:var(--bar)}
  th:first-child,td:first-child{text-align:left}
  td{padding:11px 14px;text-align:right;font-variant-numeric:tabular-nums;
     border-top:1px solid #ffffff0d}
  tbody tr:first-child td{border-top:none}
  .good{color:var(--good)} .bad{color:var(--bad)} .even{color:var(--txt)}
  tfoot td{background:var(--bar);font-weight:700;border-top:2px solid #ffffff1a}

  .actions{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button.btn{font:600 15px/1 inherit;font-family:inherit;color:#0d1117;background:var(--lime);
    border:0;border-radius:999px;padding:14px 24px;cursor:pointer;
    display:inline-flex;align-items:center;gap:9px}
  button.btn:active{transform:translateY(1px)}
  button.btn.ghost{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px #ffffff1f}
  button.btn.saved{background:#2a3b1c;color:var(--lime)}
  button.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;
                 stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hint{margin-top:14px;font-size:12.5px;color:var(--mut);text-align:center;line-height:1.7}

  .sheetbg{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;
           transition:opacity .18s;z-index:20}
  .sheetbg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
         border-radius:20px 20px 0 0;padding:10px 12px calc(18px + env(safe-area-inset-bottom));
         transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);
         max-width:520px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:#ffffff2b;margin:6px auto 12px}
  .menuitem{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;
            color:inherit;font:inherit;text-align:left;padding:14px 12px;border-radius:12px;cursor:pointer}
  .menuitem:active{background:#ffffff10}
  .menuitem svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
                stroke-linecap:round;stroke-linejoin:round;color:var(--mut);flex:none}
  .menuitem .lbl{flex:1}
  .menuitem .lbl .sub{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
  .badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
         border:1px solid var(--line);border-radius:99px;padding:4px 9px;flex:none}
  .sep{height:1px;background:var(--line);margin:8px 12px}

  .ph{background:var(--card);border-radius:14px;padding:26px 22px;text-align:center;
      color:var(--mut);line-height:1.75}
  .ph .ic{display:flex;justify-content:center;margin-bottom:14px;color:var(--mut)}
  .ph .ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;
              stroke-linecap:round;stroke-linejoin:round}
  .ph b{color:var(--txt);display:block;font-size:18px;margin-bottom:10px}
  .ph .soon{display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--mut);border:1px solid var(--line);
            border-radius:99px;padding:5px 12px}

  .panel{background:var(--card);border-radius:14px;padding:20px;margin-bottom:12px}
  .panel h3{margin:0 0 8px;font-size:16px;font-weight:700}
  .panel p{margin:0 0 14px;font-size:13.5px;color:var(--mut);line-height:1.7}
  .panel .actions{margin-top:0;justify-content:flex-start}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
         max-width:488px;margin:0 auto;background:var(--bar);border:1px solid var(--line);
         border-radius:14px;padding:14px 16px;font-size:14px;z-index:30;
         opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.withaction{pointer-events:auto;display:flex;align-items:center;gap:12px}
  .toast.withaction span{flex:1}
  .taction{background:transparent;border:0;color:var(--lime);font:600 14px inherit;
           font-family:inherit;cursor:pointer;padding:6px 4px;flex:none}
  .toast.bad{border-color:#ff5c5c44}

  .form{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .form input{background:var(--bg);border:1px solid var(--line);border-radius:12px;
              color:var(--txt);font:inherit;font-size:16px;padding:13px 14px;width:100%}
  .form input:focus{outline:none;border-color:#ffffff33}
  .form input::placeholder{color:var(--mut)}
  .warn{margin:14px 0 0;font-size:12.5px;color:var(--mut);line-height:1.7}
  button.btn.google{width:100%;background:#fff;color:#1f1f1f;justify-content:center;
                    margin-bottom:16px;box-shadow:0 1px 2px #0000004d}
  button.btn.google:active{background:#f1f1f1}
  .orline{display:flex;align-items:center;gap:12px;margin:4px 0 18px;
          color:var(--mut);font-size:12.5px}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
  .linkrow{margin-top:14px;text-align:center}
  .linkbtn{background:transparent;border:0;color:var(--mut);font:inherit;
           font-size:13.5px;text-decoration:underline;text-underline-offset:3px;
           cursor:pointer;padding:6px}
  .linkbtn:active{color:var(--txt)}

  /* Freunde */
  .codebox{background:var(--bg);border:1px dashed #ffffff2b;border-radius:12px;
           padding:16px;text-align:center;font-size:26px;font-weight:800;
           letter-spacing:.14em;font-variant-numeric:tabular-nums;margin-bottom:14px}
  .item.static{cursor:default}
  .ava{width:40px;height:40px;border-radius:999px;background:var(--bar);
       display:flex;align-items:center;justify-content:center;flex:none;
       font-weight:700;font-size:16px;color:var(--lime)}
  .ava.dim{color:var(--mut)}
  .ava.big{width:52px;height:52px;font-size:21px}
  .btnrow{display:flex;gap:8px;flex:none}
  .mini{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);
        background:transparent;display:flex;align-items:center;justify-content:center;
        cursor:pointer;padding:0;color:var(--mut)}
  .mini svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;
            stroke-linecap:round;stroke-linejoin:round}
  .mini.ok{color:var(--lime);border-color:#a3e63544}
  .mini.no{color:#c07070;border-color:#ff5c5c33}
  .mini:active{background:#ffffff10}
  .friendhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .friendhead .fname{font-size:20px;font-weight:700}
  .datebtn.plain{cursor:default}

  .del{margin-top:26px;text-align:center}
  .del button{background:transparent;border:0;color:#8a5050;font:inherit;
              box-shadow:inset 0 0 0 1px #ff5c5c33;font-size:13.5px;padding:11px 18px;
              border-radius:999px;cursor:pointer}

  .print-foot{display:none}

  @media print{
    @page{size:A4 portrait;margin:0}
    html,body{background:var(--bg) !important;color:var(--txt);
      -webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0;font-size:11pt}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .topbar,.actions,.hint,.del,.sheet,.sheetbg,.toast,.datewrap{display:none !important}
    #subDate{display:inline}
    .wrap{max-width:none;padding:13mm 16mm}
    .date{text-align:left}
    .total{margin:0 0 6mm;text-align:left;display:flex;align-items:baseline;gap:6mm}
    .total .num{font-size:34pt}
    .total .sub{margin:0;font-size:9pt}
    th{padding:2.4mm 4mm;font-size:8.5pt}
    td{padding:2.1mm 4mm}
    .print-foot{display:flex;margin-top:6mm;padding-top:3.5mm;border-top:1px solid #ffffff1a;
                font-size:8.5pt;color:var(--mut);justify-content:space-between}
    tr{break-inside:avoid}
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand" id="brand">Pocket Caddy</span>
  <span class="topbtns">
  <button class="iconbtn" id="btnScan" aria-label="QR-Code scannen">
    <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
    <rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/>
    <rect x="7" y="13" width="4" height="4"/><path d="M13 13h2"/><path d="M17 13v4"/>
    <path d="M13 17h4"/></svg>
  </button>
  <button class="iconbtn" id="btnMenu" aria-label="Men\u00fc">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
  </button>
  </span>
</div>

<div class="wrap"><div id="content"></div></div>

<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="menuItems"></div></div>
<div class="toast" id="toast"></div>

<div class="scanview" id="scanview">
  <video id="scanVideo" playsinline muted autoplay></video>
  <div class="scantop"><span></span>
    <button class="close" id="btnScanClose" aria-label="Schlie\u00dfen">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="scanframe"></div>
  <div class="scanmsg" id="scanMsg"><b>QR-Code des Pocket Caddy einrahmen</b>
    Erkennt automatisch, sobald er scharf im Bild ist.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ==========================================================
   Zugangsdaten des Supabase-Projekts.
   Beide Werte duerfen oeffentlich im Browser stehen. Der Schutz
   der Daten laeuft ueber die Zugriffsregeln (row level security)
   in der Datenbank, nicht ueber Geheimhaltung dieser Werte.
   Der service_role bzw. secret key gehoert NIEMALS hierher.
   ========================================================== */
var SUPABASE_URL = 'https://hieaduzvsqkwvdxfscoo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_Qn7gucn459dApRgYZgTbyQ_8FZS2sJG';
</script>

<script>
(function () {
  'use strict';

  var content = document.getElementById('content');
  var brand   = document.getElementById('brand');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg, isBad) {
    toastEl.innerHTML = '';
    toastEl.textContent = msg;
    toastEl.className = 'toast on' + (isBad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 3200);
  }

  // Meldung mit Knopf, z.B. zum Rueckgaengigmachen
  function toastAction(msg, label, fn) {
    toastEl.innerHTML = '<span>' + msg + '</span>' +
                        '<button class="taction" id="tAct">' + label + '</button>';
    toastEl.className = 'toast on withaction';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 8000);
    document.getElementById('tAct').addEventListener('click', function () {
      toastEl.className = 'toast';
      clearTimeout(toastTimer);
      fn();
    });
  }

  /* ==========================================================
     Konto (Supabase Auth)
     ========================================================== */
  var Auth = (function () {
    var client = null, user = null, ready = false;
    var listeners = [];
    var recovery = false;   // kommt gerade aus der "Passwort vergessen"-Mail

    function init(cb) {
      try {
        if (window.supabase && window.supabase.createClient) {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (e) { client = null; }

      if (!client) { ready = true; cb && cb(); return; }   // ohne Netz nur lokal

      client.auth.getSession().then(function (res) {
        user = (res && res.data && res.data.session) ? res.data.session.user : null;
        ready = true;
        cb && cb();
      }).catch(function () { ready = true; cb && cb(); });

      client.auth.onAuthStateChange(function (evt, session) {
        var before = user ? user.id : null;
        user = session ? session.user : null;
        // Supabase meldet PASSWORD_RECOVERY, wenn der Link aus der Mail
        // geoeffnet wurde. Dann zeigen wir das Feld fuer das neue Passwort.
        if (evt === 'PASSWORD_RECOVERY') {
          recovery = true;
          location.hash = 'menu/login';
        }
        if ((user ? user.id : null) !== before || evt === 'PASSWORD_RECOVERY') {
          listeners.forEach(function (f) { f(user); });
        }
      });
    }

    return {
      init: init,
      onChange: function (f) { listeners.push(f); },
      isReady: function () { return ready; },
      isOnline: function () { return !!client; },
      isRecovery: function () { return recovery; },
      clearRecovery: function () { recovery = false; },
      user: function () { return user; },
      id: function () { return user ? user.id : null; },
      email: function () { return user ? user.email : ''; },
      signUp: function (email, pw) {
        return client.auth.signUp({ email: email, password: pw });
      },
      signIn: function (email, pw) {
        return client.auth.signInWithPassword({ email: email, password: pw });
      },
      // OAuth-Anmeldung (z.B. Google). Leitet auf Google weiter und
      // zurueck, danach ist man angemeldet, wie bei E-Mail/Passwort.
      // WICHTIG: redirectTo darf keine # enthalten. Die Seite nutzt die
      // Raute selbst fuer die eigene Navigation, und Supabase haengt bei
      // der Rueckkehr eigene Anmeldedaten an dieselbe Stelle an. Beides
      // gleichzeitig fuehrt dazu, dass keins von beidem sauber ankommt,
      // die Anmeldung sah dann erfolgreich aus, blieb aber nicht haengen.
      signInWithProvider: function (provider) {
        return client.auth.signInWithOAuth({
          provider: provider,
          options: { redirectTo: location.origin + location.pathname }
        });
      },
      // Schickt eine Mail mit Link zurueck auf diese Seite. Der Anker
      // #menu/login sorgt dafuer, dass man direkt im Kontobereich landet.
      // Schickt eine Mail mit Link zurueck auf diese Seite. Auch hier
      // bewusst ohne # in der Adresse, aus demselben Grund wie oben bei
      // signInWithProvider. Die Weiterleitung auf die Passwort-Maske
      // passiert stattdessen im PASSWORD_RECOVERY-Ereignis unten.
      resetPassword: function (email) {
        return client.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + location.pathname
        });
      },
      updatePassword: function (pw) {
        return client.auth.updateUser({ password: pw });
      },
      signOut: function () { return client.auth.signOut(); },
      db: function () { return client; }
    };
  })();

  /* ==========================================================
     Speicherschicht
     Die Oberflaeche spricht nur mit Store, nie direkt mit
     localStorage oder der Datenbank.

     Ohne Anmeldung: alles liegt unter pc_rounds_v2 (wie bisher).
     Mit Anmeldung:  eigene Ablage pro Konto (pc_rounds_v2_<id>),
                     die im Hintergrund mit dem Server abgeglichen
                     wird. Der lokale Teil bleibt als Zwischen-
                     speicher erhalten, damit auch ohne Netz
                     gespeichert werden kann.
     ========================================================== */
  var Store = (function () {
    var KEY_ANON = 'pc_rounds_v2';
    var KEY_V1   = 'pc_rounds_v1';   // alte Fassung, bleibt als Sicherheitsnetz liegen

    function key() {
      var id = Auth.id();
      return id ? (KEY_ANON + '_' + id) : KEY_ANON;
    }

    function available() {
      try { localStorage.setItem('pc_t','1'); localStorage.removeItem('pc_t'); return true; }
      catch (e) { return false; }
    }

    function newId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function readRaw(k) {
      try {
        var raw = localStorage.getItem(k || key());
        var arr = raw ? JSON.parse(raw) : null;
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
      return null;
    }

    function writeRaw(arr, k) {
      try { localStorage.setItem(k || key(), JSON.stringify(arr)); return true; }
      catch (e) { return false; }
    }

    // Einmalige Uebernahme aus der alten Fassung. Betrifft nur die Ablage
    // ohne Anmeldung, alte Daten gab es ja nur dort.
    function migrate() {
      if (Auth.id()) return;
      var FLAG = 'pc_migrated_v2';
      try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
      var old = [];
      try {
        var raw = localStorage.getItem(KEY_V1);
        old = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(old)) old = [];
      } catch (e) { old = []; }

      var existing = readRaw() || [];
      var have = {};
      existing.forEach(function (r) { have[r.code] = true; });

      var now = Date.now();
      old.forEach(function (x, i) {
        if (!x || typeof x.code !== 'string' || have[x.code]) return;
        var t = x.saved || (now - (old.length - i) * 1000);
        existing.push({ id:newId(), code:x.code, date:x.date || '',
                        createdAt:t, updatedAt:t, deleted:false });
      });
      if (writeRaw(existing)) {
        try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      }
    }

    // Vereinheitlichung: In frueheren Fassungen stand der Datumsvorsatz mit
    // im Feld code ("260816-4533..."). Dadurch waere dieselbe Runde einmal
    // mit und einmal ohne Vorsatz als zwei verschiedene gezaehlt worden.
    // Hier wird der Vorsatz einmalig herausgeloest, je Ablage getrennt.
    function normalize() {
      var FLAG = 'pc_normalized_' + key();
      try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
      var arr = readRaw() || [];
      arr.forEach(function (r) {
        var m = /^(\d{6})-(.+)$/.exec(r.code || '');
        if (m) { if (!r.date) r.date = m[1]; r.code = m[2]; }
      });
      if (writeRaw(arr)) {
        try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      }
    }

    function all() {
      migrate(); normalize();
      return (readRaw() || []).filter(function (r) { return !r.deleted; });
    }

    function allIncludingDeleted() {
      migrate(); normalize();
      return readRaw() || [];
    }

    function add(code, date) {
      var arr = allIncludingDeleted();
      var now = Date.now();
      var rec = { id:newId(), code:code, date:date || '',
                  createdAt:now, updatedAt:now, deleted:false };
      arr.push(rec);
      if (!writeRaw(arr)) return null;
      pushSoon();
      return rec;
    }

    // Eine Runde gilt als bereits gespeichert, wenn Code UND Datum passen.
    // Nur der Code reicht nicht: Ohne Datum im QR-Code waere eine zweite
    // Runde mit exakt denselben Pars und Schlaegen sonst faelschlich eine
    // Dublette. An einem anderen Tag ist es eine neue Runde.
    function findSaved(code, date) {
      var hit = null;
      all().forEach(function (r) {
        if (r.code === code && (r.date || '') === (date || '')) hit = r;
      });
      return hit;
    }

    function setDate(id, date) {
      var arr = allIncludingDeleted();
      var hit = false;
      arr.forEach(function (r) {
        if (r.id === id) { r.date = date || ''; r.updatedAt = Date.now(); hit = true; }
      });
      if (!hit || !writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function remove(id) {
      var arr = allIncludingDeleted();
      var now = Date.now();
      var hit = false;
      arr.forEach(function (r) {
        if (r.id === id && !r.deleted) { r.deleted = true; r.updatedAt = now; hit = true; }
      });
      if (!hit || !writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function removeAll() {
      var arr = allIncludingDeleted();
      var now = Date.now();
      arr.forEach(function (r) {
        if (!r.deleted) { r.deleted = true; r.updatedAt = now; }
      });
      if (!writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function exportData() {
      return {
        app: 'pocketcaddy',
        format: 2,
        exportedAt: new Date().toISOString(),
        rounds: allIncludingDeleted()
      };
    }

    // Zusammenfuehren statt ersetzen: unbekannte Kennungen kommen dazu,
    // bekannte gewinnen nach dem juengeren updatedAt.
    // Ausnahme: Steht eine Runde lokal auf geloescht, ist sie in der Datei
    // aber vorhanden, wird sie wiederhergestellt. Sonst braechte eine
    // Sicherung nach einem Loeschen nichts zurueck, weil das Loeschen ja
    // immer juenger ist als die Datei.
    function importData(obj) {
      if (!obj || obj.app !== 'pocketcaddy' || !Array.isArray(obj.rounds)) {
        return { ok:false, reason:'format' };
      }
      var arr = allIncludingDeleted();
      var byId = {};
      arr.forEach(function (r) { byId[r.id] = r; });

      var added = 0, updated = 0, restored = 0;
      var now = Date.now();

      obj.rounds.forEach(function (r) {
        if (!r || typeof r.code !== 'string' || !r.id) return;
        var cur = byId[r.id];

        if (!cur) {
          arr.push({ id:r.id, code:r.code, date:r.date || '',
                     createdAt:r.createdAt || now,
                     updatedAt:r.updatedAt || now,
                     deleted:!!r.deleted });
          if (!r.deleted) added++;
          return;
        }

        if (cur.deleted && !r.deleted) {
          cur.code = r.code; cur.date = r.date || '';
          cur.deleted = false; cur.updatedAt = now;
          restored++;
          return;
        }

        if ((r.updatedAt || 0) > (cur.updatedAt || 0)) {
          cur.code = r.code; cur.date = r.date || '';
          cur.deleted = !!r.deleted; cur.updatedAt = r.updatedAt;
          updated++;
        }
      });

      if (!writeRaw(arr)) return { ok:false, reason:'write' };
      return { ok:true, added:added, updated:updated, restored:restored };
    }

    /* ---------- Abgleich mit dem Server ---------- */

    function toRow(r, uid) {
      return { id:r.id, user_id:uid, code:r.code, date:r.date || null,
               created_at:new Date(r.createdAt || Date.now()).toISOString(),
               updated_at:new Date(r.updatedAt || Date.now()).toISOString(),
               deleted:!!r.deleted };
    }
    function fromRow(row) {
      return { id:row.id, code:row.code, date:row.date || '',
               createdAt:Date.parse(row.created_at) || Date.now(),
               updatedAt:Date.parse(row.updated_at) || Date.now(),
               deleted:!!row.deleted };
    }

    var syncing = false;
    var pushTimer = null;

    // Sammelt kurz, statt bei jedem Klick einzeln zu senden.
    // Schlaegt der Abgleich fehl (kein Netz), bleibt alles lokal liegen und
    // wandert beim naechsten erfolgreichen Abgleich hoch.
    function pushSoon() {
      if (!Auth.id() || !Auth.isOnline()) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function () { sync(); }, 600);
    }

    // Holt alles vom Server, fuehrt es mit dem lokalen Stand zusammen
    // (juengeres updatedAt gewinnt) und schiebt danach zurueck, was lokal
    // neuer ist. Damit funktioniert auch Speichern ohne Netz: die Runde
    // liegt lokal und wandert beim naechsten Abgleich hoch.
    function sync() {
      var uid = Auth.id();
      if (!uid || !Auth.isOnline() || syncing) return Promise.resolve({ ok:false });
      syncing = true;

      var db = Auth.db();
      return db.from('rounds').select('*').eq('user_id', uid)
        .then(function (res) {
          if (res.error) throw res.error;

          var local = readRaw() || [];
          var byId = {};
          local.forEach(function (r) { byId[r.id] = r; });

          var pushUp = [];
          (res.data || []).forEach(function (row) {
            var remote = fromRow(row);
            var cur = byId[remote.id];
            if (!cur) { local.push(remote); byId[remote.id] = remote; }
            else if (remote.updatedAt > cur.updatedAt) {
              cur.code = remote.code; cur.date = remote.date;
              cur.deleted = remote.deleted; cur.updatedAt = remote.updatedAt;
            } else if (cur.updatedAt > remote.updatedAt) {
              pushUp.push(cur);
            }
          });

          var known = {};
          (res.data || []).forEach(function (row) { known[row.id] = true; });
          local.forEach(function (r) { if (!known[r.id]) pushUp.push(r); });

          writeRaw(local);
          if (!pushUp.length) return { ok:true, pushed:0 };

          return db.from('rounds')
            .upsert(pushUp.map(function (r) { return toRow(r, uid); }))
            .then(function (up) {
              if (up.error) throw up.error;
              return { ok:true, pushed:pushUp.length };
            });
        })
        .then(function (r) { syncing = false; return r; })
        .catch(function (e) {
          syncing = false;
          return { ok:false, error:(e && e.message) || 'unbekannt' };
        });
    }

    // Beim ersten Anmelden werden die lokal gespeicherten Runden ins Konto
    // uebernommen. Es wird gemeldet, wie viele es waren, und es laesst sich
    // rueckgaengig machen. Das ist bewusst so: sonst wandern beim Anmelden
    // auf einem fremden Geraet dessen Runden still in das eigene Konto.
    function claimLocal() {
      var uid = Auth.id();
      if (!uid) return { moved:0 };
      var FLAG = 'pc_claimed_' + uid;
      try { if (localStorage.getItem(FLAG)) return { moved:0 }; } catch (e) { return { moved:0 }; }

      var anon = (readRaw(KEY_ANON) || []).filter(function (r) { return !r.deleted; });
      try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      if (!anon.length) return { moved:0 };

      var mine = readRaw() || [];
      var byId = {};
      mine.forEach(function (r) { byId[r.id] = true; });
      var movedIds = [];
      anon.forEach(function (r) {
        if (byId[r.id]) return;
        mine.push({ id:r.id, code:r.code, date:r.date || '',
                    createdAt:r.createdAt, updatedAt:Date.now(), deleted:false });
        movedIds.push(r.id);
      });
      writeRaw(mine);
      return { moved:movedIds.length, ids:movedIds };
    }

    // Nimmt eine gerade erfolgte Uebernahme wieder zurueck
    function undoClaim(ids) {
      if (!ids || !ids.length) return;
      var mine = readRaw() || [];
      var drop = {};
      ids.forEach(function (i) { drop[i] = true; });
      writeRaw(mine.filter(function (r) { return !drop[r.id]; }));
      var uid = Auth.id();
      if (uid && Auth.isOnline()) {
        Auth.db().from('rounds').delete().in('id', ids).eq('user_id', uid);
      }
    }

    return { available:available, all:all, add:add, findSaved:findSaved,
             setDate:setDate, remove:remove, removeAll:removeAll,
             exportData:exportData, importData:importData,
             sync:sync, claimLocal:claimLocal, undoClaim:undoClaim };
  })();

  /* ---------- Hilfsfunktionen ---------- */

  // Heutiges Datum des Geraets im Format JJMMTT
  function todayCode() {
    var d = new Date();
    var p = function (v) { return (v < 10 ? '0' : '') + v; };
    return p(d.getFullYear() % 100) + p(d.getMonth() + 1) + p(d.getDate());
  }

  // JJMMTT -> Wert fuer ein <input type="date"> (JJJJ-MM-TT) und zurueck
  function codeToInput(c) {
    if (!/^\d{6}$/.test(c)) return '';
    return '20' + c.slice(0,2) + '-' + c.slice(2,4) + '-' + c.slice(4,6);
  }
  function inputToCode(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    return m ? m[1].slice(2) + m[2] + m[3] : '';
  }

  function parseCode(raw) {
    var parts = raw.split('-');
    var d    = parts.length > 1 ? parts[0] : '';
    var data = parts.length > 1 ? parts[1] : parts[0];
    var holes = [], diff = 0, strokes = 0, par = 0;
    for (var i = 0; i + 1 < data.length; i += 2) {
      var p = parseInt(data.charAt(i), 10);
      var s = parseInt(data.charAt(i + 1), 16);   // Hex: a = 10
      if (isNaN(p) || isNaN(s)) continue;
      holes.push({ par:p, sc:s, diff:s - p });
      diff += s - p; strokes += s; par += p;
    }
    // Gespeichert wird nur der Spieldaten-Teil, das Datum getrennt davon.
    // Sonst gaelte dieselbe Runde einmal mit und einmal ohne Datumsvorsatz
    // im QR-Code als zwei verschiedene Runden.
    // Enthaelt der Code kein Datum, nehmen wir das heutige Datum des Geraets.
    // Gescannt wird ueblicherweise direkt nach der Runde, und korrigieren
    // laesst es sich vor dem Speichern.
    var hasDate = /^\d{6}$/.test(d);
    return { date:hasDate ? d : todayCode(), dateFromDevice:!hasDate,
             data:data, code:raw, holes:holes, diff:diff, strokes:strokes, par:par };
  }
  function fmtDate(d) {
    if (!/^\d{6}$/.test(d)) return '';
    return d.slice(4,6) + '.' + d.slice(2,4) + '.20' + d.slice(0,2);
  }
  function sign(n){ return (n > 0 ? '+' : '') + n; }
  function cls(n){ return n < 0 ? 'good' : (n > 0 ? 'bad' : 'even'); }
  function colorOf(n){ return n < 0 ? 'var(--good)' : (n > 0 ? 'var(--bad)' : 'var(--txt)'); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var I = {

  /* ==========================================================
     Scanner
     Nutzt die eingebaute Texterkennung des Browsers (BarcodeDetector),
     die es in Chrome/Android gibt. Faehrt Safari/iOS die nicht mit,
     wird jsQR nachgeladen, eine kleine Bibliothek, die dasselbe im
     Browser selbst berechnet. Erkennt einen QR-Code des Pocket Caddy
     direkt an seinem Aufbau (Ziffernpaare hinter #) und springt ohne
     Umweg ueber eine fremde Kamera-App direkt zur Scorecard.
     ========================================================== */
  var Scanner = (function () {
    var view = document.getElementById('scanview');
    var video = document.getElementById('scanVideo');
    var msg = document.getElementById('scanMsg');
    var stream = null, raf = null, jsQRready = null, stopping = false;

    function loadJsQR() {
      if (window.jsQR) return Promise.resolve();
      if (jsQRready) return jsQRready;
      jsQRready = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      return jsQRready;
    }

    function setMsg(html) { msg.innerHTML = html; }

    function handleText(text) {
      // Ein QR des Pocket Caddy hat die Form ".../pocketcaddy/#<Ziffern>".
      // Statt die Adresse selbst zu pruefen (koennte sich mal aendern),
      // wird direkt geprueft, ob der Teil hinter dem letzten # wie eine
      // gueltige Runde aussieht.
      var hashPart = text.indexOf('#') >= 0 ? text.split('#').pop() : text;
      var parsed = parseCode(hashPart);

      if (!parsed.holes.length) {
        setMsg('<b class="err">Kein Pocket-Caddy-Code</b>' +
               'Das sieht nicht nach einer Runde aus. Weiter versuchen oder ' +
               '<button class="linkbtn" id="scanRaw" style="color:#fff">Text anzeigen</button>.');
        var rawBtn = document.getElementById('scanRaw');
        if (rawBtn) rawBtn.addEventListener('click', function () {
          setMsg('<b>Gescannter Inhalt</b>' + esc(text));
        });
        return false;   // weiterscannen
      }

      stop();
      if (navigator.vibrate) navigator.vibrate(60);
      location.hash = hashPart;
      route();
      return true;
    }

    function tick() {
      if (stopping || video.readyState < 2) { raf = requestAnimationFrame(tick); return; }

      var w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) { raf = requestAnimationFrame(tick); return; }
      var cv = tick._cv || (tick._cv = document.createElement('canvas'));
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, w, h);
      var img = ctx.getImageData(0, 0, w, h);
      var res = window.jsQR ? window.jsQR(img.data, w, h) : null;
      if (res && res.data) { if (handleText(res.data)) return; }
      raf = requestAnimationFrame(tick);
    }

    function nativeLoop(detector) {
      if (stopping) return;
      detector.detect(video).then(function (codes) {
        if (stopping) return;
        if (codes && codes.length && handleText(codes[0].rawValue)) return;
        raf = requestAnimationFrame(function () { nativeLoop(detector); });
      }).catch(function () {
        raf = requestAnimationFrame(function () { nativeLoop(detector); });
      });
    }

    function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('Dieser Browser unterstuetzt keinen Kamerazugriff.', true);
        return;
      }
      stopping = false;
      view.classList.add('on');
      setMsg('<b>QR-Code des Pocket Caddy einrahmen</b>Erkennt automatisch, sobald er scharf im Bild ist.');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      }).then(function (s) {
        stream = s;
        video.srcObject = s;
        return video.play();
      }).then(function () {
        if (window.BarcodeDetector) {
          BarcodeDetector.getSupportedFormats().then(function (fmts) {
            if (fmts.indexOf('qr_code') >= 0) {
              nativeLoop(new BarcodeDetector({ formats: ['qr_code'] }));
            } else {
              loadJsQR().then(function () { raf = requestAnimationFrame(tick); });
            }
          }).catch(function () {
            loadJsQR().then(function () { raf = requestAnimationFrame(tick); });
          });
        } else {
          loadJsQR().then(function () { raf = requestAnimationFrame(tick); })
                    .catch(function () { setMsg('<b class="err">Erkennung konnte nicht geladen werden</b>Bitte Internetverbindung pr\u00fcfen.'); });
        }
      }).catch(function (e) {
        var m = (e && e.name) || '';
        var text = m === 'NotAllowedError'
          ? 'Kamerazugriff wurde nicht erlaubt. In den Einstellungen des Browsers f\u00fcr diese Seite freigeben.'
          : m === 'NotFoundError'
          ? 'Keine Kamera gefunden.'
          : 'Kamera konnte nicht gestartet werden.';
        setMsg('<b class="err">Kein Zugriff</b>' + text);
      });
    }

    function stop() {
      stopping = true;
      if (raf) cancelAnimationFrame(raf);
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      video.srcObject = null;
      view.classList.remove('on');
    }

    return { start: start, stop: stop };
  })();

    document.getElementById('btnExport').addEventListener('click', function () {
      var data = Store.exportData();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      var url  = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = new Date();
      var pad = function (v) { return (v < 10 ? '0' : '') + v; };
      a.href = url;
      a.download = 'pocketcaddy-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast('Datei erstellt.');
    });

    var fi = document.getElementById('fileInput');
    document.getElementById('btnImport').addEventListener('click', function(){ fi.click(); });
    fi.addEventListener('change', function () {
      var f = fi.files && fi.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var obj;
        try { obj = JSON.parse(rd.result); }
        catch (e) { toast('Datei konnte nicht gelesen werden.', true); return; }
        var res = Store.importData(obj);
        if (!res.ok) {
          toast(res.reason === 'format'
            ? 'Das sieht nicht nach einer Pocket-Caddy-Datei aus.'
            : 'Einlesen fehlgeschlagen.', true);
          return;
        }
        var parts = [];
        if (res.added)    parts.push(res.added + ' neu');
        if (res.restored) parts.push(res.restored + ' wiederhergestellt');
        if (res.updated)  parts.push(res.updated + ' aktualisiert');
        toast(parts.length ? parts.join(', ') + '.' : 'Nichts zu \u00e4ndern, alles war schon da.');
        renderBackup();
      };
      rd.readAsText(f);
      fi.value = '';
    });

    document.getElementById('btnClear').addEventListener('click', function () {
      if (confirm('Wirklich alle Runden von diesem Ger\u00e4t l\u00f6schen?')) {
        Store.removeAll(); toast('Alle Runden gel\u00f6scht.'); renderBackup();
      }
    });

    wireBack('btnHome');
  }

  /* ==========================================================
     Freunde
     Alles laeuft ueber die Datenbank, es wird nichts lokal
     zwischengespeichert. Ohne Anmeldung gibt es hier nichts.
     ========================================================== */
  var Friends = (function () {
    var myProfile = null;

    function db() { return Auth.db(); }

    function loadProfile(force) {
      if (myProfile && !force) return Promise.resolve(myProfile);
      if (!Auth.id() || !Auth.isOnline()) return Promise.resolve(null);
      return db().from('profiles').select('user_id,display_name,friend_code')
        .eq('user_id', Auth.id()).maybeSingle()
        .then(function (r) { myProfile = r.data || null; return myProfile; })
        .catch(function () { return null; });
    }

    function setName(name) {
      return db().from('profiles').update({ display_name: name })
        .eq('user_id', Auth.id())
        .then(function (r) {
          if (!r.error && myProfile) myProfile.display_name = name;
          return r;
        });
    }

    // Gibt alle Verbindungen zurueck, angereichert um den Namen des
    // jeweils anderen. Zwei Abfragen statt einer, weil friendships auf
    // auth.users zeigt und nicht direkt auf profiles.
    function list() {
      var me = Auth.id();
      if (!me || !Auth.isOnline()) return Promise.resolve({ friends:[], incoming:[], outgoing:[] });

      return db().from('friendships').select('*')
        .or('requester.eq.' + me + ',addressee.eq.' + me)
        .then(function (r) {
          if (r.error) throw r.error;
          var rows = r.data || [];
          var others = rows.map(function (f) {
            return f.requester === me ? f.addressee : f.requester;
          });
          if (!others.length) return { rows:rows, names:{} };
          return db().from('profiles').select('user_id,display_name')
            .in('user_id', others)
            .then(function (p) {
              var names = {};
              (p.data || []).forEach(function (x) { names[x.user_id] = x.display_name; });
              return { rows:rows, names:names };
            });
        })
        .then(function (res) {
          var friends = [], incoming = [], outgoing = [];
          res.rows.forEach(function (f) {
            var other = f.requester === me ? f.addressee : f.requester;
            var item = { id:f.id, userId:other, status:f.status,
                         name:res.names[other] || '' };
            if (f.status === 'accepted') friends.push(item);
            else if (f.addressee === me) incoming.push(item);
            else outgoing.push(item);
          });
          return { friends:friends, incoming:incoming, outgoing:outgoing };
        })
        .catch(function (e) {
          return { friends:[], incoming:[], outgoing:[], error:(e && e.message) || 'Fehler' };
        });
    }

    function requestByCode(code) {
      var me = Auth.id();
      return db().rpc('find_by_friend_code', { code: code })
        .then(function (r) {
          if (r.error) throw r.error;
          var hit = (r.data && r.data.length) ? r.data[0] : null;
          if (!hit) return { ok:false, reason:'notfound' };
          return db().from('friendships')
            .insert({ requester: me, addressee: hit.user_id, status: 'pending' })
            .then(function (ins) {
              if (ins.error) {
                var m = (ins.error.message || '').toLowerCase();
                if (m.indexOf('duplicate') >= 0 || m.indexOf('unique') >= 0) {
                  return { ok:false, reason:'exists' };
                }
                throw ins.error;
              }
              return { ok:true, name:hit.display_name || '' };
            });
        })
        .catch(function (e) {
          return { ok:false, reason:'error', message:(e && e.message) || '' };
        });
    }

    function accept(id) {
      return db().from('friendships')
        .update({ status:'accepted', updated_at:new Date().toISOString() })
        .eq('id', id);
    }

    function remove(id) {
      return db().from('friendships').delete().eq('id', id);
    }

    function roundsOf(userId) {
      return db().from('rounds').select('*')
        .eq('user_id', userId).eq('deleted', false)
        .then(function (r) {
          if (r.error) throw r.error;
          return r.data || [];
        })
        .catch(function () { return []; });
    }

    return { loadProfile:loadProfile, setName:setName, list:list,
             requestByCode:requestByCode, accept:accept, remove:remove,
             roundsOf:roundsOf,
             reset:function () { myProfile = null; } };
  })();

              '<span class="btnrow"><button class="mini no" data-drop="' + f.id +
              '">' + I.x + '</button></span></div>';
          }).join('') + '</div>';
      }

      html += backButton('btnHome');
      content.innerHTML = html;

      document.getElementById('btnCopy').addEventListener('click', function () {
        var txt = 'Mein Pocket-Caddy-Code: ' + code;
        if (navigator.share) {
          navigator.share({ text: txt }).catch(function(){});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(code).then(function () { toast('Code kopiert.'); });
        } else { toast(code); }
      });

      document.getElementById('btnAdd').addEventListener('click', function () {
        var c = document.getElementById('fCode').value.replace(/\D/g, '');
        if (c.length !== 8) { toast('Der Code besteht aus 8 Ziffern.', true); return; }
        toast('Sende Anfrage \u2026');
        Friends.requestByCode(c).then(function (r) {
          if (r.ok) { toast('Anfrage gesendet.'); renderFriends(); return; }
          if (r.reason === 'notfound') toast('Zu diesem Code gibt es niemanden.', true);
          else if (r.reason === 'exists') toast('Mit dieser Person besteht schon eine Verbindung.', true);
          else toast('Hat nicht geklappt: ' + (r.message || 'unbekannt'), true);
        });
      });

      Array.prototype.forEach.call(content.querySelectorAll('[data-accept]'), function (el) {
        el.addEventListener('click', function () {
          Friends.accept(el.getAttribute('data-accept')).then(function (r) {
            toast(r.error ? 'Hat nicht geklappt.' : 'Best\u00e4tigt.', !!r.error);
            renderFriends();
          });
        });
      });
      Array.prototype.forEach.call(content.querySelectorAll('[data-drop]'), function (el) {
        el.addEventListener('click', function () {
          Friends.remove(el.getAttribute('data-drop')).then(function () {
            toast('Entfernt.'); renderFriends();
          });
        });
      });
      Array.prototype.forEach.call(content.querySelectorAll('[data-friend]'), function (el) {
        el.addEventListener('click', function () {
          location.hash = 'friend/' + el.getAttribute('data-friend'); route();
        });
      });

      wireBack('btnHome');
    });
  }

  /* ---------- Runden eines Freundes ---------- */
  function renderFriendRounds(userId) {
    brand.textContent = 'Freund';
    content.innerHTML = '<div class="ph">Lade \u2026</div>';

    Promise.all([Friends.list(), Friends.roundsOf(userId)]).then(function (res) {
      var f = null;
      res[0].friends.forEach(function (x) { if (x.userId === userId) f = x; });
      var rows = res[1];

      if (!f) {
        content.innerHTML =
          '<div class="empty"><b>Kein Zugriff</b>' +
          'Diese Verbindung besteht nicht (mehr).</div>' + backButton('btnHome');
        wireBack('btnHome');
        return;
      }

      var arr = rows.map(function (x) {
        var p = parseCode(x.code);
        p.date = x.date || p.date;
        p.createdAt = Date.parse(x.created_at) || 0;
        return p;
      }).filter(function (p) { return p.holes.length; });

      arr.sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.createdAt - a.createdAt;
      });

      var head = '<div class="friendhead"><span class="ava big">' +
                 esc(nameOf(f).charAt(0).toUpperCase()) + '</span>' +
                 '<span class="fname">' + esc(nameOf(f)) + '</span></div>';

      if (!arr.length) {
        content.innerHTML = head +
          '<div class="empty"><b>Noch keine Runden</b>' +
          esc(nameOf(f)) + ' hat bisher nichts gespeichert.</div>' +
          '<div class="actions"><button class="btn ghost" id="btnBackF">' +
          I.back + 'Freunde</button></div>';
        document.getElementById('btnBackF').addEventListener('click', function () {
          location.hash = 'menu/friends'; route();
        });
        return;
      }

      var best = arr.reduce(function (m, r) { return r.diff < m.diff ? r : m; }, arr[0]);
      var avg  = arr.reduce(function (s, r) { return s + r.diff; }, 0) / arr.length;

      content.innerHTML = head +
        '<div class="stats">' +
          '<div class="stat"><div class="v">' + arr.length + '</div><div class="k">Runden</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(best.diff) + '">' +
            sign(best.diff) + '</div><div class="k">Beste</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(avg) + '">' +
            (avg > 0 ? '+' : '') + avg.toFixed(1) + '</div><div class="k">Schnitt</div></div>' +
        '</div>' +
        '<div class="list">' + arr.map(function (r) {
          return '<button class="item" data-open="' + esc((r.date ? r.date + '-' : '') + r.data) + '">' +
            '<span class="big" style="color:' + colorOf(r.diff) + '">' + sign(r.diff) + '</span>' +
            '<span class="meta"><span class="d">' + (fmtDate(r.date) || 'ohne Datum') + '</span>' +
            '<span class="s">' + r.holes.length + ' L\u00f6cher &middot; ' + r.strokes +
            ' Schl\u00e4ge &middot; Par ' + r.par + '</span></span>' +
            '<span class="chev">' + I.chev + '</span></button>';
        }).join('') + '</div>' +
        '<div class="actions"><button class="btn ghost" id="btnBackF">' +
        I.back + 'Freunde</button></div>';

      Array.prototype.forEach.call(content.querySelectorAll('[data-open]'), function (el) {
        el.addEventListener('click', function () {
          location.hash = 'friend/' + userId + '/' + el.getAttribute('data-open');
          route();
        });
      });
      document.getElementById('btnBackF').addEventListener('click', function () {
        location.hash = 'menu/friends'; route();
      });
    });
  }

  /* ---------- Anmelden / Konto ---------- */
  function renderLogin() {
    brand.textContent = Auth.id() ? 'Konto' : 'Anmelden';

    if (!Auth.isOnline()) {
      content.innerHTML =
        '<div class="ph"><div class="ic">' + I.user + '</div>' +
        '<b>Keine Verbindung</b>' +
        'Die Anmeldung konnte nicht geladen werden. Pr\u00fcfe deine ' +
        'Internetverbindung und lade die Seite neu. Deine Runden auf diesem ' +
        'Ger\u00e4t sind davon nicht betroffen.</div>' + backButton('btnHome');
      wireBack('btnHome');
      return;
    }

    // Kommt der Nutzer aus der "Passwort vergessen"-Mail, zuerst das neue
    // Passwort setzen lassen, bevor irgendetwas anderes angezeigt wird.
    if (Auth.isRecovery()) {
      brand.textContent = 'Passwort';
      content.innerHTML =
        '<div class="panel"><h3>Neues Passwort setzen</h3>' +
        '<p>Du bist \u00fcber den Link aus der E-Mail hier gelandet. ' +
        'Vergib jetzt ein neues Passwort.</p>' +
        '<div class="form">' +
        '<input type="password" id="fNew" placeholder="Neues Passwort" ' +
        'autocomplete="new-password">' +
        '<input type="password" id="fNew2" placeholder="Noch einmal wiederholen" ' +
        'autocomplete="new-password">' +
        '</div>' +
        '<div class="actions"><button class="btn" id="btnSetPw">Passwort speichern</button></div>' +
        '<p class="warn">Speichere es am besten gleich im Passwortmanager ' +
        'deines Ger\u00e4ts.</p></div>';

      document.getElementById('btnSetPw').addEventListener('click', function () {
        var a  = document.getElementById('fNew').value;
        var a2 = document.getElementById('fNew2').value;
        if (a.length < 6) { toast('Das Passwort braucht mindestens 6 Zeichen.', true); return; }
        if (a !== a2)     { toast('Die beiden Eingaben stimmen nicht \u00fcberein.', true); return; }
        toast('Speichere \u2026');
        Auth.updatePassword(a).then(function (r) {
          if (r.error) { toast(loginError(r.error), true); return; }
          Auth.clearRecovery();
          toast('Passwort ge\u00e4ndert.');
          renderLogin();
        });
      });
      return;
    }

    if (Auth.id()) {
      var n = Store.all().length;
      content.innerHTML =
        '<div class="panel"><h3>Angemeldet</h3>' +
        '<p>' + esc(Auth.email()) + '<br><br>' +
        'Deine Runden liegen in deinem Konto und sind auf jedem Ger\u00e4t da, ' +
        'auf dem du dich anmeldest. Aktuell gespeichert: ' + n +
        (n === 1 ? ' Runde.' : ' Runden.') + '</p>' +
        '<div class="actions">' +
        '<button class="btn ghost" id="btnSync">' + I.sync + 'Jetzt abgleichen</button>' +
        '<button class="btn ghost" id="btnOut">Abmelden</button></div></div>' +

        '<div class="panel"><h3>Anzeigename</h3>' +
        '<p>Unter diesem Namen sehen dich deine Freunde. Ohne Namen erscheinst ' +
        'du dort nur als &bdquo;Spieler&ldquo;.</p>' +
        '<div class="form"><input type="text" id="fName" placeholder="Dein Name" ' +
        'maxlength="40" autocomplete="nickname"></div>' +
        '<div class="actions"><button class="btn ghost" id="btnName">Namen speichern</button></div></div>' +
        backButton('btnHome');

      Friends.loadProfile().then(function (p) {
        var el = document.getElementById('fName');
        if (el && p && p.display_name) el.value = p.display_name;
      });

      document.getElementById('btnName').addEventListener('click', function () {
        var v = document.getElementById('fName').value.trim();
        if (!v) { toast('Bitte einen Namen eintragen.', true); return; }
        Friends.setName(v).then(function (r) {
          if (r.error) { toast('Hat nicht geklappt.', true); return; }
          toast('Name gespeichert.');
          buildMenu();
        });
      });

      document.getElementById('btnSync').addEventListener('click', function () {
        toast('Gleiche ab \u2026');
        Store.sync().then(function (r) {
          if (r.ok) { toast('Abgeglichen.'); renderLogin(); }
          else toast('Abgleich fehlgeschlagen: ' + (r.error || 'kein Netz'), true);
        });
      });
      document.getElementById('btnOut').addEventListener('click', function () {
        Friends.reset();
        Auth.signOut().then(function () {
          toast('Abgemeldet.');
          location.hash = ''; route();
        });
      });
      wireBack('btnHome');
      return;
    }

    content.innerHTML =
      '<div class="panel"><h3>Anmelden</h3>' +
      '<p>Mit einem Konto liegen deine Runden nicht nur auf diesem Ger\u00e4t. ' +
      'Ohne Anmeldung funktioniert alles wie bisher, nur eben lokal.</p>' +

      '<button class="btn google" id="btnGoogle">' +
      '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>' +
      'Mit Google anmelden</button>' +
      '<div class="orline"><span>oder mit E-Mail</span></div>' +

      '<div class="form">' +
      '<input type="email" id="fEmail" placeholder="E-Mail" autocomplete="email" ' +
      'inputmode="email" autocapitalize="off" spellcheck="false">' +
      '<input type="password" id="fPass" placeholder="Passwort" ' +
      'autocomplete="current-password">' +
      '</div>' +
      '<div class="actions">' +
      '<button class="btn" id="btnIn">Anmelden</button>' +
      '<button class="btn ghost" id="btnUp">Neu registrieren</button>' +
      '</div>' +
      '<div class="linkrow"><button class="linkbtn" id="btnForgot">' +
      'Passwort vergessen?</button></div>' +
      '<p class="warn">Die Mail kommt von Supabase und landet erfahrungs' +
      'gem\u00e4\u00df oft im Spam-Ordner. Schau dort nach, falls nichts ' +
      'ankommt.</p></div>' + backButton('btnHome');

    function creds() {
      var e = document.getElementById('fEmail').value.trim();
      var p = document.getElementById('fPass').value;
      if (!e || !p) { toast('Bitte E-Mail und Passwort eingeben.', true); return null; }
      if (p.length < 6) { toast('Das Passwort braucht mindestens 6 Zeichen.', true); return null; }
      return { e:e, p:p };
    }

    function afterLogin() {
      var res = Store.claimLocal();
      Store.sync().then(function () {
        location.hash = ''; route();
        if (res.moved) {
          toastAction(res.moved + (res.moved === 1 ? ' lokale Runde' : ' lokale Runden') +
                      ' \u00fcbernommen.', 'R\u00fcckg\u00e4ngig', function () {
            Store.undoClaim(res.ids);
            toast('Wieder entfernt.');
            route();
          });
        } else {
          toast('Angemeldet.');
        }
      });
    }

    document.getElementById('btnGoogle').addEventListener('click', function () {
      toast('Weiterleitung zu Google \u2026');
      Auth.signInWithProvider('google').then(function (r) {
        if (r && r.error) toast(loginError(r.error), true);
        // Bei Erfolg leitet die Seite selbst weiter, hier ist nichts mehr zu tun.
      });
    });

    document.getElementById('btnIn').addEventListener('click', function () {
      var c = creds(); if (!c) return;
      toast('Melde an \u2026');
      Auth.signIn(c.e, c.p).then(function (r) {
        if (r.error) { toast(loginError(r.error), true); return; }
        afterLogin();
      });
    });

    document.getElementById('btnUp').addEventListener('click', function () {
      var c = creds(); if (!c) return;
      toast('Lege Konto an \u2026');
      Auth.signUp(c.e, c.p).then(function (r) {
        if (r.error) { toast(loginError(r.error), true); return; }
        if (r.data && r.data.session) { afterLogin(); return; }
        // Ohne Sitzung: die Bestaetigung per Mail ist noch eingeschaltet
        toast('Konto angelegt, aber noch nicht best\u00e4tigt. In Supabase ' +
              'muss "Confirm email" ausgeschaltet sein.', true);
      });
    });

    document.getElementById('btnForgot').addEventListener('click', function () {
      var e = document.getElementById('fEmail').value.trim();
      if (!e) { toast('Bitte zuerst deine E-Mail eintragen.', true); return; }
      toast('Schicke Mail \u2026');
      Auth.resetPassword(e).then(function (r) {
        if (r.error) { toast(loginError(r.error), true); return; }
        // Bewusst neutral formuliert: die Antwort verraet nicht, ob es zu
        // dieser Adresse ueberhaupt ein Konto gibt.
        toast('Falls es ein Konto gibt, ist die Mail unterwegs. Auch im Spam schauen.');
      });
    });

    wireBack('btnHome');
  }

  function loginError(err) {
    var m = (err && err.message ? err.message : '').toLowerCase();
    if (m.indexOf('invalid login') >= 0)    return 'E-Mail oder Passwort stimmt nicht.';
    if (m.indexOf('already registered') >= 0) return 'Zu dieser E-Mail gibt es schon ein Konto.';
    if (m.indexOf('not confirmed') >= 0)    return 'Konto noch nicht best\u00e4tigt. In Supabase "Confirm email" ausschalten.';
    if (m.indexOf('rate limit') >= 0)       return 'Zu viele Versuche, bitte kurz warten.';
    if (m.indexOf('signups not allowed') >= 0) return 'Registrierung ist derzeit geschlossen.';
    if (m.indexOf('provider is not enabled') >= 0 || m.indexOf('unsupported provider') >= 0)
      return 'Google ist in Supabase noch nicht als Anbieter aktiviert.';
    return err && err.message ? err.message : 'Es hat nicht geklappt.';
  }

  /* ---------- Platzhalter ---------- */
  var PAGES = {
    'menu/stats':{ title:'Statistik', icon:I.chart, head:'Statistik kommt noch',
      text:'Hier siehst du sp\u00e4ter deine Entwicklung \u00fcber die Runden, den Schnitt pro Loch und wo du am meisten Schl\u00e4ge verlierst.' },
    'menu/friends':{ title:'Freunde', icon:I.users, head:'Freunde kommen noch',
      text:'Geplant ist, Runden mit Freunden zu vergleichen und zu teilen. Bis dahin kannst du eine einzelne Runde \u00fcber den Teilen-Knopf als Link verschicken.' }
  };
  function renderPlaceholder(key) {
    var p = PAGES[key];
    brand.textContent = p.title;
    content.innerHTML =
      '<div class="ph"><div class="ic">' + p.icon + '</div><b>' + p.head + '</b>' +
      p.text + '<div><span class="soon">in Arbeit</span></div></div>' + backButton('btnHome');
    wireBack('btnHome');
  }

  function renderAbout() {
    brand.textContent = '\u00dcber';
    content.innerHTML =
      '<div class="ph"><div class="ic">' + I.info + '</div><b>Pocket Caddy</b>' +
      'Scorecard-Ansicht f\u00fcr den selbstgebauten Golf-Schlagz\u00e4hler.<br><br>' +
      'Alle Runden werden ausschlie\u00dflich lokal in diesem Browser gespeichert. ' +
      'Es werden keine Daten an einen Server \u00fcbertragen.<br><br>' +
      'Speicherformat: 2<br>Gespeicherte Runden: ' + Store.all().length + '<br>' +
      'Speicher verf\u00fcgbar: ' + (Store.available() ? 'ja' : 'nein') +
      '</div>' + backButton('btnHome');
    wireBack('btnHome');
  }

  /* ---------- Weiche ---------- */
  function route() {
    closeMenu(); window.scrollTo(0,0);
    var raw = (location.hash || '').replace(/^#/, '');
    if (!raw)                 { renderHome(); return; }
    if (raw === 'menu/login') { renderLogin(); return; }
    if (raw === 'menu/friends'){ renderFriends(); return; }

    // Freund: friend/<id>  oder  friend/<id>/<runde>
    var fm = /^friend\/([0-9a-f-]{36})(?:\/(.+))?$/.exec(raw);
    if (fm) {
      if (!fm[2]) { renderFriendRounds(fm[1]); return; }
      var fr = parseCode(fm[2]);
      if (!fr.holes.length) { location.hash = 'friend/' + fm[1]; route(); return; }
      Friends.list().then(function (d) {
        var f = null;
        d.friends.forEach(function (x) { if (x.userId === fm[1]) f = x; });
        if (!f) { location.hash = 'menu/friends'; route(); return; }
        renderRound(fr, { owner: nameOf(f), back: 'friend/' + fm[1] });
      });
      return;
    }
    if (raw === 'menu/backup'){ renderBackup(); return; }
    if (raw === 'menu/about') { renderAbout(); return; }
    if (PAGES[raw])           { renderPlaceholder(raw); return; }

    var r = parseCode(raw);
    if (!r.holes.length) {
      brand.textContent = 'Pocket Caddy';
      content.innerHTML =
        '<div class="empty"><b>Daten nicht lesbar</b>' +
        'Der Link scheint unvollst\u00e4ndig zu sein. Bitte den QR-Code neu scannen.</div>' +
        backButton('btnHome');
      wireBack('btnHome');
      return;
    }
    renderRound(r);
  }

  // Erst den Kontostand ermitteln, dann zeichnen. Sonst wuerde kurz die
  // Ablage ohne Anmeldung angezeigt und danach umspringen.
  Auth.onChange(function () { buildMenu(); route(); });

  Auth.init(function () {
    buildMenu();
    route();
    if (Auth.id()) {
      Store.sync().then(function (r) { if (r && r.ok) route(); });
    }
  });

  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
