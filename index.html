  // Nur erreichbar, wenn Friends.isAdmin() den Menuepunkt ueberhaupt
  // anzeigt - die eigentliche Absicherung passiert aber serverseitig in
  // approve_club_request()/reject_club_request() (siehe 05_golfplaetze.sql),
  // nicht hier im Frontend.
  function renderAdmin() {
    brand.textContent = 'Admin';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    // "Golfplaetze verwalten" (Loch/Par/Distanzen fuer JEDEN Platz, siehe
    // renderAdminClubEdit()) steht IMMER da, unabhaengig von offenen
    // Anfragen - anders als die zwei Anfrage-Listen darunter, die ganz
    // wegfallen koennen, wenn gerade nichts offen ist.
    function clubManagementHtml() {
      return '<div class="sectionhead"><span class="t">Golfplätze verwalten</span></div>' +
        '<div class="form">' +
        '<input type="text" id="adminClubSearch" maxlength="80" placeholder="Golfplatz suchen …"></div>' +
        '<div id="adminClubList"></div>' +
        '<div class="actions"><button class="btn ghost" id="btnAdminNewClub">' +
        '+ Neuen Golfplatz anlegen</button></div>' +
        '<div class="panel" id="adminNewClubForm" style="display:none;margin-top:10px">' +
        '<div class="form">' +
        '<input type="text" id="ncName" maxlength="80" placeholder="Name des Platzes (Pflicht)">' +
        '<textarea id="ncDesc" maxlength="2000" placeholder="Beschreibung" rows="2"></textarea>' +
        '<input type="text" id="ncAddress" maxlength="200" placeholder="Adresse">' +
        '<input type="text" id="ncPhone" maxlength="40" placeholder="Telefon">' +
        '<input type="text" id="ncWebsite" maxlength="200" placeholder="Website">' +
        '<input type="text" id="ncPrice" maxlength="200" placeholder="Preise (optional)">' +
        '</div>' +
        '<p class="hint">Legt ein neues Golfplatz-Konto an, ohne dass sich vorher jemand ' +
        'registrieren muss - Löcher/Par und der Freischalt-Status lassen sich direkt danach ' +
        'auf der neuen Platzseite eintragen.</p>' +
        '<div class="actions">' +
        '<button class="btn" id="btnCreateClub">Anlegen</button>' +
        '<button class="btn ghost" id="btnCancelNewClub">Abbrechen</button>' +
        '</div></div>';
    }
    function wireClubManagement(clubs) {
      function rowHtml(c) {
        var n = c.courses.length;
        return '<div class="item" data-admin-club="' + c.id + '">' +
          avaHtml(c.avatarUrl || c.coverImageUrl, c.name, '', '', 'club') +
          '<span class="meta"><span class="d">' + esc(c.name || 'Golfplatz') +
          (c.verified === false ? ' <span class="badge">nicht freigeschaltet</span>' : '') + '</span>' +
          '<span class="s">' + (n ? (n + (n === 1 ? ' Platz' : ' Plätze')) : 'Noch keine Plätze') +
          '</span></span></div>';
      }
      function wireRows(listEl) {
        Array.prototype.forEach.call(listEl.querySelectorAll('[data-admin-club]'), function (el) {
          el.addEventListener('click', function () {
            location.hash = 'menu/admin/club/' + el.getAttribute('data-admin-club'); route();
          });
        });
      }
      mountFilterableClubList(document.getElementById('adminClubSearch'),
        document.getElementById('adminClubList'), clubs, rowHtml, wireRows);

      var formEl = document.getElementById('adminNewClubForm');
      document.getElementById('btnAdminNewClub').addEventListener('click', function () {
        formEl.style.display = '';
      });
      document.getElementById('btnCancelNewClub').addEventListener('click', function () {
        formEl.style.display = 'none';
      });
      document.getElementById('btnCreateClub').addEventListener('click', function () {
        var name = document.getElementById('ncName').value.trim();
        if (!name) { toast('Bitte einen Namen eintragen.', true); return; }
        toast('Lege an …');
        Club.createClubAsAdmin({
          name: name,
          description: document.getElementById('ncDesc').value.trim(),
          address: document.getElementById('ncAddress').value.trim(),
          phone: document.getElementById('ncPhone').value.trim(),
          website: document.getElementById('ncWebsite').value.trim(),
          price_info: document.getElementById('ncPrice').value.trim()
        }).then(function (r) {
          if (r.error || !r.data || !r.data.ok) {
            toast('Hat nicht geklappt: ' + (r.error ? r.error.message : 'unbekannt'), true);
            return;
          }
          toast('Golfplatz angelegt.');
          location.hash = 'menu/admin/club/' + r.data.id; route();
        });
      });
    }

    Promise.all([Club.pendingRequests(), Verify.pendingRequests(), Club.allClubsList()])
      .then(function (res) {
      var clubReqs = res[0], roleReqs = res[1], clubs = res[2];

      if (!clubReqs.length && !roleReqs.length) {
        content.innerHTML = clubManagementHtml();
        wireClubManagement(clubs);
        return;
      }

      // Gemeinsame Zeile fuer beide Anfrage-Arten (Golfplatz/Rolle) - title
      // kommt bereits fertig escaped vom Aufrufer, da sich der Aufbau
      // unterscheidet (Rollen-Anfrage haengt die gewuenschte Rolle an).
      function requestRowHtml(r, title, kind) {
        return '<div class="event"><div class="eventtitle">' + title + '</div>' +
          (r.message ? '<div class="eventloc">' + esc(r.message) + '</div>' : '') +
          '<div class="eventwho">Angefragt am ' + fmtDateTime(r.requested_at) + '</div>' +
          '<div class="actions tight">' +
          '<button class="btn" data-approve-' + kind + '="' + r.user_id + '">Freischalten</button>' +
          '<button class="btn ghost" data-reject-' + kind + '="' + r.user_id + '">Ablehnen</button>' +
          '</div></div>';
      }
      // Freischalten/Ablehnen fuer eine der beiden Anfrage-Arten verdrahten -
      // approveFn/rejectFn sind Club.approveRequest/rejectRequest oder
      // Verify.approveRequest/rejectRequest, je nach kind.
      function wireRequestActions(kind, approveFn, rejectFn) {
        Array.prototype.forEach.call(document.querySelectorAll('[data-approve-' + kind + ']'), function (el) {
          el.addEventListener('click', function () {
            toast('Schalte frei …');
            approveFn(el.getAttribute('data-approve-' + kind)).then(function (r) {
              if (r.error) { toast('Hat nicht geklappt: ' + r.error.message, true); return; }
              toast('Freigeschaltet.'); renderAdmin();
            });
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-reject-' + kind + ']'), function (el) {
          el.addEventListener('click', function () {
            var reqId = el.getAttribute('data-reject-' + kind);
            confirmDialog('Diese Anfrage wirklich ablehnen?', 'Ablehnen').then(function (ok) {
              if (!ok) return;
              rejectFn(reqId).then(function (r) {
                if (r.error) { toast('Hat nicht geklappt: ' + r.error.message, true); return; }
                toast('Abgelehnt.'); renderAdmin();
              });
            });
          });
        });
      }

      var ids = clubReqs.map(function (r) { return r.user_id; })
        .concat(roleReqs.map(function (r) { return r.user_id; }));

      Auth.db().from('profiles').select('user_id,display_name').in('user_id', ids)
        .then(function (pr) {
          var names = {};
          (pr.data || []).forEach(function (p) { names[p.user_id] = p.display_name; });

          var html = '';

          if (clubReqs.length) {
            html += '<div class="sectionhead"><span class="t">Golfplatz-Anfragen</span>' +
              '<span class="c">' + clubReqs.length + '</span></div><div class="list">';
            clubReqs.forEach(function (r) {
              html += requestRowHtml(r, esc(names[r.user_id] || 'Spieler'), 'club');
            });
            html += '</div>';
          }

          if (roleReqs.length) {
            html += '<div class="sectionhead"><span class="t">Verifizierungs-Anfragen</span>' +
              '<span class="c">' + roleReqs.length + '</span></div><div class="list">';
            roleReqs.forEach(function (r) {
              html += requestRowHtml(r,
                esc(names[r.user_id] || 'Spieler') + ' – ' + esc(roleLabel(r.requested_role)), 'role');
            });
            html += '</div>';
          }

          html += clubManagementHtml();
          content.innerHTML = html;
          wireClubManagement(clubs);

          wireRequestActions('club', Club.approveRequest, Club.rejectRequest);
          wireRequestActions('role', Verify.approveRequest, Verify.rejectRequest);
        });
    });
  }

  // ---------- Kalenderdatei (.ics) ----------
  function icsEscape(s) {
    return String(s || '').replace(/\\/g,'\\\\').replace(/,/g,'\\,')
                           .replace(/;/g,'\\;').replace(/\r\n|\r|\n/g,'\\n');
  }
  function icsDate(d) {
    return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  }
  function downloadEventIcs(ev) {
    var start = new Date(ev.date);
    var end = new Date(start.getTime() + 3 * 60 * 60 * 1000); // 3 Std. Standarddauer
    var names = ev.invites.map(function (i) { return i.name; }).concat(ev.creatorName);
    var uniqueNames = names.filter(function (n, i) { return names.indexOf(n) === i; });
    var lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pocket Caddy//DE','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + ev.id + '@pocketcaddy',
      'DTSTAMP:' + icsDate(new Date()),
      'DTSTART:' + icsDate(start),
      'DTEND:' + icsDate(end),
      'SUMMARY:' + icsEscape(ev.title || 'Golfrunde'),
      ev.location ? 'LOCATION:' + icsEscape(ev.location) : null,
      'DESCRIPTION:' + icsEscape('Mit: ' + uniqueNames.join(', ')),
      'END:VEVENT','END:VCALENDAR'
    ].filter(Boolean);

    var blob = new Blob([lines.join('\r\n')], { type:'text/calendar' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'golfrunde-' + (ev.date || '').slice(0,10) + '.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ---------- Freunde ---------- */
  function nameOf(item) {
    return item.name || 'Spieler';
  }

  // Kleines Abzeichen oben rechts auf dem Profilbild: gruene Fahne (wie
  // das Logo) fuer Admin/Team-Konten, blauer Haken fuer verifizierte
  // Trainer/Profis/Influencer, weisser Punkt mit Haus fuer verifizierte
  // Golfplaetze. Immer gleiche Stelle/Groesse, egal welcher Typ.
  function avaBadgeHtml(badge) {
    if (badge === 'admin')    return '<span class="avabadge admin" title="Pocket Caddy Team">' + I.flag + '</span>';
    if (badge === 'verified') return '<span class="avabadge verified" title="Verifiziert">' + I.check + '</span>';
    if (badge === 'club')     return '<span class="avabadge club" title="Verifizierter Golfplatz">' + I.home + '</span>';
    return '';
  }

  function roleLabel(role) {
    return { trainer:'Trainer', profi:'Profi', influencer:'Influencer' }[role] || '';
  }

  // Baut einen Avatar: eigenes Profilbild, falls vorhanden, sonst wie
  // bisher ein Kreis mit dem ersten Buchstaben des Namens. extraClass
  // z.B. "big"/"small" fuer die vorhandenen Groessen-Varianten von .ava.
  // badge (optional): 'admin'/'verified'/'club', siehe avaBadgeHtml().
  function avaHtml(url, letter, extraClass, extraAttrs, badge) {
    var cls = 'ava' + (extraClass ? ' ' + extraClass : '');
    var attrs = extraAttrs ? ' ' + extraAttrs : '';
    var badgeHtml = avaBadgeHtml(badge);
    if (url) {
      return '<span class="' + cls + '"' + attrs + '><img src="' + esc(url) + '" alt="" ' +
             'style="width:100%;height:100%;object-fit:cover;border-radius:inherit">' + badgeHtml + '</span>';
    }
    return '<span class="' + cls + '"' + attrs + '>' +
           esc((letter || '?').charAt(0).toUpperCase()) + badgeHtml + '</span>';
  }

  /* ---------- Freund hinzufügen ---------- */

    Friends.loadProfile().then(function (prof) {

        'deine Runden.</p>' +
        '<div class="codebox" id="codeBox">' + esc(pretty) + '</div>' +
        '<div class="actions"><button class="btn ghost" id="btnCopy">' +

        '<div class="panel"><h3>Freund per Code hinzuf\u00fcgen</h3>' +
        '<p>Code deines Freundes eintippen. Er bekommt dann eine Anfrage, ' +
        'die er best\u00e4tigen muss.</p>' +
        '<div class="form"><input type="text" id="fCode" placeholder="8-stelliger Code" ' +

      document.getElementById('btnCopy').addEventListener('click', function () {
        var txt = 'Mein Pocket-Caddy-Code: ' + code;
        if (navigator.share) {
          navigator.share({ text: txt }).catch(function(){});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(code).then(function () { toast('Code kopiert.'); });
        } else { toast(code); }
      });

      document.getElementById('btnAdd').addEventListener('click', function () {
        var c = document.getElementById('fCode').value.replace(/\D/g, '');
        if (c.length !== 8) { toast('Der Code besteht aus 8 Ziffern.', true); return; }
        toast('Sende Anfrage \u2026');
        Friends.requestByCode(c).then(function (r) {
          if (r.ok) { toast('Anfrage gesendet.'); location.hash = 'menu/friendlist'; route(); return; }
          if (r.reason === 'notfound') toast('Zu diesem Code gibt es niemanden.', true);
          else if (r.reason === 'exists') toast('Mit dieser Person besteht schon eine Verbindung.', true);
          else toast('Hat nicht geklappt: ' + (r.message || 'unbekannt'), true);
        });
      });

      document.getElementById('btnBackFriends').addEventListener('click', function () {
        location.hash = 'menu/friendlist'; route();
      });
    });

  /* ---------- Runden eines Freundes ---------- */
  /* ---------- Planen ---------- */
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
           ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' Uhr';
  }
  function statusColor(s) {
    return s === 'accepted' ? 'var(--lime)' : (s === 'declined' ? 'var(--bad)' : 'var(--mut)');
  }
  function isConfirmed(ev) {
    return ev.invites.length === 0 || ev.invites.every(function (i) { return i.status === 'accepted'; });
  }

  // Inhalt des aufklappbaren "Neuer Termin"-Bereichs. Bewusst direkt auf
  // der Seite statt in einem schiebenden Sheet: ein CSS-transform auf
  // einem Vorfahren (wie beim Sheet fuer die Schiebe-Animation) bringt in
  // etlichen Browsern den nativen Datum/Uhrzeit-Picker durcheinander oder
  // verhindert ihn ganz. Datum/Uhrzeit als zwei GANZ NORMALE, sichtbare
  // native Felder (kein verstecktes Feld + Knopf-Umweg mehr wie sonst im
  // Projekt ueblich): dieser Umweg hat sich hier auf dem Handy als nicht
  // zuverlaessig gezeigt, ein echtes natives Feld funktioniert dagegen
  // garantiert, nur eben schmaler als 100% Breite statt versteckt.
  // Freunde als antippbare Avatare statt Abhak-Kaestchen: ausgewaehlt =
  // gruener Kranz (.pickava.on), siehe CSS.
  function eventFormHtml(friends) {
    var html = '<div class="panel"><h3>Neuer Termin</h3>' +
      '<div class="form"><input type="text" id="fTitle" placeholder="Titel (z.B. Golfrunde)" ' +
      'maxlength="60" autocomplete="off"></div>' +
      '<div class="dtrow">' +
      '<div class="dtcol"><label class="dtlabel" for="fDate">Datum</label>' +
      '<input type="date" id="fDate" class="dtinput"></div>' +
      '<div class="dtcol"><label class="dtlabel" for="fTime">Uhrzeit</label>' +
      '<input type="time" id="fTime" class="dtinput"></div>' +
      '</div>' +
      '<div class="form"><button type="button" class="btn ghost" id="fCoursePickBtn" ' +
      'style="width:100%;justify-content:space-between">' +
      '<span id="fCoursePickLabel">Kurs wählen</span>' + I.chev + '</button></div>';

    if (!friends.length) {
      html += '<p class="hint" style="margin-top:0">Noch keine Freunde zum Einladen. ' +
              'Füg welche über den Punkt Freunde hinzu, du kannst den Termin ' +
              'aber auch ohne Einladung für dich selbst anlegen.</p>';
    } else {
      html += '<div class="pickrow">' + friends.map(function (f) {
        return '<button type="button" class="pickava" data-uid="' + f.userId + '">' +
               avaHtml(f.avatarUrl, nameOf(f), '', '', badgeTypeFor(f.isAdmin, f.verifiedRole)) +
               '<span class="fname">' + esc(nameOf(f)) + '</span></button>';
      }).join('') + '</div>';
    }

    html += '<div class="actions"><button class="btn" id="btnCreate">Termin anlegen</button></div></div>';
    return html;
  }

  function wireEventForm(slot) {
    var dateInput = slot.querySelector('#fDate');
    var timeInput = slot.querySelector('#fTime');
    [dateInput, timeInput].forEach(function (el) {
      el.addEventListener('input', function () { el.classList.toggle('has-value', !!el.value); });
    });

    // Verein+Platz waehlen -> eigenes Popup statt nativem <select> (siehe
    // openClubPick()). club_id/course_id werden mitgespeichert (fuer den
    // Live-Start direkt am Termin, siehe renderPlan()); location bleibt
    // trotzdem ein reiner Anzeige-Text, der bei einer spaeteren
    // Umbenennung des Kurses stabil bleibt.
    var pickBtn = slot.querySelector('#fCoursePickBtn');
    var pickLabel = slot.querySelector('#fCoursePickLabel');
    var pickedClub = null, pickedCourse = null;
    pickBtn.addEventListener('click', function () {
      openClubPick(function (club, course) {
        pickedClub = club; pickedCourse = course;
        pickLabel.textContent = club.name + ' – ' + (course.name || 'Platz');
      });
    });

    var selected = {};
    Array.prototype.forEach.call(slot.querySelectorAll('.pickava'), function (btn) {
      btn.addEventListener('click', function () {
        var uid = btn.getAttribute('data-uid');
        btn.classList.toggle('on');
        if (btn.classList.contains('on')) selected[uid] = true; else delete selected[uid];
      });
    });

    slot.querySelector('#btnCreate').addEventListener('click', function () {
      var title = slot.querySelector('#fTitle').value.trim();
      if (!dateInput.value || !timeInput.value) {
        toast('Bitte Datum und Uhrzeit wählen.', true); return;
      }
      var d = new Date(dateInput.value + 'T' + timeInput.value);
      if (isNaN(d.getTime())) { toast('Datum konnte nicht gelesen werden.', true); return; }
      var loc = pickedClub ? (pickedClub.name + ' – ' + (pickedCourse.name || 'Platz')) : null;

      toast('Lege Termin an …');
      Planner.create({
        date: d.toISOString(), location: loc, title: title,
        clubId: pickedClub ? pickedClub.id : null,
        courseId: pickedCourse ? pickedCourse.id : null
      }, Object.keys(selected)).then(function (r) {
        if (!r.ok) { toast('Hat nicht geklappt: ' + (r.message || 'unbekannt'), true); return; }
        slot.innerHTML = '';
        toast('Termin angelegt.');
        renderPlan();
      });
    });
  }

    brand.textContent = 'Planen';

    if (!Auth.id()) {

      var html = '<div class="actions" style="margin-bottom:18px">' +
        '<button class="btn" id="btnNewEvent"><svg viewBox="0 0 24 24" width="17" height="17">' +

        html += '<div class="empty"><b>Noch keine geplanten Runden</b>' +
                'Leg \u00fcber "Neuer Termin" eine neue Runde an.</div>';
      } else {
        html += '<div class="sectionhead"><span class="t">Termine</span>' +
                '<span class="c">' + events.length + '</span></div><div class="list">';

        events.forEach(function (ev) {
          var past = new Date(ev.date) < new Date();
          var confirmed = isConfirmed(ev);
          var mine = ev.invites.filter(function (i) { return i.isMe; })[0];

          html += '<div class="event' + (past ? ' past' : '') + '">' +
            '<div class="eventtitle">' + esc(ev.title || 'Golfrunde') + '</div>' +
            '<div class="eventhead"><span class="eventdate">' + fmtDateTime(ev.date) + '</span>' +
            (past ? '<span class="badge">vorbei</span>' : (confirmed ? '<span class="badge ok">best\u00e4tigt</span>' : '')) +
            '</div>' +
            (ev.location ? '<div class="eventloc">' + esc(ev.location) + '</div>' : '') +
            '<div class="eventwho">' + (ev.isMine ? 'Du hast eingeladen' : 'Von ' + esc(ev.creatorName)) + '</div>';

          if (ev.invites.length) {
            html += '<div class="avarow">' + ev.invites.map(function (i) {
              if (i.avatarUrl) {
                return '<span class="avachip" style="color:' + statusColor(i.status) + '" title="' +
                       esc(nameOf(i)) + '"><img src="' + esc(i.avatarUrl) + '" alt="" ' +
                       'style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></span>';
              }
              return '<span class="avachip" style="color:' + statusColor(i.status) + '" title="' +
                     esc(nameOf(i)) + '">' + esc(nameOf(i).charAt(0).toUpperCase()) + '</span>';
            }).join('') + '</div>';
          }

          if (mine && mine.status === 'pending') {
            html += '<div class="actions tight">' +
              '<button class="mini ok" data-accept-invite="' + mine.id + '">' + I.check + '</button>' +
              '<button class="mini no" data-decline-invite="' + mine.id + '">' + I.x + '</button>' +
              '<span style="align-self:center;color:var(--mut);font-size:13px">zusagen?</span></div>';
          }

          if (confirmed && !past) {
            html += '<div class="actions tight">' +
              '<button class="btn ghost" data-ics="' + ev.id + '">' + I.down + 'Kalender</button></div>';
          }

          if (ev.clubId && ev.courseId) {
            var evTime = new Date(ev.date).getTime(), now2 = Date.now();
            var liveWindow = now2 >= evTime - 30 * 60000 && now2 <= evTime + 60 * 60000;
            html += '<div class="actions tight">';
            if (liveWindow) {
              html += '<button class="btn" data-live="' + ev.clubId + '/' + ev.courseId + '">Live spielen</button>';
            }
            html += '<button class="btn ghost" data-enter-result="' + ev.clubId + '/' + ev.courseId + '">Ergebnisse eintragen</button></div>';
          }

          if (ev.isMine) {
            html += '<div class="linkrow"><button class="linkbtn" data-cancel="' + ev.id + '">Termin absagen</button></div>';
          }

          html += '</div>';
        });

        html += '</div>';
      }

      content.innerHTML = html;

      document.getElementById('btnNewEvent').addEventListener('click', function () {
        var slot = document.getElementById('newEventSlot');
        if (slot.innerHTML) { slot.innerHTML = ''; return; }
        slot.innerHTML = eventFormHtml(friends);
        wireEventForm(slot);
      });

      Array.prototype.forEach.call(content.querySelectorAll('[data-accept-invite]'), function (el) {
        el.addEventListener('click', function () {
          Planner.respond(el.getAttribute('data-accept-invite'), 'accepted').then(function () {
            toast('Zugesagt.'); renderPlan();
          });
        });
      });
      Array.prototype.forEach.call(content.querySelectorAll('[data-decline-invite]'), function (el) {
        el.addEventListener('click', function () {
          Planner.respond(el.getAttribute('data-decline-invite'), 'declined').then(function () {

      Array.prototype.forEach.call(content.querySelectorAll('[data-cancel]'), function (el) {

        });
      });

    });

  function renderFriendRounds(userId) {
    brand.textContent = 'Freund';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    Promise.all([Friends.list(), Friends.roundsOf(userId)]).then(function (res) {
      var f = null;
      res[0].friends.forEach(function (x) { if (x.userId === userId) f = x; });
      var rows = res[1];

      if (!f) {
        content.innerHTML =
          '<div class="empty"><b>Kein Zugriff</b>' +
          'Diese Verbindung besteht nicht (mehr).</div>';
        return;
      }

      var arr = rows.map(function (x) {
        var p = parseCode(x.code);
        p.date = x.date || p.date;
        p.createdAt = Date.parse(x.created_at) || 0;
        return p;
      }).filter(function (p) { return p.holes.length; });

      arr.sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.createdAt - a.createdAt;
      });

      var badgeType = badgeTypeFor(f.isAdmin, f.verifiedRole);
      var roleText = f.verifiedRole ? roleLabel(f.verifiedRole) : '';
      var head = '<div class="friendhead" id="friendHead">' + avaHtml(f.avatarUrl, nameOf(f), 'big zoomable', '', badgeType) +
                 '<div class="namewrap"><span class="fname">' + esc(nameOf(f)) + '</span>' +
                 (roleText ? '<div class="roletag">' + esc(roleText) + '</div>' : '') +
                 '</div></div>';

      // Golfplatz-Abzeichen braucht eine eigene Abfrage (verified liegt in
      // golf_clubs, nicht in profiles) - deshalb erst nachtraeglich gesetzt,
      // blockiert nicht das eigentliche Rendern.
      function applyClubBadgeIfNeeded() {
        if (badgeType || f.accountType !== 'club') return;
        Club.isVerified(f.userId).then(function (verified) {
          if (!verified) return;
          var wrap = document.getElementById('friendHead');
          if (wrap) {
            wrap.querySelector('.ava').outerHTML = avaHtml(f.avatarUrl, nameOf(f), 'big zoomable', '', 'club');
          }
        });
      }

      function wireBackAndRemove() {
        document.getElementById('btnBackF').addEventListener('click', function () {
          location.hash = 'menu/friendlist'; route();
        });
        document.getElementById('btnRemoveFriend').addEventListener('click', function () {
          confirmDialog('Diese Freundschaft wirklich beenden?', 'Beenden').then(function (ok) {
            if (!ok) return;
            Friends.remove(f.id).then(function () {
              toast('Freundschaft beendet.');
              location.hash = 'menu/friendlist'; route();
            });
          });
        });
      }
      var removeActionHtml = '<button class="btn ghost" id="btnRemoveFriend">Freund entfernen</button>';

      if (!arr.length) {
        content.innerHTML = head +
          '<div class="empty"><b>Noch keine Runden</b>' +
          esc(nameOf(f)) + ' hat bisher nichts gespeichert.</div>' +
          '<div class="actions"><button class="btn ghost" id="btnBackF">' +
          I.back + 'Freunde</button>' + removeActionHtml + '</div>';
        applyClubBadgeIfNeeded();
        wireBackAndRemove();
        return;
      }

      var best = arr.reduce(function (m, r) { return r.diff < m.diff ? r : m; }, arr[0]);
      var avg  = arr.reduce(function (s, r) { return s + r.diff; }, 0) / arr.length;

      content.innerHTML = head +
        '<div class="stats">' +
          '<div class="stat"><div class="v">' + arr.length + '</div><div class="k">Runden</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(best.diff) + '">' +
            sign(best.diff) + '</div><div class="k">Beste</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(avg) + '">' +
            (avg > 0 ? '+' : '') + avg.toFixed(1) + '</div><div class="k">Schnitt</div></div>' +
        '</div>' +
        '<div class="list">' + arr.map(function (r) {
          return '<button class="item" data-open="' + esc((r.date ? r.date + '-' : '') + r.data) + '">' +
            '<span class="big" style="color:' + colorOf(r.diff) + '">' + sign(r.diff) + '</span>' +
            '<span class="meta"><span class="d">' + (fmtDate(r.date) || 'ohne Datum') + '</span>' +
            '<span class="s">' + r.holes.length + ' L\u00f6cher &middot; ' + r.strokes +
            ' Schl\u00e4ge &middot; Par ' + r.par + '</span></span>' +
            '<span class="chev">' + I.chev + '</span></button>';
        }).join('') + '</div>' +
        '<div class="actions"><button class="btn ghost" id="btnBackF">' +
        I.back + 'Freunde</button>' + removeActionHtml + '</div>';
      applyClubBadgeIfNeeded();

      Array.prototype.forEach.call(content.querySelectorAll('[data-open]'), function (el) {
        el.addEventListener('click', function () {
          location.hash = 'friend/' + userId + '/' + el.getAttribute('data-open');
          route();
        });
      });
      wireBackAndRemove();
    });
  }

  /* ---------- Anmelden / Konto ---------- */
  /* ==========================================================
     Manuelle Runden-Eingabe
     Baut aus den Eingaben denselben Code-Aufbau wie ein gescannter
     QR-Code (Ziffernpaare: Par als Dezimalziffer, Schl\u00e4ge als Hex-
     Ziffer), dadurch laeuft alles Weitere (Speichern, Anzeigen,
     Statistik) genau wie bei einer gescannten Runde, ohne eigenen Weg.
     ========================================================== */
  function holesToCode(holesArr) {
    return holesArr.map(function (h) {
      return h.par.toString(10) + h.sc.toString(16);
    }).join('');
  }

  function renderManualEntry(preselect) {
    brand.textContent = 'Manuell eintragen';
    var todayInput = codeToInput(todayCode());
    var holes = 9;
    var mode = 'simple';
    var clubPars = null;   // gesetzt, wenn ein Verein ausgewaehlt wurde

    // Mobil (Schritt-fuer-Schritt-Assistent, siehe renderSetup()/
    // startHoleWizard() unten) und Desktop (renderDesktopEntry(), volle
    // Lochtabelle auf einen Blick) stehen gleichzeitig im DOM, per CSS-
    // Klasse ein-/ausgeblendet - eine Anfrage reicht fuer beide. Ohne
    // preselect (normaler Menue-Aufruf) bewusst nur gefolgte Plaetze
    // (nicht alle verifizierten), sonst waechst die Auswahl unueber-
    // sichtlich - suchen/folgen passiert im Menue unter "Golfplaetze".
    // Mit preselect (Platz im Golfplatz-Profil angeklickt, siehe route()
    // 'manual/<clubId>/<courseId>') wird gezielt genau dieser eine Platz
    // geladen, egal ob gefolgt oder nicht - man steht ja schon auf dessen
    // Profilseite. Gleiche Ergebnis-Form ({id,name,holes,pars,clubName})
    // wie followedCourses(), damit renderSetup()/renderDesktopEntry()
    // unten nicht wissen muessen, welcher Fall gerade vorliegt.
    content.innerHTML =
      '<div class="mobile-only" id="manualMobile"></div>' +
      '<div class="desktop-only" id="manualDesktop"></div>';
    var mobileEl = document.getElementById('manualMobile');
    var desktopEl = document.getElementById('manualDesktop');
    var coursesPromise = preselect
      ? Promise.all([Club.clubById(preselect.clubId), Club.coursesOf(preselect.clubId)])
          .then(function (res) {
            var club = res[0], list = res[1] || [];
            var c = list.filter(function (x) { return x.id === preselect.courseId; })[0];
            return (club && c)
              ? [{ id: c.id, name: c.name, holes: c.holes, pars: c.pars,
                   distMen: c.dist_men || [], distWomen: c.dist_women || [],
                   clubName: club.name }]
              : [];
          })
          .catch(function () { return []; })
      : Club.followedCourses();
    // Der "Platz nicht gefunden."-Hinweis wird direkt in renderSetup()
    // (Zeile mit "buildForm(courses[0] || null)") ausgeloest, sobald
    // coursesPromise aufgeloest ist - nicht hier zusaetzlich, sonst
    // erscheint der Toast doppelt.

    function renderSetup() {
      // Bei preselect (Platz von der Golfplatz-Profilseite gewaehlt) erst
      // einen schlichten Ladezustand zeigen und mit dem Formular warten,
      // bis der Kurs geladen ist - sonst sieht man kurz die allgemeine
      // "Kein Verein"-Auswahl aufblitzen, bevor der feste Platz-Hinweis
      // sie ersetzt (auf einer langsameren Verbindung gut sichtbar).
      if (preselect) {
        mobileEl.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';
        coursesPromise.then(function (courses) {
          if (!document.body.contains(mobileEl)) return;
          if (!courses.length) toast('Platz nicht gefunden.', true);
          buildForm(courses[0] || null);
        });
        return;
      }
      buildForm(null);
    }

    function buildForm(preselectedCourse) {
      mobileEl.innerHTML =
        '<div class="panel"><h3>Runde eintragen</h3>' +
        '<div class="form" id="mClubWrap">' +
        (preselectedCourse
          ? '<p class="hint" style="margin:0">Platz: ' + esc(preselectedCourse.clubName) + ' – ' +
            esc(preselectedCourse.name || 'Platz') + '</p>'
          : '<select id="mClub"><option value="">Kein Verein / Loch für Loch selbst wählen</option></select>') +
        '</div>' +
        '<div class="datewrap" style="margin-bottom:14px">' +
        '<button type="button" class="datebtn" id="mDateBtn">' + I.cal +
        '<span id="mDateLabel">' + (fmtDate(inputToCode(todayInput)) || 'Datum wählen') + '</span></button>' +
        '<input type="date" id="mDate" class="hidden-date-input" value="' + todayInput + '"></div>' +
        '<div class="seg" id="mHolesSeg">' +
        '<button type="button" class="on" data-holes="9">9 L\u00f6cher</button>' +
        '<button type="button" data-holes="18">18 L\u00f6cher</button></div>' +
        '<div class="seg" id="mModeSeg" style="margin-top:10px">' +
        '<button type="button" class="on" data-mode="simple">Nur Gesamt</button>' +
        '<button type="button" data-mode="detail">Loch f\u00fcr Loch</button></div>' +
        '<div class="form" id="mSimple">' +
        '<input type="number" id="mTotal" min="1" max="270" placeholder="Schl\u00e4ge gesamt">' +
        '<input type="text" id="mSimpleLocation" maxlength="80" placeholder="Wo gespielt? (optional)">' +
        '<p class="hint" style="margin:0">Par wird dabei mit 4 pro Loch angenommen.</p>' +
        '</div>' +
        '<div class="actions">' +
        '<button class="btn" id="mNext">Weiter</button>' +
        '<button class="btn ghost hidden" id="mLive">Live spielen</button>' +
        '</div>' +
        '</div>';

      var selectedCourse = null;   // volles Kurs-Objekt (fuer Name/Distanzen im Wizard), oder null

      function applyCourse(c) {
        var holesSeg = document.getElementById('mHolesSeg');
        var modeSeg = document.getElementById('mModeSeg');
        var simpleBox = document.getElementById('mSimple');
        var nextBtn = document.getElementById('mNext');
        var liveBtn = document.getElementById('mLive');
        selectedCourse = c || null;
        if (c) {
          holes = c.holes; clubPars = c.pars;
          mode = 'detail';
          holesSeg.style.display = 'none';
          modeSeg.style.display = 'none';
          simpleBox.style.display = 'none';
          nextBtn.textContent = 'Ergebnisse eintragen';
          liveBtn.classList.remove('hidden');
          // Live spielen ist bei einem gewaehlten Verein die auffaellige
          // Standard-Empfehlung, "Ergebnisse eintragen" die unauffaellige
          // Alternative - ohne Verein (unten, "Weiter") bleibt es beim
          // normalen, einzigen auffaelligen Knopf.
          nextBtn.classList.add('ghost');
          liveBtn.classList.remove('ghost');
        } else {
          clubPars = null;
          holesSeg.style.display = '';
          modeSeg.style.display = '';
          simpleBox.style.display = (mode === 'simple') ? 'flex' : 'none';
          nextBtn.textContent = 'Weiter';
          liveBtn.classList.add('hidden');
          nextBtn.classList.remove('ghost');
        }
      }

      if (preselectedCourse) {
        applyCourse(preselectedCourse);
      } else if (!preselect) {
        // Nur im normalen (nicht-preselect) Fall: Plaetze nachladen und
        // ins Auswahlfeld eintragen, Auswahl bleibt bis dahin auf
        // "Kein Verein".
        coursesPromise.then(function (courses) {
          if (!document.body.contains(mobileEl)) return;
          var sel = document.getElementById('mClub');
          if (!sel || !courses.length) return;
          courses.forEach(function (c) {
            var o = document.createElement('option');
            o.value = c.id;
            o.textContent = c.clubName + ' – ' + (c.name || 'Platz');
            sel.appendChild(o);
          });
          sel.addEventListener('change', function () {
            applyCourse(courses.filter(function (x) { return x.id === sel.value; })[0]);
          });
        });
      }

      var mDateInput = document.getElementById('mDate');
      document.getElementById('mDateBtn').addEventListener('click', function () {
        if (mDateInput.showPicker) { try { mDateInput.showPicker(); return; } catch (e) {} }
        mDateInput.click();
      });
      mDateInput.addEventListener('change', function () {
        var c = inputToCode(mDateInput.value);
        document.getElementById('mDateLabel').textContent = c ? fmtDate(c) : 'Datum wählen';
      });

      Array.prototype.forEach.call(document.querySelectorAll('#mHolesSeg button'), function (b) {
        b.addEventListener('click', function () {
          holes = parseInt(b.getAttribute('data-holes'), 10);
          Array.prototype.forEach.call(document.querySelectorAll('#mHolesSeg button'), function (x) {
            x.classList.toggle('on', x === b);
          });
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('#mModeSeg button'), function (b) {
        b.addEventListener('click', function () {
          mode = b.getAttribute('data-mode');
          Array.prototype.forEach.call(document.querySelectorAll('#mModeSeg button'), function (x) {
            x.classList.toggle('on', x === b);
          });
          document.getElementById('mSimple').style.display = (mode === 'simple') ? 'flex' : 'none';
        });
      });

      // Ausgelagert (statt nur inline in den Klick-Handlern), damit
      // openCourseChoice() (Popup direkt bei einem Club-Kurs) dieselbe
      // Logik ohne Duplikat aufrufen kann.
      function goErgebnisse() {
        var dateCode = inputToCode(document.getElementById('mDate').value) || todayCode();

        if (mode === 'simple') {
          var total = parseInt(document.getElementById('mTotal').value, 10);
          if (isNaN(total) || total < holes || total > holes * 15) {
            toast('Bitte eine plausible Gesamtschlagzahl eingeben.', true);
            return;
          }
          var base = Math.floor(total / holes), rest = total % holes, holesArr = [];
          for (var j = 0; j < holes; j++) holesArr.push({ par:4, sc: base + (j < rest ? 1 : 0) });
          var simpleLoc = document.getElementById('mSimpleLocation').value.trim() || null;
          finishManual(dateCode, holesArr, simpleLoc);
        } else {
          startHoleWizard(dateCode, holes, clubPars, 4, selectedCourse);
        }
      }
      function goLive() {
        var dateCode = inputToCode(document.getElementById('mDate').value) || todayCode();
        startHoleWizard(dateCode, holes, clubPars, 0, selectedCourse);
      }
      document.getElementById('mNext').addEventListener('click', goErgebnisse);
      document.getElementById('mLive').addEventListener('click', goLive);

      // Kommt der Kurs von einem Golfplatz-Profil, wurde die Wahl
      // (Live/Ergebnisse) schon dort per Popup getroffen (siehe
      // renderClubProfile()) - das /live-Hash-Suffix sagt hier nur noch,
      // direkt in den Live-Assistenten zu springen, ohne das Formular
      // sichtbar aufblitzen zu lassen. Ohne das Suffix (z.B. Aufruf ueber
      // den Zurueck-Button) bleibt das Formular selbst als Fallback stehen.
      if (preselectedCourse && preselect && preselect.autoLive) {
        goLive();
      }
    }

    // Loch fuer Loch, wie am Geraet selbst: ein Loch pro Bildschirm,
    // Par und Schlaege je mit Plus/Minus einstellen, statt einem
    // unuebersichtlichen Raster mit allen Loechern auf einmal. Kommt ein
    // Verein zum Einsatz (fixedPars gesetzt), steht Par schon fest und
    // wird nur angezeigt statt per Stepper veraenderbar zu sein.
    // startAt: Startwert des Schlaege-Zaehlers je Loch - 4 (Standard,
    // "Ergebnisse eintragen") als plausible Schaetzung zum schnellen
    // Nachjustieren, 0 ("Live spielen") zum tatsaechlichen Mitzaehlen
    // waehrend der Runde, ein Tipp pro Schlag.
    // course: das volle gewaehlte Kurs-Objekt (clubName/name/distMen/
    // distWomen) fuer Namensanzeige + i-Knopf, oder null bei freier
    // Eingabe ohne Verein - dann bleiben Kopfzeile-Name und i-Knopf weg.
    function startHoleWizard(dateCode, totalHoles, fixedPars, startAt, course) {
      var idx = 0;
      var acc = [];
      var startSc = (startAt != null) ? startAt : 4;
      var par = fixedPars ? fixedPars[0] : 4, sc = startSc;
      var courseLabel = course ? (course.clubName + ' – ' + (course.name || 'Platz')) : '';

      // Der Loch-fuer-Loch-Assistent laeuft immer im Vollbild - egal ob
      // live auf dem Platz (startAt=0) oder nachtraeglich per "Ergebnisse
      // eintragen" (startAt=4), beide sollen dieselbe grosszuegige Ansicht
      // bekommen statt einer kleinen, im normalen Seitenfluss eingebetteten
      // Karte. Dafuer Kopf-/Fussleiste per body-Klasse ausblenden und die
      // volle Flaeche nutzen (CSS body.wizard-fullscreen). Aufgeraeumt wird
      // zentral in route(), nicht hier - greift dadurch auch bei Browser-
      // Zurueck.
      // Wichtige Lektion: #content behaelt von seiner .fadein-Eintritts-
      // animation (siehe MutationObserver weiter unten) einen technisch
      // noch "laufenden" transform-Animationsbezug, auch lange nachdem
      // sie optisch fertig ist - das macht #content zum Containing-Block
      // fuer position:fixed-Nachfahren und wuerde #manualMobile sonst auf
      // #contents (kollabierte) Innenmasse statt den echten Bildschirm
      // begrenzen. Die Klasse einmalig entfernen behebt das zuverlaessig
      // (ein reines CSS transform:none reicht dafuer NICHT).
      document.body.classList.add('wizard-fullscreen');
      content.classList.remove('fadein');

      function currentDiff() {
        var sumPar = 0, sumSc = 0;
        acc.forEach(function (h) { sumPar += h.par; sumSc += h.sc; });
        return sumSc - sumPar;
      }

      // Ort/Mitspieler nur abfragen, wenn kein Verein feststeht - bei
      // einem Golfplatz-Kurs ist der Ort schon durch courseLabel klar.
      // Freunde schon jetzt (nicht erst auf dem letzten Loch) laden, im
      // Normalfall ist die Liste laengst da, bis man durchgespielt hat.
      var playmateFriends = [];
      var selectedPlaymates = {};
      if (!course) {
        Friends.list().then(function (d) { playmateFriends = d.friends || []; });
      }

      var live = (startAt === 0);
      function pushLive() {
        if (!live) return;
        LiveRoundNative.update({ hole: idx + 1, totalHoles: totalHoles, par: par, strokes: sc, diff: currentDiff() });
      }

      function renderStep(animateIn) {
        var diff = currentDiff();
        mobileEl.innerHTML =
          '<div class="panel wizardpanel">' +
          '<div class="wizardfade' + (animateIn ? ' stepenter' : '') + '">' +
          '<div class="wizardtop">' +
          '<button type="button" class="mini no" id="mWizardClose" title="Abbrechen">' + I.x + '</button>' +
          (courseLabel ? '<span class="wizardcoursename">' + esc(courseLabel) + '</span>' : '') +
          (course ? '<button type="button" class="mini" id="mWizardInfo" title="Loch-Info">' + I.info + '</button>' : '') +
          '</div>' +
          (startAt === 0
            ? '<div class="wizardscore" style="color:' + colorOf(diff) + '">' + sign(diff) + '</div>'
            : '') +
          '<div class="wizardmid">' +
          '<div class="holeprogress">Loch ' + (idx + 1) + ' von ' + totalHoles + '</div>' +
          '<div class="stepperrow"><span class="steppertitle">Par</span>' +
          (fixedPars
            ? '<span class="steppertitle">' + par + '</span>'
            : '<div class="stepper"><button type="button" id="mParMinus">\u2212</button>' +
              '<span id="mParVal">' + par + '</span>' +
              '<button type="button" id="mParPlus">+</button></div>') +
          '</div>' +
          '<div class="stepperrow"><span class="steppertitle">Schl\u00e4ge</span>' +
          '<div class="stepper"><button type="button" id="mScMinus">\u2212</button>' +
          '<span id="mScVal">' + sc + '</span>' +
          '<button type="button" id="mScPlus">+</button></div></div>' +
          ((idx === totalHoles - 1 && !course)
            ? '<div class="form" style="margin-top:18px">' +
              '<input type="text" id="mLocation" maxlength="80" placeholder="Wo gespielt? (optional)"></div>' +
              (playmateFriends.length
                ? '<p class="hint" style="margin:0 0 8px;text-align:left">Mit wem gespielt?</p>' +
                  '<div class="pickrow" id="mPlaymates">' + playmateFriends.map(function (f) {
                    return '<button type="button" class="pickava" data-uid="' + f.userId + '">' +
                      avaHtml(f.avatarUrl, nameOf(f), '', '', badgeTypeFor(f.isAdmin, f.verifiedRole)) +
                      '<span class="fname">' + esc(nameOf(f)) + '</span></button>';
                  }).join('') + '</div>'
                : '')
            : '') +
          '</div>' +
          '</div>' +
          '<div class="actions">' +
          '<div class="slidewrap" id="mHoleNextWrap">' +
          '<div class="slidefill" id="mHoleNextFill"></div>' +
          '<span class="slidelabel">' +
          (idx === totalHoles - 1 ? 'Speichern' : 'Zum n\u00e4chsten Loch') +
          '</span>' +
          '<div class="slidethumb" id="mHoleNextThumb">' +
          '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' +
          '</div></div></div>' +
          '</div>';

        if (!fixedPars) {
          document.getElementById('mParMinus').addEventListener('click', function () {
            par = Math.max(3, par - 1); document.getElementById('mParVal').textContent = par;
            pushLive();
          });
          document.getElementById('mParPlus').addEventListener('click', function () {
            par = Math.min(6, par + 1); document.getElementById('mParVal').textContent = par;
            pushLive();
          });
        }
        document.getElementById('mScMinus').addEventListener('click', function () {
          sc = Math.max(0, sc - 1); document.getElementById('mScVal').textContent = sc;
          pushLive();
        });
        document.getElementById('mScPlus').addEventListener('click', function () {
          sc = Math.min(15, sc + 1); document.getElementById('mScVal').textContent = sc;
          pushLive();
        });
        var playmatesEl = document.getElementById('mPlaymates');
        if (playmatesEl) {
          Array.prototype.forEach.call(playmatesEl.querySelectorAll('.pickava'), function (btn) {
            btn.addEventListener('click', function () {
              var uid = btn.getAttribute('data-uid');
              btn.classList.toggle('on');
              if (btn.classList.contains('on')) selectedPlaymates[uid] = true;
              else delete selectedPlaymates[uid];
            });
          });
        }
        document.getElementById('mWizardClose').addEventListener('click', function () {
          if (idx === 0) { location.hash = ''; route(); return; }
          confirmDialog('Laufende Runde verwerfen?', 'Verwerfen').then(function (ok) {
            if (!ok) return;
            location.hash = ''; route();
          });
        });
        var infoBtn = document.getElementById('mWizardInfo');
        if (infoBtn) {
          infoBtn.addEventListener('click', function () {
            var dm = (course.distMen || [])[idx];
            var dw = (course.distWomen || [])[idx];
            var hasInfo = dm != null || dw != null;
            document.getElementById('holeInfoContent').innerHTML =
              '<h3 style="margin-top:0">Loch ' + (idx + 1) + '</h3>' +
              (hasInfo
                ? '<div class="list">' +
                  (dm != null ? '<div class="item static"><span class="meta"><span class="d">Herrenabschlag</span>' +
                    '<span class="s">' + dm + ' m bis zum Loch</span></span></div>' : '') +
                  (dw != null ? '<div class="item static"><span class="meta"><span class="d">Damenabschlag</span>' +
                    '<span class="s">' + dw + ' m bis zum Loch</span></span></div>' : '') +
                  '</div>'
                : '<p class="hint" style="margin:0">Keine Zusatzinfos für dieses Loch hinterlegt.</p>');
            openHoleInfo();
          });
        }
        setupSlideToAdvance();
        if (animateIn) {
          var fadeEl = mobileEl.querySelector('.wizardfade');
          // Erst im naechsten Frame die Klasse wegnehmen, sonst startet
          // der Browser direkt im Endzustand und die CSS-Transition (siehe
          // .wizardfade in <style>) hat nichts mehr zu animieren.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { fadeEl.classList.remove('stepenter'); });
          });
        }
      }

      // Wird nur aufgerufen, wenn der Griff bis fast ans Ende gezogen
      // wurde (siehe setupSlideToAdvance()) - der bisherige Ablauf aus dem
      // frueheren Klick-Handler ist unveraendert, nur der Ausloeser hat
      // sich geaendert.
      function advanceHole() {
        acc.push({ par:par, sc:sc });
        idx++;
        if (idx >= totalHoles) {
          var locEl = document.getElementById('mLocation');
          var loc = courseLabel || (locEl ? locEl.value.trim() : '') || null;
          var mates = Object.keys(selectedPlaymates);
          finishManual(dateCode, acc, loc, mates.length ? mates : null);
        } else {
          par = fixedPars ? fixedPars[idx] : 4; sc = startSc;
          renderStep(true);
          pushLive();
        }
      }

      // "Nächstes Loch" per Wisch-Geste statt Antippen (wie das alte
      // iPhone-Entsperren) - bewusst nur der GRIFF selbst reagiert, nicht
      // die ganze Leiste, ein Antippen daneben loest also nichts aus.
      // Pointer Events statt separater touch-/mouse-Handler, da sie beides
      // einheitlich abdecken; setPointerCapture haelt den Griff auch dann
      // "im Griff", wenn der Finger schneller ist als der Redraw. Da
      // renderStep() bei jedem Loch das komplette Markup neu aufbaut, steht
      // der Griff automatisch wieder bei Null - kein eigener Reset noetig.
      function setupSlideToAdvance() {
        var wrap = document.getElementById('mHoleNextWrap');
        var thumb = document.getElementById('mHoleNextThumb');
        var fill = document.getElementById('mHoleNextFill');
        var dragging = false, startX = 0, maxX = 0, done = false, curX = 0;

        function thumbW() { return thumb.offsetWidth; }
        function setX(x) {
          x = Math.max(0, Math.min(maxX, x));
          thumb.style.transform = 'translateX(' + x + 'px)';
          // Bis zur MITTE des Griffs, nicht bis zu dessen rechter Kante -
          // der Griff ist rund, ein eckiger Balken bis zur rechten Kante
          // wuerde oben/unten an den Ecken unter ihm hervorschauen.
          fill.style.width = (x + thumbW() / 2) + 'px';
          return x;
        }
        function snapBack() {
          thumb.style.transition = 'transform .25s ease';
          fill.style.transition = 'width .25s ease';
          setX(0);
          setTimeout(function () { thumb.style.transition = ''; fill.style.transition = ''; }, 260);
        }
        // Beim erfolgreichen Wisch faellt der Griff sichtbar mit einem
        // kleinen Aufprall-Nachwippen nach links zurueck (Ueberschwinger-
        // Kurve statt linearem Zuruecksetzen), waehrend Kopfzeile+Mitte
        // gleichzeitig ausblenden - statt schlagartig direkt zum naechsten
        // Loch umzuschalten. Die Wisch-Leiste selbst (.actions) blendet
        // bewusst NICHT mit aus, sie bleibt dauerhaft an derselben Stelle
        // stehen - nur der Griff/Balken bekommt seine eigene Animation.
        // Erst danach baut renderStep(true) die neue Karte auf und blendet
        // .wizardfade wieder ein (siehe dort).
        function playAdvanceAnimation() {
          thumb.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)';
          fill.style.transition = 'width .35s ease, opacity .3s ease';
          fill.style.opacity = '0';
          setX(0);
          var fadeEl = mobileEl.querySelector('.wizardfade');
          if (fadeEl) fadeEl.classList.add('stepexit');
          setTimeout(advanceHole, 260);
        }

        thumb.addEventListener('pointerdown', function (e) {
          if (done) return;
          dragging = true;
          maxX = wrap.getBoundingClientRect().width - thumbW() - 8;
          startX = e.clientX;
          curX = 0;
          thumb.style.transition = ''; fill.style.transition = '';
          thumb.setPointerCapture(e.pointerId);
        });
        // Der Sprung zum naechsten Loch passiert bewusst erst beim
        // Loslassen (pointerup), nicht schon waehrend des Ziehens beim
        // Erreichen der Schwelle - sonst "springt" es mitten in der
        // Wischbewegung, bevor man den Griff wirklich losgelassen hat.
        thumb.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          curX = setX(e.clientX - startX);
        });
        function endDrag() {
          if (!dragging) return;
          dragging = false;
          if (curX >= maxX * 0.9) {
            done = true;
            setX(maxX);
            playAdvanceAnimation();
          } else {
            snapBack();
          }
        }
        thumb.addEventListener('pointerup', endDrag);
        thumb.addEventListener('pointercancel', endDrag);
      }
      if (live) {
        LiveRoundNative.start({ courseName: courseLabel || 'Pocket Caddy', totalHoles: totalHoles,
          hole: 1, par: par, strokes: sc, diff: 0 });
      }
      renderStep();
    }

    function finishManual(dateCode, holesArr, roundLocation, playmates) {
      var code = holesToCode(holesArr);
      Store.add(code, dateCode, { location:roundLocation || null, playmates:playmates || null });
      location.hash = dateCode + '-' + code;
      route();
      toast('Runde gespeichert.');
    }

    // Desktop-Fassung: statt Schritt-fuer-Schritt-Assistent gleich alle
    // Loecher auf einen Blick als Tabelle - ruft am Ende dieselbe
    // finishManual() wie am Handy auf, gleiche Kodierung/gleicher
    // Speicherweg. Kein "Nur Gesamt"-Modus: der ganze Sinn der eigenen
    // Seite ist, alles auf einmal einzutragen.
    function renderDesktopEntry() {
      var mdHoles = 9;
      var mdClubPars = null;
      var mdCourseLabel = null;
      var mdSelectedPlaymates = {};

      function gridHtml(n, fixedPars) {
        var rows = '';
        for (var i = 0; i < n; i++) {
          var p = fixedPars ? fixedPars[i] : 4;
          rows += '<div class="holerow"><span class="holenum">Loch ' + (i + 1) + '</span>' +
            (fixedPars
              ? '<span>Par ' + p + '</span>'
              : '<select data-md-par="' + i + '">' +
                [3, 4, 5, 6].map(function (v) {
                  return '<option value="' + v + '"' + (v === p ? ' selected' : '') + '>Par ' + v + '</option>';
                }).join('') + '</select>') +
            '<input type="number" min="1" max="15" value="4" data-md-sc="' + i + '" placeholder="Schläge">' +
            '</div>';
        }
        return rows;
      }

      function render(preselectedCourse) {
        if (preselectedCourse) {
          mdHoles = preselectedCourse.holes; mdClubPars = preselectedCourse.pars;
          mdCourseLabel = preselectedCourse.clubName + ' – ' + (preselectedCourse.name || 'Platz');
        } else {
          mdCourseLabel = null;
        }
        desktopEl.innerHTML =
          '<div class="panel"><h3>Runde eintragen</h3>' +
          '<div class="form">' +
          '<span id="mdClubWrap">' +
          (preselectedCourse
            ? '<span class="hint">Platz: ' + esc(preselectedCourse.clubName) + ' – ' +
              esc(preselectedCourse.name || 'Platz') + '</span>'
            : '<select id="mdClub"><option value="">Kein Verein / Par selbst wählen</option></select>') +
          '</span>' +
          '<input type="date" id="mdDate" value="' + todayInput + '">' +
          '</div>' +
          '<div class="seg' + (preselectedCourse ? ' hidden' : '') + '" id="mdHolesSeg">' +
          '<button type="button" class="' + (mdHoles === 9 ? 'on' : '') + '" data-holes="9">9 Löcher</button>' +
          '<button type="button" class="' + (mdHoles === 18 ? 'on' : '') + '" data-holes="18">18 Löcher</button>' +
          '</div>' +
          '<div class="holegrid" id="mdGrid">' + gridHtml(mdHoles, mdClubPars) + '</div>' +
          (preselectedCourse ? '' :
            '<div class="form" id="mdExtra" style="margin-top:14px">' +
            '<input type="text" id="mdLocation" maxlength="80" placeholder="Wo gespielt? (optional)">' +
            '<div id="mdPlaymatesWrap"></div>' +
            '</div>') +
          '<div class="actions"><button class="btn" id="mdSave">Runde speichern</button></div>' +
          '</div>';

        if (!preselectedCourse) {
          Friends.list().then(function (d) {
            var wrap = document.getElementById('mdPlaymatesWrap');
            if (!wrap || !(d.friends || []).length) return;
            wrap.innerHTML = '<p class="hint" style="margin:0 0 8px">Mit wem gespielt?</p>' +
              '<div class="pickrow">' + d.friends.map(function (f) {
                return '<button type="button" class="pickava" data-uid="' + f.userId + '">' +
                  avaHtml(f.avatarUrl, nameOf(f), '', '', badgeTypeFor(f.isAdmin, f.verifiedRole)) +
                  '<span class="fname">' + esc(nameOf(f)) + '</span></button>';
              }).join('') + '</div>';
            Array.prototype.forEach.call(wrap.querySelectorAll('.pickava'), function (btn) {
              btn.addEventListener('click', function () {
                var uid = btn.getAttribute('data-uid');
                btn.classList.toggle('on');
                if (btn.classList.contains('on')) mdSelectedPlaymates[uid] = true;
                else delete mdSelectedPlaymates[uid];
              });
            });
          });
        }

        if (!preselectedCourse && !preselect) {
          coursesPromise.then(function (courses) {
            if (!document.body.contains(desktopEl)) return;
            var sel = document.getElementById('mdClub');
            if (!sel || !courses.length) return;
            courses.forEach(function (c) {
              var o = document.createElement('option');
              o.value = c.id;
              o.textContent = c.clubName + ' – ' + (c.name || 'Platz');
              sel.appendChild(o);
            });
            sel.addEventListener('change', function () {
              var c = courses.filter(function (x) { return x.id === sel.value; })[0];
              var holesSeg = document.getElementById('mdHolesSeg');
              var extra = document.getElementById('mdExtra');
              if (c) {
                mdHoles = c.holes; mdClubPars = c.pars;
                mdCourseLabel = c.clubName + ' – ' + (c.name || 'Platz');
                holesSeg.classList.add('hidden');
                if (extra) extra.classList.add('hidden');
              } else {
                mdClubPars = null;
                mdCourseLabel = null;
                holesSeg.classList.remove('hidden');
                if (extra) extra.classList.remove('hidden');
              }
              document.getElementById('mdGrid').innerHTML = gridHtml(mdHoles, mdClubPars);
            });
          });
        }

        Array.prototype.forEach.call(document.querySelectorAll('#mdHolesSeg button'), function (b) {
          b.addEventListener('click', function () {
            mdHoles = parseInt(b.getAttribute('data-holes'), 10);
            mdClubPars = null;
            document.getElementById('mdClub').value = '';
            Array.prototype.forEach.call(document.querySelectorAll('#mdHolesSeg button'), function (x) {
              x.classList.toggle('on', x === b);
            });
            document.getElementById('mdGrid').innerHTML = gridHtml(mdHoles, null);
          });
        });

        document.getElementById('mdSave').addEventListener('click', function () {
          var dateCode = inputToCode(document.getElementById('mdDate').value) || todayCode();
          var holesArr = [];
          for (var i = 0; i < mdHoles; i++) {
            var par = mdClubPars ? mdClubPars[i]
              : parseInt(document.querySelector('[data-md-par="' + i + '"]').value, 10);
            var sc = parseInt(document.querySelector('[data-md-sc="' + i + '"]').value, 10);
            if (isNaN(sc) || sc < 1 || sc > 15) {
              toast('Bitte bei jedem Loch eine plausible Schlagzahl eintragen.', true);
              return;
            }
            holesArr.push({ par:par, sc:sc });
          }
          var mdLocEl = document.getElementById('mdLocation');
          var loc = mdCourseLabel || (mdLocEl ? mdLocEl.value.trim() : '') || null;
          var mates = Object.keys(mdSelectedPlaymates);
          finishManual(dateCode, holesArr, loc, mates.length ? mates : null);
        });
      }

      if (preselect) {
        desktopEl.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';
        coursesPromise.then(function (courses) {
          if (!document.body.contains(desktopEl)) return;
          render(courses[0] || null);
        });
        return;
      }
      render(null);
    }

    renderSetup();
    renderDesktopEntry();
  }

  // Verifizierungs-Anfrage im Konto-Bereich (renderLogin()): normale
  // Spieler-Konten stellen hier eine Anfrage mit gewuenschter Rolle, ein
  // Admin schaltet sie in renderAdmin() frei. Admins, schon verifizierte
  // und Golfplatz-Konten sehen das Formular gar nicht erst.
  function renderVerifyRequestPanel(profile) {
    var slot = document.getElementById('verifyReqSlot');
    if (!slot) return;
    if (!profile || profile.is_admin || profile.verified_role || profile.account_type !== 'player') {
      slot.innerHTML = '';
      return;
    }

    Verify.myRequest().then(function (req) {
      if (req && req.status === 'pending') {
        slot.innerHTML = '<div class="panel"><h3>Verifizierungs-Anfrage</h3>' +
          '<p class="hint" style="margin:0"><span class="badge">Wird geprüft</span> ' +
          'Wir melden uns, sobald wir das freigeschaltet haben.</p></div>';
        return;
      }

      slot.innerHTML = '<div class="panel"><h3>Trainer, Profi oder Influencer?</h3>' +
        '<p>Stell eine Anfrage, dann prüfen wir das und schalten deinen ' +
        'blauen Haken samt Rollen-Kennzeichnung frei.</p>' +
        (req && req.status === 'rejected'
          ? '<p class="hint" style="margin-top:0">Deine letzte Anfrage wurde ' +
            'abgelehnt – du kannst es gerne nochmal versuchen.</p>' : '') +
        '<div class="form"><select id="fVerifyRole">' +
        '<option value="trainer">Trainer</option>' +
        '<option value="profi">Profi</option>' +
        '<option value="influencer">Influencer</option>' +
        '</select>' +
        '<input type="text" id="fVerifyMsg" maxlength="500" placeholder="Nachricht (optional)"></div>' +
        '<div class="actions"><button class="btn ghost" id="btnVerifyRequest">' +
        'Anfrage stellen</button></div></div>';

      document.getElementById('btnVerifyRequest').addEventListener('click', function () {
        var role = document.getElementById('fVerifyRole').value;
        var msg = document.getElementById('fVerifyMsg').value.trim();
        toast('Sende Anfrage …');
        Verify.submitRequest(role, msg).then(function (r) {
          if (r.error) { toast('Hat nicht geklappt.', true); return; }
          toast('Anfrage gesendet.');
          renderVerifyRequestPanel(profile);
        });
      });
    });
  }

  function renderLogin() {
    brand.textContent = Auth.id() ? 'Konto' : 'Anmelden';

    if (!Auth.isOnline()) {
      content.innerHTML =
        '<div class="ph"><div class="ic">' + I.user + '</div>' +

        'Die Anmeldung konnte nicht geladen werden. Pr\u00fcfe deine ' +

        'Ger\u00e4t sind davon nicht betroffen.</div>';
      return;
    }

    // Kommt der Nutzer aus der "Passwort vergessen"-Mail, zuerst das neue
    // Passwort setzen lassen, bevor irgendetwas anderes angezeigt wird.
    if (Auth.isRecovery()) {
      brand.textContent = 'Passwort';
      content.innerHTML =
        '<div class="panel"><h3>Neues Passwort setzen</h3>' +
        '<p>Du bist \u00fcber den Link aus der E-Mail hier gelandet. ' +
        'Vergib jetzt ein neues Passwort.</p>' +
        '<div class="form">' +
        '<input type="password" id="fNew" placeholder="Neues Passwort" maxlength="72" ' +
        'autocomplete="new-password">' +
        '<input type="password" id="fNew2" placeholder="Noch einmal wiederholen" maxlength="72" ' +
        'autocomplete="new-password">' +
        '</div>' +
        '<p class="warn">Mindestens ' + PW_MIN + ' Zeichen, mit Gro\u00df- und Kleinbuchstabe ' +
        'und Ziffer.</p>' +
        '<div class="actions"><button class="btn" id="btnSetPw">Passwort speichern</button></div>' +
        '<p class="warn">Speichere es am besten gleich im Passwortmanager ' +
        'deines Ger\u00e4ts.</p></div>';

      document.getElementById('btnSetPw').addEventListener('click', function () {
        var a  = document.getElementById('fNew').value;
        var a2 = document.getElementById('fNew2').value;
        var pc = pwCheck(a);
        if (!pc.len || !pc.low || !pc.up || !pc.dig) {
          toast('Mindestens ' + PW_MIN + ' Zeichen mit Gro\u00df-, Kleinbuchstabe und Ziffer.', true); return;
        }
        if (a !== a2)     { toast('Die beiden Eingaben stimmen nicht \u00fcberein.', true); return; }
        toast('Speichere \u2026');
        Auth.updatePassword(a).then(function (r) {
          if (r.error) { toast(loginError(r.error), true); return; }
          Auth.clearRecovery();
          toast('Passwort ge\u00e4ndert.');
          renderLogin();
        });
      });
      return;
    }

    if (Auth.id()) {
      var n = Store.all().length;
      var ownBadgeType = null;
      content.innerHTML =
        '<div class="panel"><h3>Angemeldet</h3>' +
        '<p>' + esc(Auth.email()) + '<span id="ownBadgeSlot"></span><br><br>' +
        'Deine Runden liegen in deinem Konto und sind auf jedem Ger\u00e4t da, ' +

        (n === 1 ? ' Runde.' : ' Runden.') + '</p>' +
        '<div class="actions">' +
        '<button class="btn ghost" id="btnSync">' + I.sync + 'Jetzt abgleichen</button>' +
        '<button class="btn ghost" id="btnOut">Abmelden</button></div></div>' +

        '<div class="panel"><h3>Profilbild</h3>' +

        '<div style="display:flex;align-items:center;gap:16px">' +
        '<span id="avPreviewSlot">' + avaHtml(null, Auth.email(), 'big zoomable') + '</span>' +
        '<button class="btn ghost" id="btnAvatarPick" style="margin:0">Bild auswählen</button>' +
        '</div>' +
        '<input type="file" id="fAvatar" accept="image/*" class="hidden"></div>' +

        '<div class="panel"><h3>Anzeigename</h3>' +
        '<p>Unter diesem Namen sehen dich deine Freunde. Ohne Namen erscheinst ' +
        'du dort nur als &bdquo;Spieler&ldquo;.</p>' +
        '<div class="form"><input type="text" id="fName" placeholder="Dein Name" ' +
        'maxlength="40" autocomplete="nickname"></div>' +
        '<div class="actions"><button class="btn ghost" id="btnName">Namen speichern</button></div></div>' +

        '<div class="panel"><h3>Benachrichtigungen</h3>' +
        '<p>Bei einer neuen Termineinladung eine E-Mail schicken, mit Zusagen/Absagen-Knopf direkt drin.</p>' +
        '<label class="consent" style="margin:0"><input type="checkbox" id="fNotifyInvites" checked> ' +
        '<span>Bei neuen Termineinladungen benachrichtigen</span></label></div>' +

        '<div id="verifyReqSlot"></div>' +

        '<div class="panel"><h3>Konto löschen</h3>' +
        '<p>Entfernt dein Konto, alle deine Runden, Freundschaften und dein ' +
        'Profil endgültig. Das lässt sich nicht rückgängig machen.</p>' +
        '<div class="del">' +
        '<button id="btnDeleteAccount">Konto endgültig löschen</button></div></div>';

      function applyOwnAvatar(p) {
        var slot = document.getElementById('avPreviewSlot');
        if (slot) {
          slot.innerHTML = avaHtml(p.avatar_url, p.display_name || Auth.email(), 'big zoomable', '', ownBadgeType);
        }
        var textSlot = document.getElementById('ownBadgeSlot');
        if (textSlot) {
          textSlot.textContent = (ownBadgeType === 'verified' && p.verified_role)
            ? ' · ' + roleLabel(p.verified_role) : '';
        }
      }

      Friends.loadProfile().then(function (p) {
        var el = document.getElementById('fName');
        if (el && p && p.display_name) el.value = p.display_name;
        var notifyEl = document.getElementById('fNotifyInvites');
        if (notifyEl) notifyEl.checked = !p || p.notify_invites !== false;
        renderVerifyRequestPanel(p);

        if (!p) return;
        if (p.is_admin) {
          ownBadgeType = 'admin';
          applyOwnAvatar(p);
        } else if (p.account_type === 'club') {
          Club.myClub().then(function (club) {
            ownBadgeType = (club && club.verified) ? 'club' : null;
            applyOwnAvatar(p);
          });
        } else {
          ownBadgeType = p.verified_role ? 'verified' : null;
          applyOwnAvatar(p);
        }
      });

      document.getElementById('fNotifyInvites').addEventListener('change', function (e) {
        Friends.setNotifyInvites(e.target.checked).then(function (r) {
          if (r && r.error) { toast('Konnte nicht gespeichert werden.', true); return; }
          toast(e.target.checked ? 'Benachrichtigungen an.' : 'Benachrichtigungen aus.');

      document.getElementById('btnAvatarPick').addEventListener('click', function () {

      document.getElementById('fAvatar').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        toast('Lade Bild hoch …');
        Friends.setAvatar(file).then(function (r) {
          if (!r.ok) { toast('Hochladen fehlgeschlagen: ' + (r.message || 'unbekannt'), true); return; }
          document.getElementById('avPreviewSlot').innerHTML = avaHtml(r.url, Auth.email(), 'big zoomable', '', ownBadgeType);
          toast('Profilbild gespeichert.');
          buildMenu();
          updateSidebarProfile();

        var v = document.getElementById('fName').value.trim();
        if (!v) { toast('Bitte einen Namen eintragen.', true); return; }
        Friends.setName(v).then(function (r) {
          if (r.error) { toast('Hat nicht geklappt.', true); return; }
          toast('Name gespeichert.');
          buildMenu();
          updateSidebarProfile();
        });
      });

      document.getElementById('btnSync').addEventListener('click', function () {
        toast('Gleiche ab \u2026');
        Store.sync().then(function (r) {
          if (r.ok) { toast('Abgeglichen.'); renderLogin(); }
          else toast('Abgleich fehlgeschlagen: ' + (r.error || 'kein Netz'), true);
        });
      });
      document.getElementById('btnOut').addEventListener('click', function () {
        Friends.reset();
        Auth.signOut().then(function () {
          toast('Abgemeldet.');
          location.hash = ''; route();
        });
      });
      document.getElementById('btnDeleteAccount').addEventListener('click', function () {
        confirmDialog('Konto und alle Runden wirklich unwiderruflich löschen?').then(function (ok) {
          if (!ok) return;
          toast('Lösche Konto …');
          invokeEdgeFunction('delete-account').then(function (r) {
            if (r.error) { toast('Löschen fehlgeschlagen: ' + r.error.message, true); return; }
            Friends.reset();
            Auth.signOut().then(function () {
              toast('Konto gelöscht.');
              location.hash = ''; route();
            });
          });
        });
      });
      return;
    }

    var GOOGLE_SVG = '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';

    // 'in' = Anmelden, 'up' = Konto erstellen, 'confirm' = "Bestaetige deine E-Mail"

        'autocomplete="' + (up ? 'new-password' : 'current-password') + '">' +

              'maxlength="72" autocomplete="new-password">' : '') +
        '</div>' +
        (up
          ? '<ul class="pwrules" id="pwRules">' +
            '<li data-r="len">Mindestens ' + PW_MIN + ' Zeichen</li>' +
            '<li data-r="low">Ein Kleinbuchstabe</li>' +
            '<li data-r="up">Ein Großbuchstabe</li>' +

        (up
          ? '<button class="btn" id="btnUp">Konto erstellen</button>' +

          : '<button class="btn" id="btnIn">Anmelden</button>' +

      document.getElementById('btnGoogle').addEventListener('click', function () {
        toast('Weiterleitung zu Google …');
        Auth.signInWithProvider('google').then(function (r) {
          if (r && r.error) toast(loginError(r.error), true);
