  /* ---------- Statistik ---------- */
  function fmtDateShort(d) {
    if (!/^\d{6}$/.test(d)) return '';
    return d.slice(4,6) + '.' + d.slice(2,4) + '.';
  }

  function buildTrendSvg(rounds) {
    var W = 320, H = 170, padL = 20, padR = 14, padT = 16, padB = 26;
    var n = rounds.length;
    var diffs = rounds.map(function (r) { return r.diff; });
    var minD = Math.min(0, Math.min.apply(null, diffs));
    var maxD = Math.max(0, Math.max.apply(null, diffs));
    if (minD === maxD) { minD -= 1; maxD += 1; }
    var span = maxD - minD;

    function xAt(i) { return n <= 1 ? (W-padL-padR)/2+padL : padL + (W-padL-padR) * i/(n-1); }
    function yAt(v) { return padT + (H-padT-padB) * (1 - (v-minD)/span); }

    var zeroY = yAt(0);
    var pts = rounds.map(function (r, i) { return xAt(i) + ',' + yAt(r.diff); }).join(' ');
    var circles = rounds.map(function (r, i) {
      return '<circle cx="' + xAt(i) + '" cy="' + yAt(r.diff) + '" r="4" style="fill:' + colorOf(r.diff) + '"/>';
    }).join('');

    var labelIdxs = n <= 1 ? [0] : (n === 2 ? [0,1] : [0, Math.floor((n-1)/2), n-1]);
    var seen = {};
    var labels = labelIdxs.filter(function (i) {
      if (seen[i]) return false; seen[i] = true; return true;
    }).map(function (i) {
      return '<text x="' + xAt(i) + '" y="' + (H-8) + '" font-size="9.5" fill="var(--mut)" ' +
             'text-anchor="middle">' + esc(fmtDateShort(rounds[i].date)) + '</text>';
    }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W-padR) + '" y2="' + zeroY +
      '" style="stroke:var(--mut)" stroke-width="1" stroke-dasharray="3,3"/>' +
      '<polyline points="' + pts + '" fill="none" style="stroke:var(--lime)" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
      circles + labels + '</svg>';
  }

  function buildDistribution(rounds) {
    var b = { eagle:0, birdie:0, par:0, bogey:0, dbl:0 };
    rounds.forEach(function (r) {
      r.holes.forEach(function (h) {
        if (h.diff <= -2) b.eagle++;
        else if (h.diff === -1) b.birdie++;
        else if (h.diff === 0) b.par++;
        else if (h.diff === 1) b.bogey++;
        else b.dbl++;
      });
    });
    var max = Math.max(1, b.eagle, b.birdie, b.par, b.bogey, b.dbl);
    var rows = [
      ['Eagle o. besser', b.eagle, 'var(--good)'],
      ['Birdie', b.birdie, 'var(--good)'],
      ['Par', b.par, 'var(--txt)'],
      ['Bogey', b.bogey, 'var(--bad)'],
      ['Doppel o. mehr', b.dbl, 'var(--bad)']
    ];
    return '<div class="distlist">' + rows.map(function (row) {
      var pct = Math.round(row[1] / max * 100);
      return '<div class="distrow"><span class="dlabel">' + row[0] + '</span>' +
        '<div class="dbar"><div class="dfill" data-pct="' + pct + '" ' +
        'style="width:0%;background:' + row[2] + '"></div></div>' +
        '<span class="dcount">' + row[1] + '</span></div>';
    }).join('') + '</div>';
  }

  function renderStats() {
    brand.textContent = 'Statistik';
    var arrAsc = Store.all().filter(function (x) { return x.confirmed; }).map(function (x) {
      var p = parseCode(x.code);
      p.date = x.date || p.date;
      p.createdAt = x.createdAt;
      return p;
    }).filter(function (p) { return p.holes.length; });

    if (arrAsc.length < 2) {
      content.innerHTML =
        '<div class="empty"><b>Noch nicht genug best\u00e4tigte Runden</b>' +
        'Sobald mindestens zwei deiner Runden von einem Freund best\u00e4tigt wurden, ' +
        'siehst du hier deine Entwicklung.</div>';
      return;
    }

    // chronologisch aufsteigend fuer den Verlauf (aeltest zuerst)
    arrAsc.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.createdAt - b.createdAt;
    });

    var last5 = arrAsc.slice(-5);
    var last5avg = last5.reduce(function (s, r) { return s + r.diff; }, 0) / last5.length;
    var overallAvg = arrAsc.reduce(function (s, r) { return s + r.diff; }, 0) / arrAsc.length;

    content.innerHTML =
      '<div class="panel"><h3>Entwicklung</h3>' + buildTrendSvg(arrAsc) + '</div>' +

      '<div class="stats">' +
        '<div class="stat"><div class="v" style="color:' + colorOf(last5avg) + '">' +
          (last5avg > 0 ? '+' : '') + last5avg.toFixed(1) + '</div><div class="k">Letzte 5</div></div>' +
        '<div class="stat"><div class="v" style="color:' + colorOf(overallAvg) + '">' +
          (overallAvg > 0 ? '+' : '') + overallAvg.toFixed(1) + '</div><div class="k">Gesamtschnitt</div></div>' +
      '</div>' +

      '<div class="panel"><h3>Ergebnisse pro Loch</h3>' + buildDistribution(arrAsc) + '</div>';

    // Balken erst nach dem Einfuegen auf ihre Zielbreite animieren, sonst
    // gibt es nichts zu animieren (Start- und Endzustand waeren gleich).
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call(content.querySelectorAll('.dfill'), function (el) {
          el.style.width = el.getAttribute('data-pct') + '%';
        });
      });
    });

  }

  // Laedt fuer eine Liste von Mitspieler-IDs (playmates, siehe Datenbank-
  // Spalte rounds.playmates) deren EIGENE Runde vom selben Datum und baut
  // daraus den "Gemeinsam gespielt"-Abschnitt fuer renderRound(). Rein
  // informativ (keine Bestaetigung noetig) - RLS blendet dabei ganz von
  // selbst jeden aus, mit dem gar keine Freundschaft besteht (weder
  // Profil noch Runde waeren fuer uns lesbar), kein Zusatz-Check noetig.
  function loadPlaymatesSection(playmateIds, roundDate) {
    if (!playmateIds || !playmateIds.length || !roundDate) return Promise.resolve('');
    var db = Auth.db();
    return Promise.all([
      db.from('profiles').select('user_id,display_name,avatar_url,is_admin,verified_role').in('user_id', playmateIds),
      db.from('rounds').select('user_id,code').in('user_id', playmateIds).eq('date', roundDate).eq('deleted', false)
    ]).then(function (res) {
      var profiles = res[0].data || [], roundsData = res[1].data || [];
      if (!roundsData.length) return '';
      var byId = {};
      profiles.forEach(function (p) { byId[p.user_id] = p; });
      var rows = roundsData.map(function (row) {
        var p = byId[row.user_id];
        var parsed = parseCode(row.code);
        var name = p ? (p.display_name || 'Spieler') : 'Spieler';
        return '<div class="item static">' +
          avaHtml(p ? p.avatar_url : null, name, '', '', p ? badgeTypeFor(p.is_admin, p.verified_role) : '') +
          '<span class="meta"><span class="d">' + esc(name) + '</span>' +
          '<span class="s">' + parsed.holes.length + ' Löcher &middot; ' + parsed.strokes + ' Schläge</span></span>' +
          '<span class="big" style="color:' + colorOf(parsed.diff) + '">' + sign(parsed.diff) + '</span></div>';
      }).join('');
      return '<div class="sectionhead"><span class="t">Gemeinsam gespielt</span></div><div class="list">' + rows + '</div>';
    }).catch(function () { return ''; });
  }

  /* ---------- Eine Runde ---------- */
  // opts.owner  -> Name des Freundes: Ansicht nur lesend, kein Speichern,
  //                kein Datum aendern, Rueckweg fuehrt zum Freund
  function renderRound(r, opts) {
    opts = opts || {};
    var readOnly = !!opts.owner;
    brand.textContent = readOnly ? esc(opts.owner) : 'Runde';

    var rows = r.holes.map(function (h, i) {
      return '<tr><td>' + (i+1) + '</td><td>' + h.par + '</td><td>' + h.sc +
             '</td><td class="' + cls(h.diff) + '">' + sign(h.diff) + '</td></tr>';
    }).join('');

    if (readOnly) {
      var confirmBlock;
      if (opts.confirmed) {
        confirmBlock = '<div class="confirmbox ok">' + I.check +
          '<span>Von einem Freund best\u00e4tigt</span></div>';
      } else if (opts.eligible && opts.roundId) {
        confirmBlock = '<div class="confirmbox">' +
          '<span>Noch nicht best\u00e4tigt, z\u00e4hlt deshalb noch nicht in der Statistik.</span>' +
          '<button class="btn" id="btnConfirmRound">' + I.check + 'Ich war dabei, best\u00e4tigen</button></div>';
      } else {
        confirmBlock = '<div class="confirmbox">' +
          '<span>Noch nicht best\u00e4tigt. Best\u00e4tigen kannst du nur, wenn du selbst ' +
          'eine Runde vom gleichen Tag gespeichert hast.</span></div>';
      }

      content.innerHTML =
        '<div class="datewrap"><span class="datebtn plain">' + I.cal +
        '<span>' + (fmtDate(r.date) || '') + '</span></span></div>' +
        '<div class="total"><div class="num" style="color:' + colorOf(r.diff) + '">' +
          sign(r.diff) + '</div><div class="sub">' +
          (opts.location ? esc(opts.location) + ' &middot; ' : '') + r.holes.length +
          ' L\u00f6cher &middot; Par ' + r.par + ' &middot; ' + r.strokes +
          ' Schl\u00e4ge</div></div>' +
        confirmBlock +
        '<table><thead><tr><th>Loch</th><th>Par</th><th>Schl\u00e4ge</th><th>Diff</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
          '<tfoot><tr><td>Gesamt</td><td>' + r.par + '</td><td>' + r.strokes +
          '</td><td class="' + cls(r.diff) + '">' + sign(r.diff) + '</td></tr></tfoot></table>' +
        '<div id="playmatesSlot"></div>' +
        '<p class="hint">Runde von ' + esc(opts.owner) + '</p>' +
        '<div class="actions"><button class="btn ghost" id="btnBackF">' + I.back + 'Zur\u00fcck</button></div>';

      var cbtn = document.getElementById('btnConfirmRound');
      if (cbtn) {
        cbtn.addEventListener('click', function () {
          cbtn.disabled = true;
          Friends.confirmRound(opts.roundId).then(function (ok) {
            if (ok) { toast('Best\u00e4tigt.'); route(); }
            else { toast('Best\u00e4tigen hat nicht geklappt.', true); cbtn.disabled = false; }
          });
        });
      }

      document.getElementById('btnBackF').addEventListener('click', function () {
        location.hash = opts.back || 'menu/friends'; route();
      });
      loadPlaymatesSection(opts.playmates, r.date).then(function (html) {
        var slot = document.getElementById('playmatesSlot');
        if (slot) slot.innerHTML = html;
      });
      return;
    }

    // Datum ist waehrend der Ansicht aenderbar, deshalb lokal merken
    var curDate = r.date;
    var savedRec = Store.findSaved(r.data, curDate);

    function dateBlock() {
      return '<button class="datebtn" id="btnDate">' + I.cal +
             '<span>' + (fmtDate(curDate) || 'Datum w\u00e4hlen') + '</span>' +
             (r.dateFromDevice ? '<span class="tag">heute</span>' : '') +
             '</button>' +
             '<input type="date" id="dateInput" class="hidden-date-input" value="' + codeToInput(curDate) + '">';
    }

    content.innerHTML =
      '<div class="datewrap">' + dateBlock() + '</div>' +
      '<div class="total"><div class="num" style="color:' + colorOf(r.diff) + '">' +
        sign(r.diff) + '</div><div class="sub"><span id="subDate">' +
        fmtDate(curDate) + ' &middot; </span>' +
        (savedRec && savedRec.location ? esc(savedRec.location) + ' &middot; ' : '') +
        r.holes.length + ' L\u00f6cher &middot; Par ' +
        r.par + ' &middot; ' + r.strokes + ' Schl\u00e4ge</div></div>' +
      (savedRec ? (savedRec.confirmed
        ? '<div class="confirmbox ok">' + I.check + '<span>Von einem Freund best\u00e4tigt, z\u00e4hlt in der Statistik</span></div>'
        : '<div class="confirmbox"><span>Noch nicht best\u00e4tigt. Ein Freund, der selbst eine Runde ' +
          'vom gleichen Tag gespeichert hat, kann das bei sich in der App best\u00e4tigen.</span></div>')
        : '') +
      '<table><thead><tr><th>Loch</th><th>Par</th><th>Schl\u00e4ge</th><th>Diff</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td>Gesamt</td><td>' + r.par + '</td><td>' + r.strokes +
        '</td><td class="' + cls(r.diff) + '">' + sign(r.diff) + '</td></tr></tfoot></table>' +
      '<div id="playmatesSlot"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="btnKeep"></button>' +
        '<button class="btn ghost" id="btnShare">' + I.share + 'Teilen</button>' +
      '</div>' +
      '<p class="hint">' + (Store.available()
        ? 'Gespeicherte Runden bleiben auf diesem Ger\u00e4t.'
        : 'Dieser Browser erlaubt kein Speichern (privater Modus?).') + '</p>';

    if (savedRec && savedRec.playmates && savedRec.playmates.length) {
      loadPlaymatesSection(savedRec.playmates, curDate).then(function (html) {
        var slot = document.getElementById('playmatesSlot');
        if (slot) slot.innerHTML = html;
      });
    }

    var keep = document.getElementById('btnKeep');

    function refreshKeep() {
      savedRec = Store.findSaved(r.data, curDate);
      keep.className = 'btn' + (savedRec ? ' saved' : '');
      keep.innerHTML = savedRec ? I.check + 'Gespeichert' : I.save + 'Runde speichern';
    }
    refreshKeep();

    keep.addEventListener('click', function () {
      if (savedRec) return;
      if (Store.add(r.data, curDate)) { refreshKeep(); toast('Runde gespeichert.'); }
      else { toast('Speichern hat nicht geklappt.', true); }
    });

    // Datum aendern: oeffnet die Datumsauswahl des Geraets
    var di = document.getElementById('dateInput');
    document.getElementById('btnDate').addEventListener('click', function () {
      if (di.showPicker) { try { di.showPicker(); return; } catch (e) {} }
      di.click();
    });
    di.addEventListener('change', function () {
      var nd = inputToCode(di.value);
      if (!nd) return;
      curDate = nd;
      r.dateFromDevice = false;
      // War die Runde unter dem alten Datum schon gespeichert, wandert sie mit
      if (savedRec) Store.setDate(savedRec.id, curDate);
      document.querySelector('#btnDate span').textContent = fmtDate(curDate);
      var tag = document.querySelector('#btnDate .tag');
      if (tag) tag.remove();
      document.getElementById('subDate').innerHTML = fmtDate(curDate) + ' &middot; ';
      refreshKeep();
    });

    document.getElementById('btnPdf').addEventListener('click', function(){ window.print(); });

    var sh = document.getElementById('btnShare');
    if (navigator.share) {
      sh.addEventListener('click', function () {
        navigator.share({
          title:'Golf-Runde ' + fmtDate(curDate),
          text:r.holes.length + ' L\u00f6cher, ' + r.strokes + ' Schl\u00e4ge, ' +
               sign(r.diff) + ' zu Par',
          url:location.href
        }).catch(function(){});
      });
    } else { sh.style.display = 'none'; }
  }

  /* ---------- Sicherung ---------- */
  function renderBackup() {
    brand.textContent = 'Sicherung';
    var n = Store.all().length;

    content.innerHTML =
      '<div class="panel"><h3>Exportieren</h3>' +
      '<p>Speichert alle Runden als Datei auf dein Ger\u00e4t. Bewahre sie irgendwo auf, ' +
      'wo du sie wiederfindest, zum Beispiel in deiner Cloud oder per Mail an dich selbst.</p>' +
      '<div class="actions"><button class="btn" id="btnExport">' + I.down +
      'Datei sichern (' + n + ')</button></div></div>' +

      '<div class="panel"><h3>Einlesen</h3>' +
      '<p>Liest eine zuvor exportierte Datei wieder ein. Vorhandene Runden bleiben erhalten, ' +
      'es wird zusammengef\u00fchrt statt ersetzt. Gel\u00f6schte Runden, die in der Datei ' +
      'noch enthalten sind, kommen dabei zur\u00fcck.</p>' +
      '<div class="actions"><button class="btn ghost" id="btnImport">' + I.up +
      'Datei einlesen</button></div>' +
      '<input type="file" id="fileInput" accept="application/json,.json" class="hidden"></div>' +

      '<div class="panel"><h3>Alles l\u00f6schen</h3>' +
      '<p>Entfernt alle Runden von diesem Ger\u00e4t. L\u00e4sst sich nur \u00fcber eine ' +
      'zuvor exportierte Datei wiederherstellen.</p>' +
      '<div class="del">' +
      '<button id="btnClear">Alle Runden l\u00f6schen</button></div></div>';

    document.getElementById('btnExport').addEventListener('click', function () {
      var data = Store.exportData();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      var url  = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = new Date();
      var pad = function (v) { return (v < 10 ? '0' : '') + v; };
      a.href = url;
      a.download = 'pocketcaddy-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast('Datei erstellt.');
    });

    var fi = document.getElementById('fileInput');
    document.getElementById('btnImport').addEventListener('click', function(){ fi.click(); });
    fi.addEventListener('change', function () {
      var f = fi.files && fi.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var obj;
        try { obj = JSON.parse(rd.result); }
        catch (e) { toast('Datei konnte nicht gelesen werden.', true); return; }
        var res = Store.importData(obj);
        if (!res.ok) {
          toast(res.reason === 'format'
            ? 'Das sieht nicht nach einer Pocket-Caddy-Datei aus.'
            : 'Einlesen fehlgeschlagen.', true);
          return;
        }
        var parts = [];
        if (res.added)    parts.push(res.added + ' neu');
        if (res.restored) parts.push(res.restored + ' wiederhergestellt');
        if (res.updated)  parts.push(res.updated + ' aktualisiert');
        toast(parts.length ? parts.join(', ') + '.' : 'Nichts zu \u00e4ndern, alles war schon da.');
        renderBackup();
      };
      rd.readAsText(f);
      fi.value = '';
    });

    document.getElementById('btnClear').addEventListener('click', function () {
      confirmDialog('Wirklich alle Runden von diesem Ger\u00e4t l\u00f6schen?').then(function (ok) {
        if (!ok) return;
        Store.removeAll(); toast('Alle Runden gel\u00f6scht.'); renderBackup();
      });
    });

  }

  // Schneidet ein Bild auf ein Quadrat (Bildmitte) zu und verkleinert es
  // auf maxSize, damit nicht ein volles Handyfoto (mehrere MB) hochgeht
  // und alle Avatare im gleichen Seitenverhaeltnis dargestellt werden.
  // maxH weggelassen: quadratischer Zuschnitt (Profilbilder). Mit maxH:
  // Zuschnitt auf dieses Seitenverhaeltnis (z.B. Platz-/Lochfotos im
  // Querformat), jeweils aus der Bildmitte.
  function resizeImageToJpeg(file, maxW, maxH) {
    maxH = maxH || maxW;
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var targetRatio = maxW / maxH, srcRatio = img.width / img.height;
        var sx, sy, sw, sh;
        if (srcRatio > targetRatio) {
          sh = img.height; sw = sh * targetRatio; sx = (img.width - sw) / 2; sy = 0;
        } else {
          sw = img.width; sh = sw / targetRatio; sx = 0; sy = (img.height - sh) / 2;
        }
        var outW = Math.min(maxW, sw), outH = Math.min(maxH, sh);
        var canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(img.src);
          blob ? resolve(blob) : reject(new Error('Bild konnte nicht verarbeitet werden.'));
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { reject(new Error('Bild konnte nicht gelesen werden.')); };
      img.src = URL.createObjectURL(file);
    });
  }

  /* ==========================================================
     Freunde
     Alles laeuft ueber die Datenbank, es wird nichts lokal
     zwischengespeichert. Ohne Anmeldung gibt es hier nichts.
     ========================================================== */
  var Friends = (function () {
    var myProfile = null;

    function db() { return Auth.db(); }

    function loadProfile(force) {
      if (myProfile && !force) return Promise.resolve(myProfile);
      if (!Auth.id() || !Auth.isOnline()) return Promise.resolve(null);
      return db().from('profiles').select('user_id,display_name,friend_code,avatar_url,account_type,is_admin,verified_role')
        .eq('user_id', Auth.id()).maybeSingle()
        .then(function (r) { myProfile = r.data || null; return myProfile; })
        .catch(function () { return null; });
    }

    function setName(name) {
      return db().from('profiles').update({ display_name: name })
        .eq('user_id', Auth.id())
        .then(function (r) {
          if (!r.error && myProfile) myProfile.display_name = name;
          return r;
        });
    }

    function setNotifyInvites(on) {
      return db().from('profiles').update({ notify_invites: on })
        .eq('user_id', Auth.id())
        .then(function (r) {
          if (!r.error && myProfile) myProfile.notify_invites = on;
          return r;
        });
    }

    // Laedt das Bild als quadratisches, verkleinertes JPEG hoch (siehe
    // resizeImageToJpeg()). Jedes Mal ein NEUER Dateiname statt ein
    // bestehendes Bild zu ersetzen (upsert bzw. Loeschen+Neu-Anlegen
    // haben sich in der Praxis als unzuverlaessig gezeigt, vermutlich
    // ein Eigenheit von Supabase Storage beim Ersetzen vorhandener
    // Dateien) - dadurch ist es immer eine einfache Neuanlage, nie ein
    // Konfliktfall. Das alte Bild wird danach nur noch im Hintergrund
    // bestmoeglich aufgeraeumt, ein Fehlschlag dabei ist egal.
    function setAvatar(file) {
      var uid = Auth.id();
      var oldUrl = myProfile && myProfile.avatar_url;
      return resizeImageToJpeg(file, 800).then(function (blob) {
        var path = uid + '/' + Date.now() + '.jpg';
        return db().storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' })
          .then(function (up) {
            if (up.error) throw up.error;
            var url = db().storage.from('avatars').getPublicUrl(path).data.publicUrl;
            return db().from('profiles').update({ avatar_url: url }).eq('user_id', uid)
              .then(function (r) {
                if (r.error) throw r.error;
                if (myProfile) myProfile.avatar_url = url;
                if (oldUrl) {
                  var m = /\/avatars\/(.+)$/.exec(oldUrl);
                  if (m) db().storage.from('avatars').remove([decodeURIComponent(m[1])]).catch(function () {});
                }
                return { ok:true, url:url };
              });
          });
      }).catch(function (e) {
        return { ok:false, message:(e && e.message) || '' };
      });
    }

    // Gibt alle Verbindungen zurueck, angereichert um den Namen des
    // jeweils anderen. Zwei Abfragen statt einer, weil friendships auf
    // auth.users zeigt und nicht direkt auf profiles.
    function list() {
      var me = Auth.id();
      if (!me || !Auth.isOnline()) return Promise.resolve({ friends:[], incoming:[], outgoing:[] });

      return db().from('friendships').select('*')
        .or('requester.eq.' + me + ',addressee.eq.' + me)
        .then(function (r) {
          if (r.error) throw r.error;
          var rows = r.data || [];
          var others = rows.map(function (f) {
            return f.requester === me ? f.addressee : f.requester;
          });
          if (!others.length) return { rows:rows, names:{}, avatars:{}, admins:{}, roles:{}, types:{} };
          return db().from('profiles').select('user_id,display_name,avatar_url,is_admin,verified_role,account_type')
            .in('user_id', others)
            .then(function (p) {
              var names = {}, avatars = {}, admins = {}, roles = {}, types = {};
              (p.data || []).forEach(function (x) {
                names[x.user_id] = x.display_name;
                avatars[x.user_id] = x.avatar_url;
                admins[x.user_id] = !!x.is_admin;
                roles[x.user_id] = x.verified_role;
                types[x.user_id] = x.account_type;
              });
              return { rows:rows, names:names, avatars:avatars, admins:admins, roles:roles, types:types };
            });
        })
        .then(function (res) {
          var friends = [], incoming = [], outgoing = [];
          res.rows.forEach(function (f) {
            var other = f.requester === me ? f.addressee : f.requester;
            var item = { id:f.id, userId:other, status:f.status,
                         name:res.names[other] || '', avatarUrl:res.avatars[other] || null,
                         isAdmin:!!res.admins[other], verifiedRole:res.roles[other] || null,
                         accountType:res.types[other] || 'player' };
            if (f.status === 'accepted') friends.push(item);
            else if (f.addressee === me) incoming.push(item);
            else outgoing.push(item);
          });
          return { friends:friends, incoming:incoming, outgoing:outgoing };
        })
        .catch(function (e) {
          return { friends:[], incoming:[], outgoing:[], error:(e && e.message) || 'Fehler' };
        });
    }

    function requestByCode(code) {
      var me = Auth.id();
      return db().rpc('find_by_friend_code', { code: code })
        .then(function (r) {
          if (r.error) throw r.error;
          var hit = (r.data && r.data.length) ? r.data[0] : null;
          if (!hit) return { ok:false, reason:'notfound' };
          return db().from('friendships')
            .insert({ requester: me, addressee: hit.user_id, status: 'pending' })
            .then(function (ins) {
              if (ins.error) {
                var m = (ins.error.message || '').toLowerCase();
                if (m.indexOf('duplicate') >= 0 || m.indexOf('unique') >= 0) {
                  return { ok:false, reason:'exists' };
                }
                throw ins.error;
              }
              return { ok:true, name:hit.display_name || '' };
            });
        })
        .catch(function (e) {
          return { ok:false, reason:'error', message:(e && e.message) || '' };
        });
    }

    function accept(id) {
      return db().from('friendships')
        .update({ status:'accepted', updated_at:new Date().toISOString() })
        .eq('id', id);
    }

    function remove(id) {
      return db().from('friendships').delete().eq('id', id);
    }

    function roundsOf(userId) {
      return db().from('rounds').select('*')
        .eq('user_id', userId).eq('deleted', false)
        .then(function (r) {
          if (r.error) throw r.error;
          return r.data || [];
        })
        .catch(function () { return []; });
    }

    // Letzte Runden ueber ALLE Freunde hinweg, fuer den Feed auf der
    // Freunde-Seite (anders als roundsOf(), das nur einen einzelnen
    // Freund abfragt). Die Freundes-Lese-Policy auf rounds erlaubt das
    // schon (01_freunde.sql), keine weitere Berechtigung noetig.
    function feed(limit) {
      return list().then(function (d) {
        var ids = d.friends.map(function (f) { return f.userId; });
        if (!ids.length) return [];
        var names = {}, avatars = {}, badges = {};
        d.friends.forEach(function (f) {
          names[f.userId] = f.name; avatars[f.userId] = f.avatarUrl;
          badges[f.userId] = badgeTypeFor(f.isAdmin, f.verifiedRole);
        });
        return db().from('rounds').select('*')
          .in('user_id', ids).eq('deleted', false)
          .order('created_at', { ascending:false }).limit(limit || 20)
          .then(function (r) {
            if (r.error) throw r.error;
            return (r.data || []).map(function (row) {
              return { row:row, name:names[row.user_id] || 'Spieler',
                       avatarUrl:avatars[row.user_id], badge:badges[row.user_id] };
            });
          });
      }).catch(function () { return []; });
    }

    // Hat der aktuelle Nutzer selbst eine (nicht geloeschte) Runde vom
    // angegebenen Datum? Nur dann darf er die Runde eines Freundes
    // bestaetigen, egal ob die eigene selbst schon bestaetigt ist.
    function hasRoundOnDate(date) {
      var me = Auth.id();
      if (!me || !date) return Promise.resolve(false);
      return db().from('rounds').select('id', { count:'exact', head:true })
        .eq('user_id', me).eq('date', date).eq('deleted', false)
        .then(function (r) { return !r.error && (r.count || 0) > 0; })
        .catch(function () { return false; });
    }

    // Bestaetigt die Runde eines Freundes. updated_at wird bewusst mit
    // hochgesetzt, damit der normale Abgleich (sync()) das auf dem
    // Geraet des Erstellers beim naechsten Mal von selbst mitbekommt.
    function confirmRound(roundId) {
      return db().from('rounds')
        .update({ confirmed:true, updated_at:new Date().toISOString() })
        .eq('id', roundId)
        .then(function (r) {
          if (r.error) { console.error('confirmRound', r.error); return false; }
          return true;
        })
        .catch(function (e) { console.error('confirmRound', e); return false; });
    }

    return { loadProfile:loadProfile, setName:setName, setNotifyInvites:setNotifyInvites, setAvatar:setAvatar, list:list,
             requestByCode:requestByCode, accept:accept, remove:remove,
             roundsOf:roundsOf, feed:feed,
             hasRoundOnDate:hasRoundOnDate, confirmRound:confirmRound,
             isAdmin:function () { return !!(myProfile && myProfile.is_admin); },
             isClub:function () { return !!(myProfile && myProfile.account_type === 'club'); },
             reset:function () { myProfile = null; } };
  })();

  /* ==========================================================
     Planung
     Termine mit Freunden. Zu-/Absage laeuft in der App, keine
     Benachrichtigung, wer die Seite nicht oeffnet sieht die
     Einladung erst beim naechsten Mal. Sobald alle zugesagt haben,
     kann jeder Beteiligte sich eine Kalenderdatei herunterladen.
     ========================================================== */
  var Planner = (function () {
    function db() { return Auth.db(); }

    // Liefert alle Termine, an denen ich beteiligt bin (Ersteller oder
    // eingeladen), jeweils mit der vollen Einladungsliste inkl. Namen.
    function list() {
      var me = Auth.id();
      if (!me || !Auth.isOnline()) return Promise.resolve([]);

      return db().from('events').select('*').eq('deleted', false)
        .then(function (r) {
          if (r.error) throw r.error;
          var events = r.data || [];
          if (!events.length) return [];

          var ids = events.map(function (e) { return e.id; });
          return db().from('event_invites')
            .select('id,event_id,invitee,status,responded_at,created_at').in('event_id', ids)
            .then(function (ir) {
              if (ir.error) throw ir.error;
              var invites = ir.data || [];

              var uids = {};
              events.forEach(function (e) { uids[e.creator] = true; });
              invites.forEach(function (i) { uids[i.invitee] = true; });

              return db().from('profiles').select('user_id,display_name,avatar_url')
                .in('user_id', Object.keys(uids))
                .then(function (pr) {
                  var names = {}, avatars = {};
                  (pr.data || []).forEach(function (p) {
                    names[p.user_id] = p.display_name;
                    avatars[p.user_id] = p.avatar_url;
                  });

                  return events.map(function (e) {
                    var evInvites = invites.filter(function (i) { return i.event_id === e.id; });
                    return {
                      id: e.id, title: e.title, date: e.event_date,
                      location: e.location, creator: e.creator,
                      clubId: e.club_id, courseId: e.course_id,
                      isMine: e.creator === me,
                      creatorName: names[e.creator] || 'Spieler',
                      invites: evInvites.map(function (i) {
                        return { id:i.id, userId:i.invitee, status:i.status,
                                 name: names[i.invitee] || 'Spieler',
                                 avatarUrl: avatars[i.invitee] || null,
                                 isMe: i.invitee === me };
                      })
                    };
                  }).filter(function (e) {
                    return e.isMine || e.invites.some(function (i) { return i.isMe; });
                  });
                });
            });
        })
        .catch(function (e) {
          console.error(e);
          return [];
        });
    }

    function create(data, inviteeIds) {
      var me = Auth.id();
      return db().from('events').insert({
        creator: me, title: data.title || 'Golfrunde',
        event_date: data.date, location: data.location || null,
        club_id: data.clubId || null, course_id: data.courseId || null
      }).select().single().then(function (r) {
        if (r.error) throw r.error;
        var ev = r.data;
        if (!inviteeIds.length) return { ok:true, event:ev };
        var rows = inviteeIds.map(function (uid) {
          return { event_id: ev.id, invitee: uid, status: 'pending' };
        });
        return db().from('event_invites').insert(rows).then(function (ir) {
          if (ir.error) throw ir.error;
          // Mail-Versand laeuft nebenbei (Edge Function) - ein Problem dabei
          // (z.B. noch kein RESEND_API_KEY eingerichtet) soll den angelegten
          // Termin nicht rueckgaengig machen oder die Oberflaeche blockieren.
          invokeEdgeFunction('notify-invites', { eventId: ev.id }).catch(function () {});
          return { ok:true, event:ev };
        });
      }).catch(function (e) {
        return { ok:false, message:(e && e.message) || '' };
      });
    }

    function respond(inviteId, status) {
      return db().from('event_invites')
        .update({ status:status, responded_at:new Date().toISOString() })
        .eq('id', inviteId);
    }

    function cancelEvent(eventId) {
      return db().from('events').update({ deleted:true }).eq('id', eventId);
    }

    return { list:list, create:create, respond:respond, cancelEvent:cancelEvent };
  })();

  /* ==========================================================
     Golfplatz-Konten (nur Desktop-Verwaltung, siehe renderClub())
     ========================================================== */
  var Club = (function () {
    function db() { return Auth.db(); }

    // Eigener Platz. Existiert immer schon leer (vom Anlegen-Trigger),
    // sobald ein Konto mit account_type='club' registriert wurde.
    function myClub() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve(null);
      return db().from('golf_clubs').select('*').eq('user_id', uid).maybeSingle()
        .then(function (r) { return r.data || null; })
        .catch(function () { return null; });
    }

    // Golfplatz-Anfrage: normale Konten stellen sie in den Konto-
    // Einstellungen, ein Admin schaltet sie ueber renderAdmin() frei.
    function myRequest() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve(null);
      return db().from('club_requests').select('*').eq('user_id', uid).maybeSingle()
        .then(function (r) { return r.data || null; })
        .catch(function () { return null; });
    }

    // "upsert" statt insert: nach einer Ablehnung soll ein erneutes
    // Stellen moeglich sein, ohne dass die Zeile vorher geloescht wird.
    function submitRequest(message) {
      return db().from('club_requests').upsert({
        user_id: Auth.id(), message: message, status: 'pending',
        requested_at: new Date().toISOString(), decided_at: null
      }, { onConflict: 'user_id' });
    }

    function pendingRequests() {
      return db().from('club_requests').select('*').eq('status', 'pending')
        .order('requested_at')
        .then(function (r) { if (r.error) throw r.error; return r.data || []; })
        .catch(function () { return []; });
    }

    function approveRequest(uid) { return db().rpc('approve_club_request', { target_user: uid }); }
    function rejectRequest(uid)  { return db().rpc('reject_club_request', { target_user: uid }); }

    // clubId optional - Vorgabe Auth.id() (Club pflegt sich selbst),
    // von der Admin-Platzpflege aber explizit mit der Ziel-Club-ID
    // aufgerufen (siehe renderAdminClubEdit()). Serverseitig greift
    // dafuer die Admin-Bypass-Policy aus 14_admin_golfplaetze.sql.
    function saveClub(fields, clubId) {
      var payload = { updated_at: new Date().toISOString() };
      for (var k in fields) payload[k] = fields[k];
      return db().from('golf_clubs').update(payload).eq('user_id', clubId || Auth.id());
    }

    // Legt einen komplett neuen Golfplatz an, ohne dass sich vorher
    // jemand mit einer echten E-Mail registrieren muss - laeuft ueber
    // die Edge Function admin-create-club (Service-Role-Key, darf nie
    // im Browser landen). fields: {name (Pflicht), description,
    // address, phone, website, price_info}.
    function createClubAsAdmin(fields) {
      return invokeEdgeFunction('admin-create-club', fields);
    }

    // Laedt ein Foto hoch (immer neuer Dateiname, siehe Lektion bei den
    // Profilbildern) und gibt die oeffentliche URL zurueck.
    function uploadMedia(file, maxW, maxH) {
      var uid = Auth.id();
      return resizeImageToJpeg(file, maxW, maxH).then(function (blob) {
        var path = uid + '/' + Date.now() + '.jpg';
        return db().storage.from('club_media').upload(path, blob, { contentType:'image/jpeg' })
          .then(function (up) {
            if (up.error) throw up.error;
            return db().storage.from('club_media').getPublicUrl(path).data.publicUrl;
          });
      });
    }

    function offersOf(clubId) {
      return db().from('club_offers').select('*')
        .eq('club_id', clubId).eq('deleted', false)
        .order('created_at', { ascending:false })
        .then(function (r) { if (r.error) throw r.error; return r.data || []; })
        .catch(function () { return []; });
    }

    function addOffer(fields) {
      var payload = { club_id: Auth.id() };
      for (var k in fields) payload[k] = fields[k];
      return db().from('club_offers').insert(payload);
    }

    function removeOffer(id) {
      return db().from('club_offers').update({ deleted:true }).eq('id', id);
    }

    // Plaetze (Loch/Par-Layouts) eines Clubs - ein Club kann mehrere haben
    // (z.B. Hauptplatz + Kurzplatz), siehe datenbank/08_mehrere_plaetze.sql.
    function coursesOf(clubId) {
      return db().from('golf_courses').select('*')
        .eq('club_id', clubId).order('created_at')
        .then(function (r) { if (r.error) throw r.error; return r.data || []; })
        .catch(function () { return []; });
    }
    function myCourses() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve([]);
      return coursesOf(uid);
    }
    // clubId optional - Vorgabe Auth.id() (Club pflegt seinen eigenen
    // Platz), von der Admin-Platzpflege aber explizit mit der Ziel-
    // Club-ID aufgerufen (siehe renderAdminClubEdit()). Serverseitig
    // greift dafuer die Admin-Bypass-Policy aus 13_admin_kurse.sql.
    function addCourse(fields, clubId) {
      var payload = { club_id: clubId || Auth.id() };
      for (var k in fields) payload[k] = fields[k];
      return db().from('golf_courses').insert(payload);
    }
    function saveCourse(id, fields, clubId) {
      var payload = { updated_at: new Date().toISOString() };
      for (var k in fields) payload[k] = fields[k];
      return db().from('golf_courses').update(payload).eq('id', id).eq('club_id', clubId || Auth.id());
    }
    function removeCourse(id, clubId) {
      return db().from('golf_courses').delete().eq('id', id).eq('club_id', clubId || Auth.id());
    }

    // Fuer das Golfplatz-Abzeichen auf der Freund-Detailseite: RLS laesst
    // eine fremde Zeile nur lesen, wenn sie verified ist - kein Treffer
    // heisst also automatisch "kein Abzeichen".
    function isVerified(uid) {
      return db().from('golf_clubs').select('verified').eq('user_id', uid).maybeSingle()
        .then(function (r) { return !!(r.data && r.data.verified); })
        .catch(function () { return false; });
    }

    // Fuer die Golfplaetze-Suche im Menue: ein Eintrag pro Club (nicht
    // pro Platz wie followedCourses()), mit eingebetteten Plaetzen fuer
    // die Kurzinfo ("2 Plaetze").
    function verifiedClubsList() {
      return db().from('golf_clubs')
        .select('user_id,name,description,avatar_url,cover_image_url,golf_courses(id,name,holes)')
        .eq('verified', true)
        .then(function (r) {
          if (r.error) throw r.error;
          return (r.data || []).map(function (c) {
            return { id:c.user_id, name:c.name, description:c.description,
                     avatarUrl:c.avatar_url, coverImageUrl:c.cover_image_url, courses:c.golf_courses || [] };
          });
        })
        .catch(function () { return []; });
    }

    // Fuer die Admin-Platzverwaltung: wie verifiedClubsList(), aber OHNE
    // den verified=true-Filter (per admin platz lesen()-Policy aus
    // 14_admin_golfplaetze.sql fuer Admins ohnehin lesbar) - ein frisch
    // angelegter, noch unverifizierter Platz muss hier auffindbar bleiben.
    function allClubsList() {
      return db().from('golf_clubs')
        .select('user_id,name,description,avatar_url,cover_image_url,verified,golf_courses(id,name,holes)')
        .then(function (r) {
          if (r.error) throw r.error;
          return (r.data || []).map(function (c) {
            return { id:c.user_id, name:c.name, description:c.description,
                     avatarUrl:c.avatar_url, coverImageUrl:c.cover_image_url, verified:c.verified,
                     courses:c.golf_courses || [] };
          });
        })
        .catch(function () { return []; });
    }

    // Fuer die Golfplatz-Profilseite (club/<id>): beliebige fremde,
    // aber verifizierte Zeile lesen - gleiches RLS-Prinzip wie isVerified().
    function clubById(id) {
      return db().from('golf_clubs').select('*').eq('user_id', id).maybeSingle()
        .then(function (r) { return r.data || null; })
        .catch(function () { return null; });
    }

    // Golfplaetzen folgen (datenbank/09_golfplaetze_folgen.sql): Start-
    // seite und Kursauswahl beim manuellen Eintragen zeigen bewusst nur
    // noch gefolgte Plaetze statt ausnahmslos aller verifizierten - die
    // volle Liste zum Suchen/Folgen sitzt im eigenen Menuepunkt.
    function myFollows() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve([]);
      return db().from('club_follows').select('club_id').eq('user_id', uid)
        .then(function (r) {
          if (r.error) throw r.error;
          return (r.data || []).map(function (x) { return x.club_id; });
        })
        .catch(function () { return []; });
    }
    function isFollowing(clubId) {
      var uid = Auth.id();
      if (!uid) return Promise.resolve(false);
      return db().from('club_follows').select('user_id')
        .eq('user_id', uid).eq('club_id', clubId).maybeSingle()
        .then(function (r) { return !!r.data; })
        .catch(function () { return false; });
    }
    function follow(clubId) {
      return db().from('club_follows').insert({ user_id: Auth.id(), club_id: clubId });
    }
    function unfollow(clubId) {
      return db().from('club_follows').delete()
        .eq('user_id', Auth.id()).eq('club_id', clubId);
    }

    // Fuer die Startseiten-Kacheln: nur Clubs, denen das eigene Konto folgt.
    function followedClubs() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve([]);
      return db().from('club_follows')
        .select('golf_clubs(user_id,name,cover_image_url,avatar_url,golf_courses(id,name,holes))')
        .eq('user_id', uid)
        .then(function (r) {
          if (r.error) throw r.error;
          return (r.data || []).map(function (row) { return row.golf_clubs; })
            .filter(function (c) { return c; })
            .map(function (c) {
              return { id:c.user_id, name:c.name, coverImageUrl:c.cover_image_url,
                       avatarUrl:c.avatar_url, courses:c.golf_courses || [] };
            });
        })
        .catch(function () { return []; });
    }

    // Fuer die Kursauswahl beim manuellen Eintragen: nur Kurse aus
    // gefolgten Clubs.
    function followedCourses() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve([]);
      return db().from('club_follows')
        .select('golf_clubs(name,golf_courses(id,name,holes,pars,dist_men,dist_women))')
        .eq('user_id', uid)
        .then(function (r) {
          if (r.error) throw r.error;
          var out = [];
          (r.data || []).forEach(function (row) {
            var c = row.golf_clubs;
            if (!c) return;
            (c.golf_courses || []).forEach(function (course) {
              out.push({ id:course.id, name:course.name, holes:course.holes,
                         pars:course.pars, distMen:course.dist_men || [],
                         distWomen:course.dist_women || [], clubName:c.name });
            });
          });
          return out;
        })
        .catch(function () { return []; });
    }

    return { myClub:myClub, saveClub:saveClub, createClubAsAdmin:createClubAsAdmin, uploadMedia:uploadMedia,
             offersOf:offersOf, addOffer:addOffer, removeOffer:removeOffer,
             coursesOf:coursesOf, myCourses:myCourses, addCourse:addCourse,
             saveCourse:saveCourse, removeCourse:removeCourse,
             verifiedClubsList:verifiedClubsList, allClubsList:allClubsList,
             clubById:clubById, isVerified:isVerified,
             myFollows:myFollows, isFollowing:isFollowing, follow:follow, unfollow:unfollow,
             followedClubs:followedClubs, followedCourses:followedCourses,
             myRequest:myRequest, submitRequest:submitRequest,
             pendingRequests:pendingRequests, approveRequest:approveRequest,
             rejectRequest:rejectRequest };
  })();

  // ============================================================
  // Verifizierungs-Anfragen (Trainer/Profi/Influencer)
  // Gleiches Muster wie Club oben: normale Konten stellen eine Anfrage mit
  // gewuenschter Rolle in den Konto-Einstellungen, ein Admin schaltet sie
  // ueber renderAdmin() frei - erst dann wird profiles.verified_role gesetzt.
  // ============================================================
  var Verify = (function () {
    function db() { return Auth.db(); }

    function myRequest() {
      var uid = Auth.id();
      if (!uid) return Promise.resolve(null);
      return db().from('role_requests').select('*').eq('user_id', uid).maybeSingle()
        .then(function (r) { return r.data || null; })
        .catch(function () { return null; });
    }

    // "upsert" statt insert: nach einer Ablehnung soll ein erneutes
    // Stellen (auch mit anderer gewuenschter Rolle) moeglich sein.
    function submitRequest(role, message) {
      return db().from('role_requests').upsert({
        user_id: Auth.id(), requested_role: role, message: message, status: 'pending',
        requested_at: new Date().toISOString(), decided_at: null
      }, { onConflict: 'user_id' });
    }

    function pendingRequests() {
      return db().from('role_requests').select('*').eq('status', 'pending')
        .order('requested_at')
        .then(function (r) { if (r.error) throw r.error; return r.data || []; })
        .catch(function () { return []; });
    }

    function approveRequest(uid) { return db().rpc('approve_role_request', { target_user: uid }); }
    function rejectRequest(uid)  { return db().rpc('reject_role_request', { target_user: uid }); }

    return { myRequest:myRequest, submitRequest:submitRequest,
             pendingRequests:pendingRequests, approveRequest:approveRequest,
             rejectRequest:rejectRequest };
  })();

  function parDefaults(holes) {
    var a = []; for (var i = 0; i < holes; i++) a.push(4); return a;
  }

  // Eine Zeile pro Loch: Par-Auswahl wie bisher, dazu zwei optionale
  // Entfernungsangaben (Meter) vom Herren-/Damenabschlag - Vorbereitung
  // fuer den i-Knopf beim Live-Zaehlen (siehe startHoleWizard()).
  // distMen/distWomen duerfen kuerzer als pars sein oder leere
  // Eintraege haben, das heisst schlicht "keine Angabe fuer dieses Loch".
  function holeInfoRowsHtml(pars, distMen, distWomen) {
    return pars.map(function (p, i) {
      var dm = distMen[i], dw = distWomen[i];
      return '<div class="holeinfo-row"><span class="holeinfo-num">Loch ' + (i + 1) + '</span>' +
        '<select data-par-idx="' + i + '">' +
        [3,4,5,6].map(function (v) {
          return '<option value="' + v + '"' + (v === p ? ' selected' : '') + '>Par ' + v + '</option>';
        }).join('') + '</select>' +
        '<input type="number" min="0" data-distmen-idx="' + i + '" placeholder="Herren m"' +
        (dm != null ? ' value="' + dm + '"' : '') + '>' +
        '<input type="number" min="0" data-distwomen-idx="' + i + '" placeholder="Damen m"' +
        (dw != null ? ' value="' + dw + '"' : '') + '>' +
        '</div>';
    }).join('');
  }

  // Wiederverwendbare Plaetze-Verwaltung (Karten-Liste mit Loch/Par/
  // Distanz-Formular) - von renderClub() fuer den eigenen Platz UND von
  // renderAdminClubEdit() fuer einen fremden Platz genutzt (dann mit
  // expliziter clubId statt Auth.id()), damit das Formular nicht doppelt
  // gepflegt werden muss. courses wird als Referenz uebergeben und intern
  // neu zugewiesen (courses = ...), das wirkt sich nicht auf den Aufrufer
  // aus - der uebergibt die Liste ohnehin nur einmal beim Aufbau.
  function mountCoursesEditor(listEl, addBtn, courses, clubId) {
    clubId = clubId || Auth.id();
    var expandedCourse = null;   // id des gerade aufgeklappten Platzes, 'new' fuer einen neuen

    // Ein Platz als Karte: eingeklappt nur Name/Lochzahl mit Stift-Symbol,
    // aufgeklappt (expandedCourse === diese id) das volle Formular mit
    // Name/9-18-Umschalter/Par-Raster - alles per data-course="<id>"
    // sauber pro Karte gescoped, da mehrere Plaetze gleichzeitig existieren.
    function courseCardHtml(c) {
      var id = c.id || 'new';
      var pars = (c.pars && c.pars.length === c.holes) ? c.pars : parDefaults(c.holes);
      var distMen = c.dist_men || [];
      var distWomen = c.dist_women || [];
      if (expandedCourse !== id) {
        return '<div class="item static" data-course="' + id + '">' +
          '<span class="meta"><span class="d">' + esc(c.name || 'Platz') + '</span>' +
          '<span class="s">' + c.holes + ' Löcher</span></span>' +
          '<button class="mini" data-edit-course="' + id + '">' + I.edit + '</button>' +
          '</div>';
      }
      return '<div class="panel" data-course="' + id + '" style="margin-bottom:10px">' +
        '<div class="form"><input type="text" data-course-name maxlength="80" value="' + esc(c.name || '') +
        '" placeholder="Name des Platzes (z.B. Hauptplatz)"></div>' +
        '<div class="seg" data-course-holes-seg>' +
        [9, 18].map(function (n) {
          return '<button type="button" data-holes="' + n + '" class="' +
            (c.holes === n ? 'on' : '') + '">' + n + ' Löcher</button>';
        }).join('') + '</div>' +
        '<p class="hint" style="margin:10px 2px 6px">Par + optional Entfernung zum Loch' +
        ' (Herren-/Damenabschlag, in Metern)</p>' +
        '<div class="holeinfo-list" data-course-pars-grid>' +
        holeInfoRowsHtml(pars, distMen, distWomen) + '</div>' +
        '<div class="actions">' +
        '<button class="btn" data-save-course="' + id + '">Speichern</button>' +
        (c.id ? '<button class="btn ghost" data-delete-course="' + id + '">Löschen</button>' : '') +
        '<button class="btn ghost" data-cancel-course="' + id + '">Abbrechen</button>' +
        '</div></div>';
    }

    function renderCourses() {
      listEl.innerHTML = courses.length
        ? '<div class="list">' + courses.map(courseCardHtml).join('') + '</div>'
        : '<p class="hint" style="margin:0">Noch kein Platz angelegt.</p>';
      wireCourseCardEvents();
    }

    function wireCourseCardEvents() {
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-edit-course]'), function (btn) {
        btn.addEventListener('click', function () {
          expandedCourse = btn.getAttribute('data-edit-course');
          renderCourses();
        });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-cancel-course]'), function (btn) {
        btn.addEventListener('click', function () {
          if (btn.getAttribute('data-cancel-course') === 'new') {
            courses = courses.filter(function (c) { return c.id; });
          }
          expandedCourse = null;
          renderCourses();
        });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-course-holes-seg] button'), function (b) {
        b.addEventListener('click', function () {
          var wrap = b.closest('[data-course]');
          var n = parseInt(b.getAttribute('data-holes'), 10);
          Array.prototype.forEach.call(wrap.querySelectorAll('[data-course-holes-seg] button'), function (x) {
            x.classList.toggle('on', x === b);
          });
          wrap.querySelector('[data-course-pars-grid]').innerHTML =
            holeInfoRowsHtml(parDefaults(n), [], []);
        });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-save-course]'), function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-save-course');
          var wrap = btn.closest('[data-course]');
          var name = wrap.querySelector('[data-course-name]').value.trim();
          var selects = wrap.querySelectorAll('[data-course-pars-grid] select');
          var pars = Array.prototype.map.call(selects, function (s) { return parseInt(s.value, 10); });
          var distMen = Array.prototype.map.call(
            wrap.querySelectorAll('[data-course-pars-grid] [data-distmen-idx]'),
            function (i) { return i.value.trim() === '' ? null : parseInt(i.value, 10); });
          var distWomen = Array.prototype.map.call(
            wrap.querySelectorAll('[data-course-pars-grid] [data-distwomen-idx]'),
            function (i) { return i.value.trim() === '' ? null : parseInt(i.value, 10); });
          var fields = { name:name, holes:pars.length, pars:pars, dist_men:distMen, dist_women:distWomen };
          toast('Speichere …');
          var op = (id === 'new') ? Club.addCourse(fields, clubId) : Club.saveCourse(id, fields, clubId);
          op.then(function (r) {
            if (r.error) { toast('Hat nicht geklappt.', true); return; }
            toast('Gespeichert.');
            expandedCourse = null;
            Club.coursesOf(clubId).then(function (fresh) { courses = fresh; renderCourses(); });
          });
        });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-delete-course]'), function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-delete-course');
          confirmDialog('Diesen Platz wirklich löschen?').then(function (ok) {
            if (!ok) return;
            Club.removeCourse(id, clubId).then(function () {
              toast('Gelöscht.');
              expandedCourse = null;
              Club.coursesOf(clubId).then(function (fresh) { courses = fresh; renderCourses(); });
            });
          });
        });
      });
    }

    addBtn.addEventListener('click', function () {
      courses.push({ name:'', holes:18, pars:parDefaults(18) });
      expandedCourse = 'new';
      renderCourses();
    });

    renderCourses();
  }

  // Golfplatz-Verwaltung: ersetzt fuer Konten mit account_type='club'
  // die normale Startseite (siehe renderHome()). Bewusst auf jeder
  // Bildschirmbreite nutzbar, auch wenn Golfplaetze das in der Praxis
  // fast immer am Rechner ausfuellen werden.
  // Zielgroessen fuer Club.uploadMedia() - quadratisch fuers Profilbild,
  // breitformatig fuer Titelbild/Lochfotos (siehe renderClub() unten).
  var CLUB_AVATAR_SIZE = 800, CLUB_COVER_W = 960, CLUB_COVER_H = 540;

  function renderClub() {
    brand.textContent = 'Golfplatz';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    Promise.all([Club.myClub(), Club.myCourses()]).then(function (res) {
      var club = res[0];
      if (!club) {
        content.innerHTML = '<div class="empty"><b>Kein Golfplatz-Profil gefunden</b>' +
          'Bitte melde dich bei uns, falls das nicht stimmt.</div>';
        return;
      }
      var courses = res[1];

      var html = '<div class="panel">' +
        (club.verified
          ? '<p class="hint" style="margin:0"><span class="badge ok">Freigeschaltet</span> ' +
            'Dein Platz ist für Spieler sichtbar und auswählbar.</p>'
          : '<p class="hint" style="margin:0"><span class="badge">Noch nicht freigeschaltet</span> ' +
            'Sobald deine Angaben stehen, meld dich bei uns – wir schalten deinen Platz dann frei.</p>') +
        '</div>';

      html += '<div class="panel"><h3>Stammdaten</h3><div class="form">' +
        '<input type="text" id="cName" maxlength="80" placeholder="Name des Platzes" value="' + esc(club.name || '') + '">' +
        '<textarea id="cDesc" maxlength="2000" placeholder="Beschreibung" rows="3">' + esc(club.description || '') + '</textarea>' +
        '<input type="text" id="cAddress" maxlength="200" placeholder="Adresse" value="' + esc(club.address || '') + '">' +
        '<input type="text" id="cPhone" maxlength="40" placeholder="Telefon" value="' + esc(club.phone || '') + '">' +
        '<input type="text" id="cWebsite" maxlength="200" placeholder="Website" value="' + esc(club.website || '') + '">' +
        '<input type="text" id="cPrice" maxlength="200" placeholder="Preise (z.B. Greenfee 45€, Wochenende 55€)" ' +
        'value="' + esc(club.price_info || '') + '">' +
        '</div><div class="actions"><button class="btn" id="btnSaveClub">Speichern</button></div></div>';

      // Plaetze: eingeklappt nur Name+Lochzahl+Stift, aufgeklappt (per
      // Klick auf eine einzelne Karte) das volle Bearbeiten-Formular -
      // siehe renderCourses()/wireCourseCardEvents() weiter unten.
      html += '<div class="panel"><h3>Plätze</h3><div id="clubCoursesList"></div>' +
        '<div class="actions"><button class="btn ghost" id="btnAddCourse">+ Neuen Platz anlegen</button></div></div>';

      html += '<div class="panel"><h3>Bilder</h3>' +
        '<p class="hint" style="margin-top:0">Profilbild' +
        (club.avatar_url ? '' : ' (noch keins hochgeladen)') + '</p>' +
        '<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">' +
        '<span id="cAvatarPreview">' + avaHtml(club.avatar_url, club.name, 'zoomable') + '</span>' +
        '<button class="btn ghost" id="btnAvatarPick" style="margin:0">Profilbild wählen</button>' +
        '</div>' +
        '<input type="file" id="fClubAvatar" accept="image/*" class="hidden">' +
        '<p class="hint">Titelbild' +
        (club.cover_image_url ? '' : ' (noch keins hochgeladen)') + '</p>' +
        (club.cover_image_url
          ? '<img src="' + esc(club.cover_image_url) + '" style="width:100%;border-radius:12px;margin-bottom:12px">'
          : '') +
        '<div class="actions"><button class="btn ghost" id="btnCoverPick">Titelbild wählen</button></div>' +
        '<input type="file" id="fCover" accept="image/*" class="hidden">' +
        '<p class="hint">Lochfotos (optional): ' + (club.hole_images || []).length + ' hochgeladen</p>' +
        (club.hole_images && club.hole_images.length
          ? '<div class="pars-grid">' + club.hole_images.map(function (u) {
              return '<img src="' + esc(u) + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">';
            }).join('') + '</div>'
          : '') +
        '<div class="actions"><button class="btn ghost" id="btnHolePhotoPick">Lochfoto hinzufügen</button></div>' +
        '<input type="file" id="fHolePhoto" accept="image/*" class="hidden">' +
        '</div>';

      html += '<div class="actions"><button class="btn ghost" id="btnGoOffers">Angebote verwalten →</button></div>';

      content.innerHTML = html;

      document.getElementById('btnSaveClub').addEventListener('click', function () {
        toast('Speichere …');
        Club.saveClub({
          name: document.getElementById('cName').value.trim(),
          description: document.getElementById('cDesc').value.trim(),
          address: document.getElementById('cAddress').value.trim(),
          phone: document.getElementById('cPhone').value.trim(),
          website: document.getElementById('cWebsite').value.trim(),
          price_info: document.getElementById('cPrice').value.trim()
        }).then(function (r) {
          toast(r.error ? 'Hat nicht geklappt.' : 'Gespeichert.', !!r.error);
        });
      });

      mountCoursesEditor(document.getElementById('clubCoursesList'),
        document.getElementById('btnAddCourse'), courses, Auth.id());

      document.getElementById('btnAvatarPick').addEventListener('click', function () {
        document.getElementById('fClubAvatar').click();
      });
      document.getElementById('fClubAvatar').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0]; e.target.value = '';
        if (!file) return;
        toast('Lade Bild hoch …');
        Club.uploadMedia(file, CLUB_AVATAR_SIZE, CLUB_AVATAR_SIZE).then(function (url) {
          return Club.saveClub({ avatar_url: url });
        }).then(function () { toast('Profilbild gespeichert.'); renderClub(); })
          .catch(function (e) { toast('Hochladen fehlgeschlagen: ' + (e && e.message || ''), true); });
      });

      document.getElementById('btnCoverPick').addEventListener('click', function () {
        document.getElementById('fCover').click();
      });
      document.getElementById('fCover').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0]; e.target.value = '';
        if (!file) return;
        toast('Lade Bild hoch …');
        Club.uploadMedia(file, CLUB_COVER_W, CLUB_COVER_H).then(function (url) {
          return Club.saveClub({ cover_image_url: url });
        }).then(function () { toast('Titelbild gespeichert.'); renderClub(); })
          .catch(function (e) { toast('Hochladen fehlgeschlagen: ' + (e && e.message || ''), true); });
      });

      document.getElementById('btnHolePhotoPick').addEventListener('click', function () {
        document.getElementById('fHolePhoto').click();
      });
      document.getElementById('fHolePhoto').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0]; e.target.value = '';
        if (!file) return;
        toast('Lade Bild hoch …');
        Club.uploadMedia(file, CLUB_COVER_W, CLUB_COVER_H).then(function (url) {
          var imgs = (club.hole_images || []).slice(); imgs.push(url);
          return Club.saveClub({ hole_images: imgs });
        }).then(function () { toast('Lochfoto gespeichert.'); renderClub(); })
          .catch(function (e) { toast('Hochladen fehlgeschlagen: ' + (e && e.message || ''), true); });
      });

      document.getElementById('btnGoOffers').addEventListener('click', function () {
        location.hash = 'menu/offers'; route();
      });
    });
  }

  // Angebote (Events, Trainerstunden, ...) eines Golfplatz-Kontos.
  // Gleiches Grundmuster wie die Termine in renderPlan().
  function renderClubOffers() {
    brand.textContent = 'Angebote';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';
    var uid = Auth.id();

    Club.offersOf(uid).then(function (offers) {
      var html = '<div class="panel"><h3>Neues Angebot</h3><div class="form">' +
        '<input type="text" id="oTitle" maxlength="80" placeholder="Titel (z.B. Anfänger-Kurs)">' +
        '<textarea id="oDesc" maxlength="1000" placeholder="Beschreibung" rows="2"></textarea>' +
        '<input type="text" id="oPrice" maxlength="100" placeholder="Preis (optional)">' +
        '</div><div class="actions"><button class="btn" id="btnAddOffer">Anlegen</button></div></div>';

      if (!offers.length) {
        html += '<div class="empty"><b>Noch keine Angebote</b>Leg oben ein neues an.</div>';
      } else {
        html += '<div class="sectionhead"><span class="t">Angebote</span>' +
          '<span class="c">' + offers.length + '</span></div><div class="list">';
        offers.forEach(function (o) {
          html += '<div class="event"><div class="eventtitle">' + esc(o.title) + '</div>' +
            (o.description ? '<div class="eventloc">' + esc(o.description) + '</div>' : '') +
            (o.price_info ? '<div class="eventwho">' + esc(o.price_info) + '</div>' : '') +
            '<div class="linkrow"><button class="linkbtn" data-remove="' + o.id + '">Löschen</button></div></div>';
        });
        html += '</div>';
      }

      content.innerHTML = html;

      document.getElementById('btnAddOffer').addEventListener('click', function () {
        var title = document.getElementById('oTitle').value.trim();
        if (!title) { toast('Bitte einen Titel eintragen.', true); return; }
        toast('Lege an …');
        Club.addOffer({
          title: title,
          description: document.getElementById('oDesc').value.trim(),
          price_info: document.getElementById('oPrice').value.trim()
        }).then(function (r) {
          if (r.error) { toast('Hat nicht geklappt.', true); return; }
          toast('Angebot angelegt.'); renderClubOffers();
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function (el) {
        el.addEventListener('click', function () {
          var offerId = el.getAttribute('data-remove');
          confirmDialog('Dieses Angebot wirklich löschen?').then(function (ok) {
            if (!ok) return;
            Club.removeOffer(offerId).then(function () {
              toast('Gelöscht.'); renderClubOffers();
            });
          });
        });
      });
    });
  }

  // Gemeinsames Muster fuer "Suchfeld filtert eine Liste von Golfplatz-
  // Zeilen" - genutzt von renderClubSearch() und wireClubManagement() in
  // renderAdmin(). rowHtml(club) baut eine Zeile, wireRows(listEl) haengt
  // die Klick-Handler der gerade sichtbaren Zeilen an (nach jedem Render
  // neu noetig, da innerHTML alte Elemente/Listener verwirft).
  function mountFilterableClubList(searchEl, listEl, clubs, rowHtml, wireRows) {
    function renderList(filtered) {
      listEl.innerHTML = filtered.length
        ? '<div class="list">' + filtered.map(rowHtml).join('') + '</div>'
        : '<div class="empty"><b>Nichts gefunden</b>Versuch einen anderen Suchbegriff.</div>';
      wireRows(listEl);
    }
    renderList(clubs);
    if (searchEl) {
      searchEl.addEventListener('input', function (e) {
        var q = e.target.value.trim().toLowerCase();
        renderList(!q ? clubs : clubs.filter(function (c) {
          return (c.name || '').toLowerCase().indexOf(q) >= 0;
        }));
      });
    }
  }

  // Golfplaetze suchen und folgen (menu/clubs) - die volle Liste aller
  // verifizierten Plaetze, unabhaengig vom Login lesbar (RLS erlaubt
  // jedem verified=true-Zeilen), Folgen selbst braucht ein Konto.
  function renderClubSearch() {
    brand.textContent = 'Golfplätze';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    Promise.all([Club.verifiedClubsList(), Club.myFollows()]).then(function (res) {
      var clubs = res[0], follows = res[1];

      function rowHtml(c) {
        var n = c.courses.length;
        var following = follows.indexOf(c.id) >= 0;
        // <div> statt <button> als Zeilen-Element, da hier zusaetzlich
        // ein eigener Klick-Bereich (Folgen-Knopf) drinsteckt -
        // verschachtelte <button>s waeren ungueltiges HTML. Klick auf die
        // Zeile selbst bleibt ueber einen JS-Listener nutzbar (siehe unten).
        return '<div class="item" data-club="' + c.id + '">' +
          avaHtml(c.avatarUrl || c.coverImageUrl, c.name, '', '', 'club') +
          '<span class="meta"><span class="d">' + esc(c.name || 'Golfplatz') + '</span>' +
          '<span class="s">' + (n ? (n + (n === 1 ? ' Platz' : ' Plätze')) : 'Noch keine Plätze') +
          '</span></span>' +
          '<button class="mini' + (following ? ' ok' : '') + '" data-follow="' + c.id + '">' +
          (following ? I.check : '+') + '</button>' +
          '</div>';
      }

      function wireRows(listEl) {
        Array.prototype.forEach.call(listEl.querySelectorAll('[data-club]'), function (el) {
          el.addEventListener('click', function () {
            location.hash = 'club/' + el.getAttribute('data-club'); route();
          });
        });
        Array.prototype.forEach.call(listEl.querySelectorAll('[data-follow]'), function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!Auth.id()) { toast('Bitte zuerst anmelden.', true); return; }
            var id = btn.getAttribute('data-follow');
            var following = follows.indexOf(id) >= 0;
            function doToggle() {
              var op = following ? Club.unfollow(id) : Club.follow(id);
              op.then(function (r) {
                if (r.error) { toast('Hat nicht geklappt.', true); return; }
                if (following) { follows = follows.filter(function (x) { return x !== id; }); }
                else { follows.push(id); }
                btn.classList.toggle('ok', !following);
                btn.innerHTML = following ? '+' : I.check;
              });
            }
            if (following) {
              confirmDialog('Diesem Golfplatz wirklich entfolgen?', 'Entfolgen').then(function (ok) {
                if (ok) doToggle();
              });
            } else {
              doToggle();
            }
          });
        });
      }

      content.innerHTML =
        '<div class="form">' +
        '<input type="text" id="clubSearchInput" maxlength="80" placeholder="Golfplatz suchen …"></div>' +
        '<div id="clubSearchList"></div>';

      mountFilterableClubList(document.getElementById('clubSearchInput'),
        document.getElementById('clubSearchList'), clubs, rowHtml, wireRows);
    });
  }

  // Golfplatz-Profil zum Durchstoebern (club/<id>) - rein lesend, fuer
  // jeden erreichbar, der den Link hat (RLS zeigt ohnehin nur
  // verifizierte Plaetze). Analog renderFriendRounds().
  function renderClubProfile(id) {
    brand.textContent = 'Golfplatz';
    content.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    Promise.all([Club.clubById(id), Club.coursesOf(id), Club.offersOf(id), Club.isFollowing(id)]).then(function (res) {
      var club = res[0], courses = res[1], offers = res[2];
      var following = res[3];
      if (!club) {
        content.innerHTML = '<div class="empty"><b>Kein Zugriff</b>' +
          'Dieser Golfplatz ist nicht (mehr) verfügbar.</div>';
        return;
      }

      // Banner (Titelbild) + darueber ragendes Profilbild, bewusst anders
      // aufgebaut als .profilehead/.friendhead, damit ein Golfplatz-Profil
      // optisch klar kein normales Spieler-/Freund-Profil ist.
      // Adresse/Telefon/Website als eigene anklickbare Zeilen (Karte,
      // Anruf, Webseite) statt gestauchter Textzeilen untereinander.
      var contactHtml = '';
      if (club.address) {
        contactHtml += '<a class="contactbtn" href="https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(club.address) + '" target="_blank" rel="noopener">' +
          '<span class="ic">' + I.pin + '</span><span class="txt">' + esc(club.address) + '</span></a>';
      }
      if (club.phone) {
        contactHtml += '<a class="contactbtn" href="tel:' + esc(club.phone.replace(/\s+/g, '')) + '">' +
          '<span class="ic">' + I.phone + '</span><span class="txt">' + esc(club.phone) + '</span></a>';
      }
      if (club.website) {
        contactHtml += '<a class="contactbtn" href="' + esc(normalizeUrl(club.website)) + '" target="_blank" rel="noopener">' +
          '<span class="ic">' + I.globe + '</span><span class="txt">' + esc(club.website) + '</span></a>';
      }

      var html = '<div class="panel" style="padding:0;overflow:hidden">' +
        '<div class="clubbanner"' +
        (safeImgUrl(club.cover_image_url) ? ' style="background-image:url(\'' + esc(safeImgUrl(club.cover_image_url)) + '\')"' : '') +
        '></div>' +
        '<div class="clubheadrow">' +
        avaHtml(club.avatar_url, club.name, 'zoomable') +
        '<div class="namewrap"><h3 style="margin:0">' + esc(club.name || 'Golfplatz') + '</h3></div>' +
        '<button class="mini' + (following ? ' ok' : '') + '" id="btnFollowClub" title="' +
        (following ? 'Entfolgen' : 'Folgen') + '">' + (following ? I.check : '+') + '</button>' +
        '</div>' +
        (contactHtml ? '<div class="contactlist">' + contactHtml + '</div>' : '') +
        (club.description || club.price_info
          ? '<div style="padding:16px 16px 0">' +
            (club.description ? '<p style="margin-top:0">' + esc(club.description) + '</p>' : '') +
            (club.price_info ? '<p class="hint" style="margin-top:8px">' + esc(club.price_info) + '</p>' : '') +
            '</div>'
          : '') +
        '<div style="height:16px"></div></div>';

      html += '<div class="sectionhead"><span class="t">Plätze</span>' +
        '<span class="c">' + courses.length + '</span></div>';
      html += !courses.length
        ? '<div class="empty"><b>Noch keine Plätze</b>Dieser Golfplatz hat noch keinen Platz angelegt.</div>'
        : '<div class="list">' + courses.map(function (c) {
            return '<button class="item" data-course="' + c.id + '"><span class="meta"><span class="d">' +
              esc(c.name || 'Platz') + '</span><span class="s">' + c.holes + ' Löcher</span></span>' +
              '<span class="chev">' + I.chev + '</span></button>';
          }).join('') + '</div>';

      if (offers.length) {
        html += '<div class="sectionhead" style="margin-top:22px"><span class="t">Angebote</span>' +
          '<span class="c">' + offers.length + '</span></div><div class="list">';
        offers.forEach(function (o) {
          html += '<div class="event"><div class="eventtitle">' + esc(o.title) + '</div>' +
            (o.description ? '<div class="eventloc">' + esc(o.description) + '</div>' : '') +
            (o.price_info ? '<div class="eventwho">' + esc(o.price_info) + '</div>' : '') +
            '</div>';
        });
        html += '</div>';
      }

      html += '<div class="actions"><button class="btn ghost" id="btnBackClub">' +
        I.back + 'Zurück</button></div>';

      content.innerHTML = html;
      document.getElementById('btnBackClub').addEventListener('click', function () {
        location.hash = ''; route();
      });
      document.getElementById('btnFollowClub').addEventListener('click', function () {
        if (!Auth.id()) { toast('Bitte zuerst anmelden.', true); return; }
        var btn = document.getElementById('btnFollowClub');
        function doToggle() {
          var op = following ? Club.unfollow(id) : Club.follow(id);
          op.then(function (r) {
            if (r.error) { toast('Hat nicht geklappt.', true); return; }
            following = !following;
            btn.classList.toggle('ok', following);
            btn.innerHTML = following ? I.check : '+';
            btn.title = following ? 'Entfolgen' : 'Folgen';
          });
        }
        if (following) {
          confirmDialog('Diesem Golfplatz wirklich entfolgen?', 'Entfolgen').then(function (ok) {
            if (ok) doToggle();
          });
        } else {
          doToggle();
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-course]'), function (el) {
        el.addEventListener('click', function () {
          var courseId = el.getAttribute('data-course');
          var c = courses.filter(function (x) { return x.id === courseId; })[0];
          var label = (club.name || 'Golfplatz') + ' – ' + (c && c.name || 'Platz');
          openCourseChoice(label, function () {
            location.hash = 'manual/' + id + '/' + courseId + '/live';
            route();
          }, function () {
            location.hash = 'manual/' + id + '/' + courseId;
            route();
          });
        });
      });
    });
  }

  // Menuepunkt ueberhaupt zeigt). Bewusst ohne Bild-Upload (Club.uploadMedia()

        '<textarea id="cAdminDesc" maxlength="2000" placeholder="Beschreibung" rows="3">' + esc(club.description || '') + '</textarea>' +
        '<input type="text" id="cAdminAddress" maxlength="200" placeholder="Adresse" value="' + esc(club.address || '') + '">' +
        '<input type="text" id="cAdminPhone" maxlength="40" placeholder="Telefon" value="' + esc(club.phone || '') + '">' +
        '<input type="text" id="cAdminWebsite" maxlength="200" placeholder="Website" value="' + esc(club.website || '') + '">' +
        '<input type="text" id="cAdminPrice" maxlength="200" placeholder="Preise (z.B. Greenfee 45€, Wochenende 55€)" ' +
