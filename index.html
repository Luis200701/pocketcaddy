<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://hieaduzvsqkwvdxfscoo.supabase.co; media-src 'self' blob:; connect-src 'self' https://hieaduzvsqkwvdxfscoo.supabase.co wss://hieaduzvsqkwvdxfscoo.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">

<title>Pocket Caddy</title>

<!-- Installierbar als App (PWA). Icons als echte PNG-Dateien statt
     eingebettetem SVG, weil iOS die Home-Bildschirm-Icons darüber
     zuverlässiger anzeigt. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- iOS-spezifisch: im Vollbild öffnen statt im Safari-Rahmen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Caddy">
<!--
  Pocket Caddy
  ------------
  Ansichten (ueber den Teil hinter dem # gesteuert):
    #            Startseite: Verlauf aller gespeicherten Runden
    #JJMMTT-...  Scorecard einer Runde (so kommt es aus dem QR-Code)
    #menu/xyz    Menuepunkte

  Gespeichert wird derzeit ausschliesslich lokal im Browser (localStorage).
  Es geht nichts an einen Server, und alles hinter dem # wird von Browsern
  ohnehin nie an den Server geschickt.

  Datenformat des QR-Codes:  JJMMTT-PSPSPS...
    JJMMTT  Datum, z.B. 260816 = 16.08.2026
    danach  je Loch zwei Zeichen: erst Par, dann Schlaege
            Schlaege als Hex-Ziffer, damit 10 in ein Zeichen passt
            (bei Par 6 sind bis zu Par+4 = 10 Schlaege moeglich): a = 10

  Datensatz einer gespeicherten Runde (Speicherformat v2):
    id         eindeutige Kennung, unabhaengig vom Inhalt
    code       die Zeichenkette aus dem QR-Code
    date       JJMMTT
    createdAt  Zeitpunkt des Speicherns (ms)
    updatedAt  Zeitpunkt der letzten Aenderung (ms)
    deleted    true = geloescht, Eintrag bleibt als Grabstein erhalten

  Warum id, updatedAt und deleted schon jetzt:
  Ohne eigene Kennung waeren zwei identische Runden am selben Tag nicht
  unterscheidbar. Ohne updatedAt koennte ein spaeterer Abgleich nicht
  entscheiden, welche Fassung neuer ist. Und ohne Grabsteine kaeme eine
  geloeschte Runde beim naechsten Abgleich vom Server zurueck.
-->
<style>
  :root{
    --bg:#101217; --card:#161921; --bar:#1a1d24; --lime:#a3e635;
    --txt:#fff; --mut:#7c8593; --good:#5ede8f; --bad:#ff5c5c;
    --line:#ffffff14;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior-y:none}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    overscroll-behavior-y:none;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:0 0 calc(96px + env(safe-area-inset-bottom));
    /* Kurze Seiten (wenig Inhalt, kein Scrollen noetig) lassen mobile
       Browser wie iOS Safari ihre Adressleiste eingeblendet, was die
       untere Leiste (position:fixed) sichtbar mit Abstand zum echten
       Bildschirmrand "zu hoch" wirken laesst - auf laengeren,
       scrollbaren Seiten (z.B. der vollere Startseite) blendet die
       Adressleiste beim Laden/Scrollen aus, dort sitzt sie richtig.
       min-height:100dvh (dynamische Sichtfenster-Hoehe, mit 100vh als
       Fallback fuer aeltere Browser) sorgt dafuer, dass auch kurze
       Seiten mindestens so hoch wie das aktuell sichtbare Fenster sind
       - das gleicht das Verhalten zwischen kurzen und langen Seiten an. */
    min-height:100vh;
    min-height:100dvh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;max-width:520px;margin:0 auto}
  .topleft{display:flex;align-items:center;gap:2px;min-width:0}
  .brandflag{display:none;flex:none;margin-right:6px}
  .brandflag.on{display:flex}
  .brandflag svg{width:19px;height:19px}
  .topbar .brand{font-size:14px;letter-spacing:.16em;text-transform:uppercase;
                 color:var(--mut);font-weight:600;white-space:nowrap;
                 overflow:hidden;text-overflow:ellipsis}
  .iconbtn{background:#ffffff10;border:0;color:var(--txt);padding:12px;
           cursor:pointer;display:flex;border-radius:999px;flex:none}
  .iconbtn:active{background:#ffffff1e}
  .iconbtn svg{width:23px;height:23px;fill:none;stroke:currentColor;
               stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* Zurueck-Pfeil: nur sichtbar, wenn nicht auf der Startseite (siehe route()) */
  .iconbtn.back{background:transparent;padding:10px;margin-left:-10px;
                width:0;padding-left:0;padding-right:0;overflow:hidden;
                opacity:0;pointer-events:none;
                transition:opacity .18s ease, width .18s ease, margin .18s ease,
                           padding .18s ease, background-color .12s ease;}
  .iconbtn.back svg{flex:none}
  .iconbtn.back.on{width:44px;padding:10px;margin-left:0;opacity:1;pointer-events:auto}

  /* Untere Navigationsleiste: freistehende, abgerundete Kapsel mit
     Abstand zum Bildschirmrand und leichtem Milchglas-Effekt, statt
     randlos anliegender Leiste. */
  .bottomnav{position:fixed;left:14px;right:14px;
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:15;
    display:flex;align-items:center;justify-content:space-around;
    padding:12px 4px;border-radius:28px;
    background:#1a1d24c2;
    -webkit-backdrop-filter:blur(22px) saturate(1.6);
    backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid #ffffff1a;
    box-shadow:0 10px 30px #000a, 0 1px 0 #ffffff0d inset;}
  .navitem{background:none;border:0;color:var(--mut);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:8px;flex:1;min-width:0;}
  .navitem svg{width:25px;height:25px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .navitem.active{color:var(--lime)}
  .navitem.disabled{opacity:.4}
  .navlabel{display:none}
  /* Golfplatz-Konten sehen eine eigene, reduzierte Nav-Leiste (nur
     Platz/Angebote) statt der Spieler-Leiste - Umschaltung ueber eine
     Klasse am body (siehe updateSidebarProfile()), gleiches Prinzip
     wie .desktop-only/.mobile-only. .club-only{display:none} muss vor
     body.club-account stehen, aber die Nachfahren-Selektoren unten sind
     ohnehin spezifischer als .navitem{display:flex} - keine
     !important-Kruecke noetig. */
  .club-only{display:none}
  body.club-account .player-only{display:none}
  body.club-account .club-only{display:flex}
  /* Nur am Rechner sichtbar - fuer Dinge, die es am Handy nicht gibt
     (z.B. Golfplatz-Registrierung/-Verwaltung). */
  .desktop-only{display:none}
  /* Gegenstueck: nur am Handy sichtbar (z.B. der Schritt-fuer-Schritt-
     Assistent bei "Runde hinzufuegen", der am Rechner einer breiten
     Tabelle weicht, oder der QR-Scan-Knopf in der Auswahl-Sheet). Auf
     dem Handy selbst keine eigene Regel noetig - Elemente wie button.btn
     behalten dort einfach ihr eigenes display. */
  /* Scan-Taste: mittig, angehoben, kreisrund, wie eine schwebende Taste
     innerhalb der Leiste statt eines normalen Symbols */
  .navitem.scan{margin-top:-26px}
  .navitem.scan .navscanwrap{width:52px;height:52px;border-radius:999px;
    background:var(--lime);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px #000a;transition:transform .15s ease}
  .navitem.scan:active .navscanwrap{transform:scale(.92)}
  .navitem.scan svg{width:24px;height:24px;color:#0d1117}

  /* Profilkopf auf der Startseite */
  .profilehead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .profilehead .ava{width:52px;height:52px;font-size:20px;flex:none}
  .profilehead .pname{font-size:18px;font-weight:700}
  .profilehead .pname.link{color:var(--mut);font-weight:600;font-size:15px}

  /* Freunde-Auswahl beim Termin anlegen: antippbare Avatare statt
     Abhak-Kaestchen, ausgewaehlt = gruener Kranz um das Bild. */
  .pickrow{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
  .pickava{background:none;border:0;padding:0;display:flex;flex-direction:column;
           align-items:center;gap:6px;cursor:pointer;color:inherit;font:inherit;width:58px}
  .pickava .ava{transition:box-shadow .15s ease}
  .pickava.on .ava{box-shadow:0 0 0 3px var(--lime)}
  .pickava .fname{font-size:11.5px;color:var(--mut);text-align:center;
                  max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linklike{color:var(--mut);font-size:13px;text-decoration:underline;
            text-underline-offset:3px;background:none;border:0;cursor:pointer;
            font-family:inherit;padding:0}
  /* Scanner */
  .scanview{position:fixed;inset:0;background:#000;z-index:40;
            display:flex;flex-direction:column;
            opacity:0;pointer-events:none;transition:opacity .2s}
  .scanview.on{opacity:1;pointer-events:auto}
  .scanview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* Profilbild antippen zum Vergroessern */
  .avazoom{position:fixed;inset:0;background:#000d;z-index:45;
           display:flex;align-items:center;justify-content:center;
           opacity:0;pointer-events:none;transition:opacity .2s}
  .avazoom.on{opacity:1;pointer-events:auto}
  .avazoom img{max-width:90vw;max-height:90vh;border-radius:16px;object-fit:contain}
  .ava img{cursor:zoom-in}

  /* Boot-Screen (siehe Markup ganz am Anfang von <body>) */
  #bootScreen{position:fixed;inset:0;z-index:9999;background:#101217;
              display:flex;align-items:center;justify-content:center;
              transition:opacity .35s ease}
  #bootScreen.out{opacity:0;pointer-events:none}
  #bootFlagPath{transform-box:fill-box;transform-origin:center;
                opacity:0;animation:bootFlagIn .5s .15s ease forwards}
  /* Ball fliegt von rechts ein, prallt zweimal auf (Stauchung per
     scaleX/scaleY), rollt kurz, faellt am Fahnenfuss ins Loch - die
     Abstaende zwischen den Aufprall-Punkten (27%/44%/58%) werden bewusst
     enger, das ergibt den "schnelle Treffer, dann Ruhe"-Rhythmus. Basis-
     position des <circle> bleibt die Lochposition (Endzustand), animiert
     wird nur relativ dazu per translate/scale.
     Fester transform-origin (statt transform-box:fill-box) - erspart dem
     Browser, bei jedem Frame die Bounding-Box neu zu berechnen, was auf
     schwaecheren Geraeten zu sichtbarem Ruckeln fuehren kann; der Punkt
     ist ohnehin exakt der Kreismittelpunkt, also keine optische Aenderung.
     Jede Sprung-Phase bekommt ihre EIGENE Easing-Funktion (fallen =
     beschleunigend/ease-in, hochspringen = abbremsend/ease-out) statt
     einer einzigen globalen Kurve fuer die ganze Animation - eine globale
     Kurve macht zwar das Gesamt-Tempo ungleichmaessig, interpoliert aber
     JEDEN einzelnen Sprungabschnitt weiterhin linear (= abrupte
     Richtungswechsel an jedem Aufprallpunkt), genau das wirkte ruckelig. */
  #bootBall{transform-origin:81.28px 148px;
            opacity:0;animation:bootBallFall 1.55s .5s linear forwards}
  @keyframes bootFlagIn{
    0%{opacity:0;transform:scale(.6)}
    100%{opacity:1;transform:scale(1)}
  }
  @keyframes bootBallFall{
    0%  {opacity:0;transform:translate(150px,-20px) scaleX(1) scaleY(1);
         animation-timing-function:cubic-bezier(.55,0,1,.45)}
    5%  {opacity:1;transform:translate(150px,-20px) scaleX(1) scaleY(1);
         animation-timing-function:cubic-bezier(.55,0,1,.45)}
    20% {transform:translate(95px,-6px) scaleX(1) scaleY(1);
         animation-timing-function:cubic-bezier(.55,0,1,.45)}
    27% {transform:translate(85px,0) scaleX(1.18) scaleY(.72);
         animation-timing-function:cubic-bezier(0,.55,.45,1)}
    36% {transform:translate(70px,-10px) scaleX(.94) scaleY(1.06);
         animation-timing-function:cubic-bezier(.55,0,1,.45)}
    44% {transform:translate(58px,0) scaleX(1.14) scaleY(.78);
         animation-timing-function:cubic-bezier(0,.55,.45,1)}
    50% {transform:translate(50px,-4px) scaleX(1) scaleY(1);
         animation-timing-function:cubic-bezier(.55,0,1,.45)}
    58% {transform:translate(42px,0) scaleX(1.08) scaleY(.88);
         animation-timing-function:ease-out}
    74% {transform:translate(14px,0) scaleX(1) scaleY(1);
         animation-timing-function:ease-in}
    90% {opacity:1;transform:translate(0,0) scaleX(1) scaleY(1);
         animation-timing-function:ease-in}
    100%{opacity:0;transform:translate(0,4px) scaleX(.15) scaleY(.15)}
  }
  .scantop{position:relative;z-index:2;display:flex;justify-content:space-between;
           align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .scantop .close{background:#00000080;border:0;color:#fff;width:40px;height:40px;
                  border-radius:999px;display:flex;align-items:center;justify-content:center}
  .scantop .close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
                      stroke-linecap:round;stroke-linejoin:round}
  .scanframe{position:relative;z-index:2;margin:auto;width:min(72vw,300px);
             aspect-ratio:1;border-radius:20px;
             box-shadow:0 0 0 2000px rgba(0,0,0,.55);}
  .scanframe::before{content:"";position:absolute;inset:0;border-radius:20px;
                     border:2.5px solid var(--lime)}
  .scanmsg{position:relative;z-index:2;text-align:center;color:#fff;
           font-size:14.5px;padding:22px 30px calc(30px + env(safe-area-inset-bottom));
           line-height:1.6}
  .scanmsg b{display:block;margin-bottom:6px;font-size:16px}
  .scanmsg .err{color:#ff8a8a}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .stat{background:var(--card);border-radius:14px;padding:14px 10px;text-align:center}
  .stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .k{font-size:11px;color:var(--mut);letter-spacing:.07em;
           text-transform:uppercase;margin-top:6px}

  .sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 12px}
  .sectionhead .t{font-size:13px;letter-spacing:.1em;text-transform:uppercase;
                  color:var(--mut);font-weight:600}
  .sectionhead .c{font-size:12.5px;color:var(--mut)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border-radius:14px;padding:14px 16px;
        display:flex;align-items:center;gap:14px;cursor:pointer;border:0;width:100%;
        text-align:left;color:inherit;font:inherit}
  .item:active{background:var(--bar)}
  .item .big{font-size:24px;font-weight:800;min-width:54px;font-variant-numeric:tabular-nums}
  .item .meta{flex:1;min-width:0}
  .item .meta .d{display:block;font-size:15px}
  .item .meta .s{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
  .item .chev{color:var(--mut);flex:none;display:flex}
  .item .chev svg{width:18px;height:18px;fill:none;stroke:currentColor;
                  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Golfplaetze-Kacheln auf der Startseite: bewusst immer 2 Spalten
     (auch am Handy), anders als .list/.item (volle Zeilen). */
  .clubgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .clubcard{position:relative;background:var(--card);border-radius:14px;padding:14px 10px;
            display:flex;flex-direction:column;align-items:center;gap:8px;
            text-align:center;cursor:pointer}
  .clubcard:active{background:var(--bar)}
  .clubcard .ava{width:48px;height:48px}
  .clubcard .name{font-size:13px;font-weight:600}
  .clubcard .sub{font-size:11.5px;color:var(--mut)}
  .clubcard .cardx{position:absolute;top:6px;right:6px;width:26px;height:26px}
  .clubcard .cardx svg{width:12px;height:12px}

  .empty{background:var(--card);border-radius:14px;padding:28px 22px;text-align:center;
         color:var(--mut);line-height:1.7}
  .empty b{color:var(--txt);display:block;margin-bottom:8px;font-size:17px}

  .date{text-align:center;font-size:14px;color:var(--mut);margin-bottom:2px}
  .datewrap{display:flex;justify-content:center}
  .datebtn{display:inline-flex;align-items:center;gap:8px;background:transparent;
           border:1px solid var(--line);border-radius:999px;color:var(--mut);
           font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
  .datebtn:active{background:#ffffff10}
  .datebtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
               stroke-linecap:round;stroke-linejoin:round;flex:none}
  .datebtn .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
                background:#ffffff14;border-radius:99px;padding:3px 7px}
  .hidden-date-input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  /* Allzweck-Utility statt wiederholtem style="display:none" (Datei-Input-
     Proxys, einmalig bedingt ausgeblendete Bloecke, per JS umgeschaltete
     Elemente ueber classList.toggle('hidden', ...)). */
  .hidden{display:none}
  /* Datum steht am Bildschirm im antippbaren Knopf, in der Unterzeile waere
     es doppelt. Im PDF ist der Knopf ausgeblendet, dort wird es gebraucht. */
  #subDate{display:none}
  .total{margin:14px 0 24px;text-align:center}
  .total .num{font-size:64px;font-weight:800;line-height:1}
  .total .sub{font-size:13px;color:var(--mut);letter-spacing:.1em;
              text-transform:uppercase;margin-top:8px}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border-radius:14px;overflow:hidden}
  th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
     font-weight:600;text-align:right;padding:12px 14px;background:var(--bar)}
  th:first-child,td:first-child{text-align:left}
  td{padding:11px 14px;text-align:right;font-variant-numeric:tabular-nums;
     border-top:1px solid #ffffff0d}
  tbody tr:first-child td{border-top:none}
  .good{color:var(--good)} .bad{color:var(--bad)} .even{color:var(--txt)}
  tfoot td{background:var(--bar);font-weight:700;border-top:2px solid #ffffff1a}

  .actions{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .actions.tight{margin-top:12px}
  /* "Nächstes Loch" beim Live-Mitzählen: Wisch-Leiste statt Antipp-Button
     (wie das alte iPhone-Entsperren) - der Griff muss bewusst bis fast ans
     Ende gezogen werden, ein einfaches Antippen loest nichts aus. Siehe
     startHoleWizard()/advanceHole() fuer die Pointer-Event-Logik. */
  .slidewrap{position:relative;width:100%;height:60px;border-radius:999px;
    background:#ffffff10;box-shadow:inset 0 0 0 1px #ffffff1a;
    overflow:hidden;display:flex;align-items:center;touch-action:pan-y}
  /* left/top/bottom exakt wie beim Griff (4px Inset auf allen Seiten) -
     vorher stand hier left:0 waehrend der Griff bei left:4px startet,
     wodurch das Gruen 4px zu weit links lag und links unter dem Griff
     hervorschaute statt exakt dahinter zu liegen. Die Breite endet in
     JS bewusst an der MITTE des Griffs, nicht an dessen rechter Kante -
     der Griff ist rund, ein eckiger Fuellbalken bis zur rechten Kante
     wuerde oben/unten an den Ecken unter dem runden Griff hervorschauen.
     Der auslaufende Farbverlauf (statt eines harten Farbschnitts) macht
     den Uebergang zusaetzlich weich statt schlagartig. */
  .slidefill{position:absolute;left:4px;top:4px;bottom:4px;width:52px;
    background:linear-gradient(to right, var(--lime), var(--lime) 55%, transparent);
    opacity:.28;border-radius:999px 0 0 999px}
  .slidelabel{position:absolute;left:0;right:0;text-align:center;
    font-size:15px;font-weight:600;color:var(--mut);pointer-events:none}
  .slidethumb{position:absolute;left:4px;top:4px;width:52px;height:52px;
    border-radius:999px;background:var(--lime);display:flex;
    align-items:center;justify-content:center;box-shadow:0 4px 12px #0006;
    touch-action:none;cursor:grab}
  .slidethumb svg{width:24px;height:24px;color:#0d1117;fill:none;
    stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  body.wizard-fullscreen .slidewrap{height:72px}
  body.wizard-fullscreen .slidefill{width:64px}
  body.wizard-fullscreen .slidethumb{width:64px;height:64px;top:4px}
  body.wizard-fullscreen .slidelabel{font-size:17px}
  button.btn{font:600 15px/1 inherit;font-family:inherit;color:#0d1117;background:var(--lime);
    border:0;border-radius:999px;padding:14px 24px;cursor:pointer;
    display:inline-flex;align-items:center;gap:9px}
  button.btn:active{transform:translateY(1px)}
  button.btn.ghost{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px #ffffff1f}
  button.btn.saved{background:#2a3b1c;color:var(--lime)}
  /* Aktions-Knopf im eigenen Bestaetigungs-Dialog (siehe confirmDialog()) -
     alle 12 Faelle sind destruktiv/negativ (loeschen, entfolgen, ablehnen, ...),
     daher standardmaessig in --bad statt in der normalen Akzentfarbe. */
  button.btn.danger{background:var(--bad);color:#fff}
  button.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;
                 stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hint{margin-top:14px;font-size:12.5px;color:var(--mut);text-align:center;line-height:1.7}
  .confirmbox{background:var(--card);border-radius:14px;padding:14px 16px;margin:14px 0;
       font-size:13.5px;color:var(--mut);display:flex;flex-direction:column;gap:10px}
  .confirmbox.ok{flex-direction:row;align-items:center;gap:8px;color:var(--good)}
  .confirmbox svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;
       stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .sheetbg{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;
           transition:opacity .18s;z-index:20}
  .sheetbg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
         border-radius:20px 20px 0 0;padding:10px 12px calc(18px + env(safe-area-inset-bottom));
         transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);
         max-width:520px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:#ffffff2b;margin:6px auto 12px}
  .menuitem{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;
            color:inherit;font:inherit;text-align:left;padding:14px 12px;border-radius:12px;cursor:pointer}
  .menuitem:active{background:#ffffff10}
  .menuitem svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
                stroke-linecap:round;stroke-linejoin:round;color:var(--mut);flex:none}
  .menuitem .lbl{flex:1}
  .menuitem .lbl .sub{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
  .badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
         border:1px solid var(--line);border-radius:99px;padding:4px 9px;flex:none}
  .sep{height:1px;background:var(--line);margin:8px 12px}

  .ph{background:var(--card);border-radius:14px;padding:26px 22px;text-align:center;
      color:var(--mut);line-height:1.75}
  .ph .ic{display:flex;justify-content:center;margin-bottom:14px;color:var(--mut)}
  .ph .ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;
              stroke-linecap:round;stroke-linejoin:round}
  .ph b{color:var(--txt);display:block;font-size:18px;margin-bottom:10px}
  .ph .soon{display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--mut);border:1px solid var(--line);
            border-radius:99px;padding:5px 12px}

  .panel{background:var(--card);border-radius:14px;padding:20px;margin-bottom:12px}
  .panel h3{margin:0 0 8px;font-size:16px;font-weight:700}
  .panel p{margin:0 0 14px;font-size:13.5px;color:var(--mut);line-height:1.7}
  .panel .actions{margin-top:0;justify-content:flex-start}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
         max-width:488px;margin:0 auto;background:var(--bar);border:1px solid var(--line);
         border-radius:14px;padding:14px 16px;font-size:14px;z-index:30;
         opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.withaction{pointer-events:auto;display:flex;align-items:center;gap:12px}
  .toast.withaction span{flex:1}
  .taction{background:transparent;border:0;color:var(--lime);font:600 14px inherit;
           font-family:inherit;cursor:pointer;padding:6px 4px;flex:none}
  .toast.bad{border-color:#ff5c5c44}

  .form{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .form input{background:var(--bg);border:1px solid var(--line);border-radius:12px;
              -webkit-user-select:text;user-select:text;
              color:var(--txt);font:inherit;font-size:16px;padding:13px 14px;width:100%}
  .form input:focus,.form textarea:focus{outline:none;border-color:#ffffff33}
  .form input::placeholder,.form textarea::placeholder{color:var(--mut)}
  .form textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;
              -webkit-user-select:text;user-select:text;resize:vertical;
              color:var(--txt);font:inherit;font-size:16px;padding:13px 14px;width:100%}
  .pars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
             gap:10px;margin:12px 0}
  .pars-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
  /* Golfplatz-Verwaltung: eine Zeile pro Loch (Par + optionale
     Herren-/Damen-Entfernung), statt eines reinen Par-Rasters. */
  .holeinfo-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .holeinfo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .holeinfo-num{font-size:12.5px;color:var(--mut);width:52px;flex:none}
  .holeinfo-row select{background:var(--bg);border:1px solid var(--line);border-radius:10px;
                        color:var(--txt);font:inherit;font-size:13.5px;padding:9px 6px;flex:1 1 90px}
  .holeinfo-row input[type="number"]{background:var(--bg);border:1px solid var(--line);
                        border-radius:10px;color:var(--txt);font:inherit;font-size:13.5px;
                        padding:9px 8px;width:0;flex:1 1 90px}
  /* Desktop-Seite "Runde eintragen": alle Loecher auf einen Blick statt
     Schritt-fuer-Schritt-Assistent (siehe .mobile-only/.desktop-only). */
  .holegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:8px;margin:14px 0}
  .holerow{display:grid;grid-template-columns:64px 1fr 1fr;gap:10px;align-items:center;
           background:var(--card);border-radius:12px;padding:10px 14px}
  .holerow .holenum{font-size:13px;color:var(--mut);font-weight:600}
  .holerow select,.holerow input{background:var(--bg);border:1px solid var(--line);
           border-radius:10px;color:var(--txt);font:inherit;font-size:15px;
           padding:9px 10px;width:100%}
  .form select{background:var(--bg);border:1px solid var(--line);border-radius:12px;
       color:var(--txt);font:inherit;padding:12px}
  .seg{display:flex;gap:8px;margin-bottom:2px}
  .seg button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);
       background:var(--bg);color:var(--txt);font:600 15px inherit;cursor:pointer}
  .seg button.on{background:var(--lime);color:#0d1117;border-color:var(--lime)}
  .switchrow{display:flex;align-items:center;gap:10px;font-size:14px;
       margin:4px 0 14px;cursor:pointer}
  .switchrow input{width:18px;height:18px;flex:none}
  .stepperrow{display:flex;align-items:center;justify-content:space-between;
       padding:16px 4px;border-top:1px solid var(--line)}
  .stepperrow:first-of-type{border-top:0}
  .steppertitle{font-size:15px;font-weight:600}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
       background:var(--bg);color:var(--txt);font:600 20px inherit;cursor:pointer;
       display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
  .stepper span{min-width:30px;text-align:center;font-size:20px;font-weight:700;color:var(--lime)}
  .holeprogress{font-size:12.5px;color:var(--mut);text-align:center;margin:-6px 0 16px}
  /* Kopfzeile des Loch-fuer-Loch-Wizards: Schliessen/Name/Info im
     normalen Fluss (kein position:absolute mehr) - das sass vorher
     relativ zum vertikal zentrierten .wizardpanel und landete dadurch
     nicht in der echten Bildschirmecke, sondern irgendwo mittig. */
  .wizardtop{display:flex;align-items:center;justify-content:space-between;
             gap:10px;margin-bottom:6px}
  /* Ueberblendung beim Wechsel zum naechsten Loch statt eines schlagartigen
     Inhalts-Austauschs (renderStep() ersetzt sonst das komplette Markup
     ohne jeden Uebergang) - siehe advanceHole()/renderStep(). Bewusst nur
     auf .wizardfade (Kopfzeile + Par/Schlaege), NICHT auf die Wisch-Leiste
     selbst (.actions bleibt aussen vor) - die Leiste hat mit dem Griff-
     Zuruecksprung schon ihre eigene Animation und soll sonst unveraendert,
     dauerhaft an derselben Stelle stehen bleiben statt mit auszublenden. */
  .wizardfade{transition:opacity .22s ease, transform .22s ease}
  .wizardfade.stepenter{opacity:0;transform:translateY(8px)}
  .wizardfade.stepexit{opacity:0;transform:translateY(-8px)}
  .wizardcoursename{flex:1;text-align:center;font-size:14px;font-weight:600;
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wizardscore{text-align:center;font-size:32px;font-weight:800;margin:2px 0 10px}

  /* Live spielen: Kopf-/Fussleiste weg, Loch-fuer-Loch-Zaehler nutzt die
     volle Flaeche mit deutlich groesseren Bedienelementen - unterwegs auf
     dem Platz bedient man das ja nicht am Schreibtisch. */
  body.wizard-fullscreen .topbar,
  body.wizard-fullscreen .bottomnav{display:none}
  body.wizard-fullscreen{padding-bottom:0}
  /* Anmelde-Bildschirm: obere und untere Leiste fuehren ohne Konto
     sowieso nirgends hin, also weg damit - nur die eigentliche
     Anmeldung soll zu sehen sein (siehe route()). */
  body.loginscreen .topbar,
  body.loginscreen .bottomnav{display:none}
  body.loginscreen{padding-bottom:0;min-height:100vh;min-height:100dvh;
                    display:flex;flex-direction:column}
  body.loginscreen .wrap{flex:1;width:100%;
                          display:flex;flex-direction:column;justify-content:center}
  /* #manualMobile wird per JS (startHoleWizard()) erst dann zuverlaessig
     zum echten Containing-Block-freien position:fixed-Element, wenn
     #content zuvor sein .fadein entfernt bekommt - siehe Kommentar dort. */
  body.wizard-fullscreen #manualMobile{
    position:fixed;inset:0;z-index:20;background:var(--bg);
    display:flex;flex-direction:column;
    padding:calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    box-sizing:border-box}
  /* .panel selbst wird ein hoher Flex-Container (Kopfzeile oben, Knopf
     unten fest, .wizardmid dazwischen nimmt den Rest ein und zentriert
     die Stepper darin) - so nutzt die Ansicht wirklich die ganze
     Bildschirmhoehe statt einer kleinen, mittig schwebenden Karte.
     .wizardfade (Kopfzeile+Mitte, siehe Ueberblend-Kommentar oben bei
     .wizardfade) muss den Flex-Fluss von .panel unveraendert an
     .wizardmid durchreichen, sonst faellt .wizardmid auf seine
     Inhaltshoehe zusammen - .actions/die Wisch-Leiste bleibt bewusst
     ausserhalb von .wizardfade ein direktes Flex-Kind von .panel. */
  body.wizard-fullscreen #manualMobile .panel{background:transparent;padding:0;margin:0;
    flex:1;display:flex;flex-direction:column;min-height:0}
  body.wizard-fullscreen .wizardfade{flex:1;display:flex;flex-direction:column;min-height:0}
  body.wizard-fullscreen .wizardmid{flex:1;display:flex;flex-direction:column;
    justify-content:center;min-height:0}
  body.wizard-fullscreen .wizardcoursename{font-size:17px}
  body.wizard-fullscreen .wizardscore{font-size:52px;margin:6px 0 18px}
  body.wizard-fullscreen .stepperrow{padding:32px 4px}
  body.wizard-fullscreen .steppertitle{font-size:19px}
  body.wizard-fullscreen .stepper{gap:30px}
  body.wizard-fullscreen .stepper button{width:60px;height:60px;font-size:30px}
  body.wizard-fullscreen .stepper span{font-size:38px}
  body.wizard-fullscreen .holeprogress{font-size:16px;margin:0 0 6px}
  body.wizard-fullscreen .actions{margin-top:28px}
  body.wizard-fullscreen .actions .btn{flex:1;padding:20px;font-size:18px}
  .warn{margin:14px 0 0;font-size:12.5px;color:var(--mut);line-height:1.7}
  button.btn.google{width:100%;background:#fff;color:#1f1f1f;justify-content:center;

  .ava{position:relative;width:40px;height:40px;border-radius:999px;background:var(--bar);

                   display:flex;align-items:center;justify-content:center;
                   flex:none;color:var(--lime)}
  .contactbtn .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;

  .dtinput{background:var(--bg);border:1px solid var(--line);border-radius:12px;

  /* ---------- Dezente Animationen ---------- */

  /* Pulsierender Platzhaltertext, waehrend z.B. der Profilname noch laedt */
  .pulse-load{animation:pulseOpac 1.1s ease-in-out infinite}
  @keyframes pulseOpac{0%,100%{opacity:.35}50%{opacity:.85}}

  /* ==========================================================
     Quer-Sperre am Handy. Die App soll nur im Hochformat nutzbar sein -
     manifest.json setzt zwar schon "orientation":"portrait", das wirkt
     aber nur bei einer als PWA installierten App unter Android; im
     normalen Browser-Tab UND grundsaetzlich auf iOS (dort gibt es dafuer
     ueberhaupt keine Web-API, auch nicht fuer installierte PWAs) dreht
     sich die Ansicht trotzdem mit. Da sich das Drehen selbst nicht
     verhindern laesst, blendet dieser Vollbild-Hinweis den Inhalt
     stattdessen aus, solange man das Handy quer haelt.
     pointer:coarse grenzt Touch-Geraete von Maus-Desktops ab (die die
     Rechner-Ansicht unten absichtlich behalten, auch bei einem breiten,
     "querformatigen" Fenster). max-width:960px grenzt grosse Handys von
     echten Tablets ab, deren Querformat regulaer in dieselbe, funktio-
     nierende Rechner-Ansicht faellt statt gesperrt zu werden. Reine
     Media Query, kein Resize-Listener noetig - greift von selbst bei
     jeder Drehung. */
  .rotate-lock{display:none}
  @media (orientation:landscape) and (pointer:coarse) and (max-width:960px) {
    .rotate-lock{
      display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);
      flex-direction:column;align-items:center;justify-content:center;
      gap:16px;text-align:center;padding:32px;color:var(--txt);
    }

  /* ==========================================================
     Rechner-Ansicht ab 860px. Reine Umschichtung derselben Elemente
     per CSS, keine JS-Aenderung an Routing/Verhalten - fuer Handys
     (siehe .rotate-lock oben) sowie fuer alles unterhalb von 860px
     Breite bleibt die normale Handy-Ansicht bestehen.

  @media (min-width: 860px) {
    body{padding-bottom:0}

    .bottomnav{left:0;right:auto;top:0;bottom:0;width:236px;height:100vh;

       ausblenden koennen, z.B. den QR-Scan-Knopf in der Auswahl-Sheet. */
    .mobile-only{display:none!important}

      box-shadow:none;color:inherit}

    .wrap,.topbar{margin:0 0 0 268px;max-width:min(1040px, calc(100vw - 268px - 48px))}

    .sheetbg{background:transparent}

      transition:transform .16s ease,opacity .16s ease;
      pointer-events:none}

      align-items:stretch}

var SUPABASE_URL = 'https://hieaduzvsqkwvdxfscoo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_Qn7gucn459dApRgYZgTbyQ_8FZS2sJG';

/* Gemeinsamer Projekt-Versionsstand (Geraet + Web-App), solange das
   Projekt noch vor 1.0 ist: von Hand hochzaehlen, wenn ein
   zusammenhaengender Fortschritt erreicht ist, nicht bei jeder
   Kleinigkeit. Nicht zu verwechseln mit CACHE_NAME in service-worker.js,
   das zaehlt bei jedem Ausliefern hoch und hat nichts mit dem

var APP_VERSION = '0.49';

/* Sperrbildschirm-Anzeige (iOS Live Activity) fuer live gespielte Runden.
   Nur in der nativen Capacitor-App vorhanden - im Browser/PWA sind alle
   Aufrufe stille No-ops. Native Seite: capacitor/native/. */
var LiveRoundNative = (function () {
  var plugin = null, active = false;
  function get() {
    if (plugin) return plugin;
    try {
      var C = window.Capacitor;
      if (C && C.isNativePlatform && C.isNativePlatform() && C.registerPlugin) {
        plugin = C.registerPlugin('LiveRound');
      }
    } catch (e) { plugin = null; }
    return plugin;
  }
  function call(name, data) {
    try {
      var p = get();
      if (!p) return;
      var r = p[name](data || {});
      if (r && r.catch) r.catch(function () {});
    } catch (e) {}
  }
  return {
    start: function (data) { active = true; call('start', data); },
    update: function (data) { if (active) call('update', data); },
    end: function () { if (!active) return; active = false; call('end'); }
  };
})();

<script>
(function () {
  'use strict';

  var content = document.getElementById('content');
  var brand   = document.getElementById('brand');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  // Loest bei jeder Aenderung des Seiteninhalts ein sanftes Einblenden aus,
  // unabhaengig davon ob eine Seite sofort steht (renderHome) oder erst
  // nach dem Laden von Daten (renderFeed, renderPlan usw.). Dadurch
  // muss keine einzelne render-Funktion selbst um die Animation wissen.
  new MutationObserver(function () {
    content.classList.remove('fadein');
    void content.offsetWidth;   // Reflow erzwingen, damit die Animation neu startet
    content.classList.add('fadein');
  }).observe(content, { childList: true });

  function toast(msg, isBad) {
    toastEl.innerHTML = '';
    toastEl.textContent = msg;
    toastEl.className = 'toast on' + (isBad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 3200);
  }

  // Meldung mit Knopf, z.B. zum Rueckgaengigmachen
  function toastAction(msg, label, fn) {
    toastEl.innerHTML = '<span>' + msg + '</span>' +
                        '<button class="taction" id="tAct">' + label + '</button>';
    toastEl.className = 'toast on withaction';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 8000);
    document.getElementById('tAct').addEventListener('click', function () {
      toastEl.className = 'toast';
      clearTimeout(toastTimer);
      fn();
    });
  }

  /* ==========================================================
     Konto (Supabase Auth)
     ========================================================== */
  var Auth = (function () {
    var client = null, user = null, ready = false;
    var listeners = [];
    var recovery = false;   // kommt gerade aus der "Passwort vergessen"-Mail
    // Kommt man ueber den Bestaetigungslink aus der Registrierungsmail, steht
    // "type=signup" im #-Teil - supabase-js raeumt den Teil beim Start auf,
    // darum hier VORHER merken (nur fuer die Willkommens-Meldung).
    var fromConfirmLink = /[#&]type=signup/.test(location.hash || '');

    // In der nativen App ist die Seitenadresse capacitor://localhost - das
    // ist als Ziel fuer Links aus E-Mails/OAuth ungueltig. Dort zeigen die
    // Links auf die Web-Fassung (Konto ist dasselbe, danach in der App
    // einfach anmelden).
    var WEB_APP_URL = 'https://luis200701.github.io/pocketcaddy/';
    function isNative() {
      try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
      catch (e) { return false; }
    }
    function redirectUrl() {
      return isNative() ? WEB_APP_URL : location.origin + location.pathname;
    }

    function init(cb) {
      try {
        if (window.supabase && window.supabase.createClient) {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (e) { client = null; }

      if (!client) { ready = true; cb && cb(); return; }   // ohne Netz nur lokal

      client.auth.getSession().then(function (res) {
        user = (res && res.data && res.data.session) ? res.data.session.user : null;
        ready = true;
        cb && cb();
      }).catch(function () { ready = true; cb && cb(); });

      client.auth.onAuthStateChange(function (evt, session) {
        var before = user ? user.id : null;
        user = session ? session.user : null;
        // Supabase meldet PASSWORD_RECOVERY, wenn der Link aus der Mail
        // geoeffnet wurde. Dann zeigen wir das Feld fuer das neue Passwort.
        if (evt === 'PASSWORD_RECOVERY') {
          recovery = true;
          location.hash = 'menu/login';
        }
        if ((user ? user.id : null) !== before || evt === 'PASSWORD_RECOVERY') {
          listeners.forEach(function (f) { f(user); });
        }
        if (evt === 'SIGNED_IN' && fromConfirmLink) {
          fromConfirmLink = false;
          setTimeout(function () { toast('E-Mail bestätigt – willkommen!'); }, 400);
        }
      });
    }

    return {
      init: init,
      onChange: function (f) { listeners.push(f); },
      isReady: function () { return ready; },
      isOnline: function () { return !!client; },
      isRecovery: function () { return recovery; },
      clearRecovery: function () { recovery = false; },
      user: function () { return user; },
      id: function () { return user ? user.id : null; },
      email: function () { return user ? user.email : ''; },
      isNative: isNative,
      signUp: function (email, pw) {
        return client.auth.signUp({ email: email, password: pw,
          options: { emailRedirectTo: redirectUrl() } });
      },
      // Bestaetigungsmail nochmal schicken (Supabase drosselt selbst auf 1/min).
      resendConfirmation: function (email) {
        return client.auth.resend({ type: 'signup', email: email,
          options: { emailRedirectTo: redirectUrl() } });
      },
      signIn: function (email, pw) {
        return client.auth.signInWithPassword({ email: email, password: pw });
      },
      // OAuth-Anmeldung (z.B. Google). Leitet auf Google weiter und
      // zurueck, danach ist man angemeldet, wie bei E-Mail/Passwort.
      // WICHTIG: redirectTo darf keine # enthalten. Die Seite nutzt die
      // Raute selbst fuer die eigene Navigation, und Supabase haengt bei
      // der Rueckkehr eigene Anmeldedaten an dieselbe Stelle an. Beides
      // gleichzeitig fuehrt dazu, dass keins von beidem sauber ankommt,
      // die Anmeldung sah dann erfolgreich aus, blieb aber nicht haengen.
      signInWithProvider: function (provider) {
        return client.auth.signInWithOAuth({
          provider: provider,
          options: { redirectTo: redirectUrl() }
        });
      },
      // Schickt eine Mail mit Link zurueck auf diese Seite. Der Anker
      // #menu/login sorgt dafuer, dass man direkt im Kontobereich landet.
      // Schickt eine Mail mit Link zurueck auf diese Seite. Auch hier
      // bewusst ohne # in der Adresse, aus demselben Grund wie oben bei
      // signInWithProvider. Die Weiterleitung auf die Passwort-Maske
      // passiert stattdessen im PASSWORD_RECOVERY-Ereignis unten.
      resetPassword: function (email) {
        return client.auth.resetPasswordForEmail(email, {
          redirectTo: redirectUrl()
        });
      },
      updatePassword: function (pw) {
        return client.auth.updateUser({ password: pw });
      },
      signOut: function () { return client.auth.signOut(); },
      db: function () { return client; }
    };
  })();

  // Ruft eine Supabase Edge Function auf und sorgt dafuer, dass bei einem
  // Fehler die ECHTE Fehlermeldung der Funktion in r.error.message landet.
  // supabase-js liefert bei einem Nicht-2xx-Status sonst immer nur das
  // generische "Edge Function returned a non-2xx status code" - die
  // eigentliche JSON-Antwort der Funktion steckt unangetastet in
  // error.context (der rohen, noch nicht gelesenen Response).
  function invokeEdgeFunction(name, body) {
    return Auth.db().functions.invoke(name, body ? { body: body } : undefined)
      .then(function (r) {
        if (r.error && r.error.context && typeof r.error.context.json === 'function') {
          return r.error.context.json().then(function (parsed) {
            if (parsed && parsed.error) r.error.message = parsed.error;
            return r;
          }).catch(function () { return r; });
        }
        return r;
      });
  }

  /* ==========================================================
     Speicherschicht
     Die Oberflaeche spricht nur mit Store, nie direkt mit
     localStorage oder der Datenbank.

     Ohne Anmeldung: alles liegt unter pc_rounds_v2 (wie bisher).
     Mit Anmeldung:  eigene Ablage pro Konto (pc_rounds_v2_<id>),
                     die im Hintergrund mit dem Server abgeglichen
                     wird. Der lokale Teil bleibt als Zwischen-
                     speicher erhalten, damit auch ohne Netz
                     gespeichert werden kann.
     ========================================================== */
  var Store = (function () {
    var KEY_ANON = 'pc_rounds_v2';
    var KEY_V1   = 'pc_rounds_v1';   // alte Fassung, bleibt als Sicherheitsnetz liegen

    function key() {
      var id = Auth.id();
      return id ? (KEY_ANON + '_' + id) : KEY_ANON;
    }

    function available() {
      try { localStorage.setItem('pc_t','1'); localStorage.removeItem('pc_t'); return true; }
      catch (e) { return false; }
    }

    function newId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function readRaw(k) {
      try {
        var raw = localStorage.getItem(k || key());
        var arr = raw ? JSON.parse(raw) : null;
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
      return null;
    }

    function writeRaw(arr, k) {
      try { localStorage.setItem(k || key(), JSON.stringify(arr)); return true; }
      catch (e) { return false; }
    }

    // Einmalige Uebernahme aus der alten Fassung. Betrifft nur die Ablage
    // ohne Anmeldung, alte Daten gab es ja nur dort.
    function migrate() {
      if (Auth.id()) return;
      var FLAG = 'pc_migrated_v2';
      try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
      var old = [];
      try {
        var raw = localStorage.getItem(KEY_V1);
        old = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(old)) old = [];
      } catch (e) { old = []; }

      var existing = readRaw() || [];
      var have = {};
      existing.forEach(function (r) { have[r.code] = true; });

      var now = Date.now();
      old.forEach(function (x, i) {
        if (!x || typeof x.code !== 'string' || have[x.code]) return;
        var t = x.saved || (now - (old.length - i) * 1000);
        existing.push({ id:newId(), code:x.code, date:x.date || '',
                        createdAt:t, updatedAt:t, deleted:false });
      });
      if (writeRaw(existing)) {
        try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      }
    }

    // Vereinheitlichung: In frueheren Fassungen stand der Datumsvorsatz mit
    // im Feld code ("260816-4533..."). Dadurch waere dieselbe Runde einmal
    // mit und einmal ohne Vorsatz als zwei verschiedene gezaehlt worden.
    // Hier wird der Vorsatz einmalig herausgeloest, je Ablage getrennt.
    function normalize() {
      var FLAG = 'pc_normalized_' + key();
      try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
      var arr = readRaw() || [];
      arr.forEach(function (r) {
        var m = /^(\d{6})-(.+)$/.exec(r.code || '');
        if (m) { if (!r.date) r.date = m[1]; r.code = m[2]; }
      });
      if (writeRaw(arr)) {
        try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      }
    }

    function all() {
      migrate(); normalize();
      return (readRaw() || []).filter(function (r) { return !r.deleted; });
    }

    function allIncludingDeleted() {
      migrate(); normalize();
      return readRaw() || [];
    }

    function add(code, date, opts) {
      var arr = allIncludingDeleted();
      var now = Date.now();
      var rec = { id:newId(), code:code, date:date || '',
                  createdAt:now, updatedAt:now, deleted:false, confirmed:false,
                  location:(opts && opts.location) || null,
                  playmates:(opts && opts.playmates) || null };
      arr.push(rec);
      if (!writeRaw(arr)) return null;
      pushSoon();
      return rec;
    }

    // Eine Runde gilt als bereits gespeichert, wenn Code UND Datum passen.
    // Nur der Code reicht nicht: Ohne Datum im QR-Code waere eine zweite
    // Runde mit exakt denselben Pars und Schlaegen sonst faelschlich eine
    // Dublette. An einem anderen Tag ist es eine neue Runde.
    function findSaved(code, date) {
      var hit = null;
      all().forEach(function (r) {
        if (r.code === code && (r.date || '') === (date || '')) hit = r;
      });
      return hit;
    }

    function setDate(id, date) {
      var arr = allIncludingDeleted();
      var hit = false;
      arr.forEach(function (r) {
        if (r.id === id) { r.date = date || ''; r.updatedAt = Date.now(); hit = true; }
      });
      if (!hit || !writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function remove(id) {
      var arr = allIncludingDeleted();
      var now = Date.now();
      var hit = false;
      arr.forEach(function (r) {
        if (r.id === id && !r.deleted) { r.deleted = true; r.updatedAt = now; hit = true; }
      });
      if (!hit || !writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function removeAll() {
      var arr = allIncludingDeleted();
      var now = Date.now();
      arr.forEach(function (r) {
        if (!r.deleted) { r.deleted = true; r.updatedAt = now; }
      });
      if (!writeRaw(arr)) return false;
      pushSoon();
      return true;
    }

    function exportData() {
      return {
        app: 'pocketcaddy',
        format: 2,
        exportedAt: new Date().toISOString(),
        rounds: allIncludingDeleted()
      };
    }

    // Zusammenfuehren statt ersetzen: unbekannte Kennungen kommen dazu,
    // bekannte gewinnen nach dem juengeren updatedAt.
    // Ausnahme: Steht eine Runde lokal auf geloescht, ist sie in der Datei
    // aber vorhanden, wird sie wiederhergestellt. Sonst braechte eine
    // Sicherung nach einem Loeschen nichts zurueck, weil das Loeschen ja
    // immer juenger ist als die Datei.
    function importData(obj) {
      if (!obj || obj.app !== 'pocketcaddy' || !Array.isArray(obj.rounds)) {
        return { ok:false, reason:'format' };
      }
      var arr = allIncludingDeleted();
      var byId = {};
      arr.forEach(function (r) { byId[r.id] = r; });

      var added = 0, updated = 0, restored = 0;
      var now = Date.now();

      obj.rounds.forEach(function (r) {
        if (!r || typeof r.code !== 'string' || !r.id) return;
        var cur = byId[r.id];

        if (!cur) {
          arr.push({ id:r.id, code:r.code, date:r.date || '',
                     createdAt:r.createdAt || now,
                     updatedAt:r.updatedAt || now,
                     deleted:!!r.deleted });
          if (!r.deleted) added++;
          return;
        }

        if (cur.deleted && !r.deleted) {
          cur.code = r.code; cur.date = r.date || '';
          cur.deleted = false; cur.updatedAt = now;
          restored++;
          return;
        }

        if ((r.updatedAt || 0) > (cur.updatedAt || 0)) {
          cur.code = r.code; cur.date = r.date || '';
          cur.deleted = !!r.deleted; cur.updatedAt = r.updatedAt;
          updated++;
        }
      });

      if (!writeRaw(arr)) return { ok:false, reason:'write' };
      return { ok:true, added:added, updated:updated, restored:restored };
    }

    /* ---------- Abgleich mit dem Server ---------- */

    function toRow(r, uid) {
      return { id:r.id, user_id:uid, code:r.code, date:r.date || null,
               created_at:new Date(r.createdAt || Date.now()).toISOString(),
               updated_at:new Date(r.updatedAt || Date.now()).toISOString(),
               deleted:!!r.deleted, confirmed:!!r.confirmed,
               location:r.location || null, playmates:r.playmates || null };
    }
    function fromRow(row) {
      return { id:row.id, code:row.code, date:row.date || '',
               createdAt:Date.parse(row.created_at) || Date.now(),
               updatedAt:Date.parse(row.updated_at) || Date.now(),
               deleted:!!row.deleted, confirmed:!!row.confirmed,
               location:row.location || null, playmates:row.playmates || null };
    }

    var syncing = false;
    var pushTimer = null;

    // Sammelt kurz, statt bei jedem Klick einzeln zu senden.
    // Schlaegt der Abgleich fehl (kein Netz), bleibt alles lokal liegen und
    // wandert beim naechsten erfolgreichen Abgleich hoch.
    function pushSoon() {
      if (!Auth.id() || !Auth.isOnline()) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function () { sync(); }, 600);
    }

    // Holt alles vom Server, fuehrt es mit dem lokalen Stand zusammen
    // (juengeres updatedAt gewinnt) und schiebt danach zurueck, was lokal
    // neuer ist. Damit funktioniert auch Speichern ohne Netz: die Runde
    // liegt lokal und wandert beim naechsten Abgleich hoch.
    function sync() {
      var uid = Auth.id();
      if (!uid || !Auth.isOnline() || syncing) return Promise.resolve({ ok:false });
      syncing = true;

      var db = Auth.db();
      return db.from('rounds').select('*').eq('user_id', uid)
        .then(function (res) {
          if (res.error) throw res.error;

          var local = readRaw() || [];
          var byId = {};
          local.forEach(function (r) { byId[r.id] = r; });

          var pushUp = [];
          (res.data || []).forEach(function (row) {
            var remote = fromRow(row);
            var cur = byId[remote.id];
            if (!cur) { local.push(remote); byId[remote.id] = remote; }
            else if (remote.updatedAt > cur.updatedAt) {
              cur.code = remote.code; cur.date = remote.date;
              cur.deleted = remote.deleted; cur.confirmed = remote.confirmed;
              cur.location = remote.location; cur.playmates = remote.playmates;
              cur.updatedAt = remote.updatedAt;
            } else if (cur.updatedAt > remote.updatedAt) {
              pushUp.push(cur);
            }
          });

          var known = {};
          (res.data || []).forEach(function (row) { known[row.id] = true; });
          local.forEach(function (r) { if (!known[r.id]) pushUp.push(r); });

          writeRaw(local);
          if (!pushUp.length) return { ok:true, pushed:0 };

          return db.from('rounds')
            .upsert(pushUp.map(function (r) { return toRow(r, uid); }))
            .then(function (up) {
              if (up.error) throw up.error;
              return { ok:true, pushed:pushUp.length };
            });
        })
        .then(function (r) { syncing = false; return r; })
        .catch(function (e) {
          syncing = false;
          return { ok:false, error:(e && e.message) || 'unbekannt' };
        });
    }

    // Beim ersten Anmelden werden die lokal gespeicherten Runden ins Konto
    // uebernommen. Es wird gemeldet, wie viele es waren, und es laesst sich
    // rueckgaengig machen. Das ist bewusst so: sonst wandern beim Anmelden
    // auf einem fremden Geraet dessen Runden still in das eigene Konto.
    function claimLocal() {
      var uid = Auth.id();
      if (!uid) return { moved:0 };
      var FLAG = 'pc_claimed_' + uid;
      try { if (localStorage.getItem(FLAG)) return { moved:0 }; } catch (e) { return { moved:0 }; }

      var anon = (readRaw(KEY_ANON) || []).filter(function (r) { return !r.deleted; });
      try { localStorage.setItem(FLAG, '1'); } catch (e) {}
      if (!anon.length) return { moved:0 };

      var mine = readRaw() || [];
      var byId = {};
      mine.forEach(function (r) { byId[r.id] = true; });
      var movedIds = [];
      anon.forEach(function (r) {
        if (byId[r.id]) return;
        mine.push({ id:r.id, code:r.code, date:r.date || '',
                    createdAt:r.createdAt, updatedAt:Date.now(), deleted:false });
        movedIds.push(r.id);
      });
      writeRaw(mine);
      return { moved:movedIds.length, ids:movedIds };
    }

    // Nimmt eine gerade erfolgte Uebernahme wieder zurueck
    function undoClaim(ids) {
      if (!ids || !ids.length) return;
      var mine = readRaw() || [];
      var drop = {};
      ids.forEach(function (i) { drop[i] = true; });
      writeRaw(mine.filter(function (r) { return !drop[r.id]; }));
      var uid = Auth.id();
      if (uid && Auth.isOnline()) {
        Auth.db().from('rounds').delete().in('id', ids).eq('user_id', uid);
      }
    }

    return { available:available, all:all, add:add, findSaved:findSaved,
             setDate:setDate, remove:remove, removeAll:removeAll,
             exportData:exportData, importData:importData,
             sync:sync, claimLocal:claimLocal, undoClaim:undoClaim };
  })();

  /* ---------- Hilfsfunktionen ---------- */

  // Heutiges Datum des Geraets im Format JJMMTT
  function todayCode() {
    var d = new Date();
    var p = function (v) { return (v < 10 ? '0' : '') + v; };
    return p(d.getFullYear() % 100) + p(d.getMonth() + 1) + p(d.getDate());
  }

  // JJMMTT -> Wert fuer ein <input type="date"> (JJJJ-MM-TT) und zurueck
  function codeToInput(c) {
    if (!/^\d{6}$/.test(c)) return '';
    return '20' + c.slice(0,2) + '-' + c.slice(2,4) + '-' + c.slice(4,6);
  }
  function inputToCode(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    return m ? m[1].slice(2) + m[2] + m[3] : '';
  }

  function parseCode(raw) {
    var parts = raw.split('-');
    var d    = parts.length > 1 ? parts[0] : '';
    var data = parts.length > 1 ? parts[1] : parts[0];
    var holes = [], diff = 0, strokes = 0, par = 0;
    for (var i = 0; i + 1 < data.length; i += 2) {
      var p = parseInt(data.charAt(i), 10);
      var s = parseInt(data.charAt(i + 1), 16);   // Hex: a = 10
      if (isNaN(p) || isNaN(s)) continue;
      holes.push({ par:p, sc:s, diff:s - p });
      diff += s - p; strokes += s; par += p;
    }
    // Gespeichert wird nur der Spieldaten-Teil, das Datum getrennt davon.
    // Sonst gaelte dieselbe Runde einmal mit und einmal ohne Datumsvorsatz
    // im QR-Code als zwei verschiedene Runden.
    // Enthaelt der Code kein Datum, nehmen wir das heutige Datum des Geraets.
    // Gescannt wird ueblicherweise direkt nach der Runde, und korrigieren
    // laesst es sich vor dem Speichern.
    var hasDate = /^\d{6}$/.test(d);
    return { date:hasDate ? d : todayCode(), dateFromDevice:!hasDate,
             data:data, code:raw, holes:holes, diff:diff, strokes:strokes, par:par };
  }
  function fmtDate(d) {
    if (!/^\d{6}$/.test(d)) return '';
    return d.slice(4,6) + '.' + d.slice(2,4) + '.20' + d.slice(0,2);
  }
  function sign(n){ return (n > 0 ? '+' : '') + n; }
  function cls(n){ return n < 0 ? 'good' : (n > 0 ? 'bad' : 'even'); }
  function colorOf(n){ return n < 0 ? 'var(--good)' : (n > 0 ? 'var(--bad)' : 'var(--txt)'); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // Golfplatz-Website wird frei eingetippt (z.B. "www.platz.de" ohne
  // Protokoll) - als Link braucht sie eins, sonst haengt der Browser sie
  // an die aktuelle Seite an statt extern zu oeffnen.
  function normalizeUrl(u){
    u = String(u || '').trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : '#';
  }
  // Bild-Adressen kommen aus der Datenbank und landen teils in CSS
  // (url('...')). esc() hilft dort NICHT (HTML-Entities werden vor dem CSS
  // wieder aufgeloest), darum nur schlichte https-Adressen ohne Anfuehrungs-
  // zeichen/Klammern/Semikolon durchlassen.
  function safeImgUrl(u){
    u = String(u || '');
    return /^https:\/\/[^\s'"()\\;<>]+$/.test(u) ? u : '';
  }

  /* ---------- Menue ---------- */
  function menuDef() {
    var loggedIn = !!Auth.id();
    // Startseite, Statistik und Kalender/Planen stecken in der unteren
    // Leiste; der Freunde-Reiter dort zeigt nur noch den reinen Feed
    // (renderFeed()) - die eigentliche Freundesliste/Anfragen/Verwalten
    // steckt seit dieser Runde hier im Menue (renderFriendList()), damit
    // die untere Leiste eine reine Aktivitaets-Ansicht bleibt - "Freund
    // hinzufuegen" (menu/addfriend) hat dort seinen eigenen Knopf und
    // braucht deshalb keinen zusaetzlichen, eigenen Menuepunkt hier mehr.
    // Golfplatz-Konten sehen "Freunde"/"Sicherung" nicht - alles reine
    // Spieler-Funktionen, ergeben fuer einen Platz keinen Sinn.
    var isClub = Friends.isClub();
    var items = [
      { id:'menu/login',  icon:loggedIn ? I.cloud : I.user,
        label:loggedIn ? 'Konto' : 'Anmelden',
        sub:loggedIn ? Auth.email() : 'Runden ger\u00e4te\u00fcbergreifend sichern',
        ready:true },
      isClub ? null : { id:'menu/friendlist', icon:I.users, label:'Freunde',
        sub:'Anfragen, Liste, Freund hinzuf\u00fcgen/entfernen', ready:true },
      isClub ? null : { id:'menu/clubs', icon:I.home, label:'Golfpl\u00e4tze',
        sub:'Suchen und folgen', ready:true },
      { sep:true },
      Friends.isAdmin() ? { id:'menu/admin', icon:I.info, label:'Admin',
        sub:'Golfplatz-Anfragen freischalten', ready:true } : null,
      isClub ? null : { id:'menu/backup',  icon:I.box,   label:'Sicherung',    sub:'Runden exportieren und einlesen', ready:true },
      { id:'menu/impressum', icon:I.info, label:'Impressum', sub:'Anbieterkennzeichnung', ready:true },
      { id:'menu/privacy', icon:I.info,  label:'Datenschutz',  sub:'Welche Daten wo landen', ready:true },
      { id:'menu/about',   icon:I.info,  label:'\u00dcber',    sub:'Version und Hinweise', ready:true }
    ];
    return items.filter(function (m) { return m; });
  }

  var sheet = document.getElementById('sheet');
  var sheetbg = document.getElementById('sheetbg');
  function buildMenu() {
    document.getElementById('menuItems').innerHTML = menuDef().map(function (m) {
      if (m.sep) return '<div class="sep"></div>';
      return '<button class="menuitem" data-go="' + m.id + '">' + m.icon +
             '<span class="lbl">' + m.label + '<span class="sub">' + esc(m.sub) + '</span></span>' +
             (m.ready ? '' : '<span class="badge">bald</span>') + '</button>';
    }).join('');

  // statt Bool, falls mal zwei Sheets verschachtelt offen sind (z.B.
  // openScanChoice() schliesst das Menue und oeffnet sich selbst).
  var scrollLockCount = 0, scrollLockY = 0;
  function lockBodyScroll() {
    if (scrollLockCount === 0) {
      scrollLockY = window.scrollY || window.pageYOffset || 0;
      document.body.style.position = 'fixed';
      document.body.style.top = '-' + scrollLockY + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
    }
    scrollLockCount++;
  }
  function unlockBodyScroll() {
    scrollLockCount = Math.max(0, scrollLockCount - 1);
    if (scrollLockCount === 0) {
      document.body.style.position = '';
      document.body.style.top = '';

      document.body.style.right = '';

  /* ==========================================================
     Scanner
     Nutzt die eingebaute Texterkennung des Browsers (BarcodeDetector),
     die es in Chrome/Android gibt. Faehrt Safari/iOS die nicht mit,
     wird jsQR nachgeladen, eine kleine Bibliothek, die dasselbe im
     Browser selbst berechnet. Erkennt einen QR-Code des Pocket Caddy
     direkt an seinem Aufbau (Ziffernpaare hinter #) und springt ohne
     Umweg ueber eine fremde Kamera-App direkt zur Scorecard.
     ========================================================== */
  var Scanner = (function () {
    var view = document.getElementById('scanview');
    var video = document.getElementById('scanVideo');
    var msg = document.getElementById('scanMsg');
    var stream = null, raf = null, jsQRready = null, stopping = false;

    function loadJsQR() {
      if (window.jsQR) return Promise.resolve();
      if (jsQRready) return jsQRready;
      jsQRready = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        s.integrity = 'sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx';
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      return jsQRready;
    }

    function setMsg(html) { msg.innerHTML = html; }

    function handleText(text) {
      // Ein QR des Pocket Caddy hat die Form ".../pocketcaddy/#<Ziffern>".
      // Statt die Adresse selbst zu pruefen (koennte sich mal aendern),
      // wird direkt geprueft, ob der Teil hinter dem letzten # wie eine
      // gueltige Runde aussieht.
      var hashPart = text.indexOf('#') >= 0 ? text.split('#').pop() : text;
      var parsed = parseCode(hashPart);

      if (!parsed.holes.length) {
        setMsg('<b class="err">Kein Pocket-Caddy-Code</b>' +
               'Das sieht nicht nach einer Runde aus. Weiter versuchen oder ' +
               '<button class="linkbtn" id="scanRaw" style="color:#fff">Text anzeigen</button>.');
        var rawBtn = document.getElementById('scanRaw');
        if (rawBtn) rawBtn.addEventListener('click', function () {
          setMsg('<b>Gescannter Inhalt</b>' + esc(text));
        });
        return false;   // weiterscannen
      }

      stop();
      if (navigator.vibrate) navigator.vibrate(60);
      location.hash = hashPart;
      route();
      return true;
    }

    function tick() {
      if (stopping || video.readyState < 2) { raf = requestAnimationFrame(tick); return; }

      var w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) { raf = requestAnimationFrame(tick); return; }
      var cv = tick._cv || (tick._cv = document.createElement('canvas'));
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, w, h);
      var img = ctx.getImageData(0, 0, w, h);
      var res = window.jsQR ? window.jsQR(img.data, w, h) : null;
      if (res && res.data) { if (handleText(res.data)) return; }
      raf = requestAnimationFrame(tick);
    }

    function nativeLoop(detector) {
      if (stopping) return;
      detector.detect(video).then(function (codes) {
        if (stopping) return;
        if (codes && codes.length && handleText(codes[0].rawValue)) return;
        raf = requestAnimationFrame(function () { nativeLoop(detector); });
      }).catch(function () {
        raf = requestAnimationFrame(function () { nativeLoop(detector); });
      });
    }

    function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('Dieser Browser unterstuetzt keinen Kamerazugriff.', true);
        return;
      }
      stopping = false;
      view.classList.add('on');
      setMsg('<b>QR-Code des Pocket Caddy einrahmen</b>Erkennt automatisch, sobald er scharf im Bild ist.');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      }).then(function (s) {
        stream = s;
        video.srcObject = s;
        return video.play();
      }).then(function () {
        if (window.BarcodeDetector) {
          BarcodeDetector.getSupportedFormats().then(function (fmts) {
            if (fmts.indexOf('qr_code') >= 0) {
              nativeLoop(new BarcodeDetector({ formats: ['qr_code'] }));
            } else {
              loadJsQR().then(function () { raf = requestAnimationFrame(tick); });
            }
          }).catch(function () {
            loadJsQR().then(function () { raf = requestAnimationFrame(tick); });
          });
        } else {
          loadJsQR().then(function () { raf = requestAnimationFrame(tick); })
                    .catch(function () { setMsg('<b class="err">Erkennung konnte nicht geladen werden</b>Bitte Internetverbindung pr\u00fcfen.'); });
        }
      }).catch(function (e) {
        var m = (e && e.name) || '';
        var text = m === 'NotAllowedError'
          ? 'Kamerazugriff wurde nicht erlaubt. In den Einstellungen des Browsers f\u00fcr diese Seite freigeben.'
          : m === 'NotFoundError'
          ? 'Keine Kamera gefunden.'
          : 'Kamera konnte nicht gestartet werden.';
        setMsg('<b class="err">Kein Zugriff</b>' + text);
      });
    }

    function stop() {
      stopping = true;
      if (raf) cancelAnimationFrame(raf);
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      video.srcObject = null;
      view.classList.remove('on');
    }

    return { start: start, stop: stop };
  })();

  // Eigenes Bestaetigungs-Popup statt des nativen confirm() - passt sich
  // dem App-Design an (und sieht auf jeder Plattform gleich aus). Gleiches
  // Sheet-Muster wie oben, aber Promise-basiert statt synchron: confirmDialog()
  // loest mit true (Aktions-Knopf) oder false (Abbrechen/Hintergrund) auf.
  var confirmSheet    = document.getElementById('confirmSheet');
  var confirmBg       = document.getElementById('confirmBg');
  var confirmMsgEl    = document.getElementById('confirmMsg');
  var confirmOkBtn    = document.getElementById('confirmOkBtn');
  var confirmCancelBtn = document.getElementById('confirmCancelBtn');
  function openConfirm()  { lockBodyScroll(); confirmSheet.classList.add('on'); confirmBg.classList.add('on'); }
  function closeConfirm() { unlockBodyScroll(); confirmSheet.classList.remove('on'); confirmBg.classList.remove('on'); }
  function confirmDialog(message, okLabel) {
    return new Promise(function (resolve) {
      confirmMsgEl.textContent = message;
      confirmOkBtn.textContent = okLabel || 'Löschen';
      function done(result) {
        closeConfirm();
        confirmOkBtn.removeEventListener('click', onOk);
        confirmCancelBtn.removeEventListener('click', onCancel);
        confirmBg.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk()     { done(true); }
      function onCancel() { done(false); }
      confirmOkBtn.addEventListener('click', onOk);
      confirmCancelBtn.addEventListener('click', onCancel);
      confirmBg.addEventListener('click', onCancel);
      openConfirm();
    });
  }

  // Direkt beim Antippen eines Golfplatz-Kurses (siehe renderSetup() in
  // renderManualEntry()): Live spielen oder Ergebnisse eintragen, als
  // Popup statt zweier Knoepfe im Formular. Gleiches Grundmuster wie

  var courseChoiceSheet = document.getElementById('courseChoiceSheet');
  var courseChoiceBg    = document.getElementById('courseChoiceBg');
  var courseChoiceNameEl = document.getElementById('courseChoiceName');
  var courseChoiceLiveBtn = document.getElementById('courseChoiceLive');
  var courseChoiceManualBtn = document.getElementById('courseChoiceManual');
  function closeCourseChoice() { unlockBodyScroll(); courseChoiceSheet.classList.remove('on'); courseChoiceBg.classList.remove('on'); }
  function openCourseChoice(courseLabel, onLive, onManual) {
    courseChoiceNameEl.textContent = courseLabel || '';
    function pick(fn) {
      return function () { closeCourseChoice(); cleanup(); fn(); };
    }
    var onLivePick = pick(onLive);
    var onManualPick = pick(onManual);
    function cleanup() {
      courseChoiceLiveBtn.removeEventListener('click', onLivePick);
      courseChoiceManualBtn.removeEventListener('click', onManualPick);
      courseChoiceBg.removeEventListener('click', onBgClick);
    }
    function onBgClick() { closeCourseChoice(); cleanup(); }
    courseChoiceLiveBtn.addEventListener('click', onLivePick);
    courseChoiceManualBtn.addEventListener('click', onManualPick);
    courseChoiceBg.addEventListener('click', onBgClick);
    lockBodyScroll();
    courseChoiceSheet.classList.add('on'); courseChoiceBg.classList.add('on');

  // Verein+Platz waehlen (z.B. im Termin-Formular): eigenes Popup statt
  // nativem <select>. Erst gefolgte Vereine, per Suche auch alle
  // verifizierten (gleiche Datenquellen/Zeilen-Optik wie renderClubSearch()).
  // Antippen eines Vereins klappt ihn per expandedClubId in-place auf und
  // zeigt seine Plaetze direkt darunter (gleiches Grundprinzip wie
  // mountCoursesEditor()s Aufklapp-Zustand, hier nur zur Auswahl statt
  // zum Bearbeiten). Klick-Listener per Delegation auf der Liste selbst,
  // damit ein Re-Render (Suche/Aufklappen) keine neuen Listener braucht.
  var clubPickSheet = document.getElementById('clubPickSheet');
  var clubPickBg = document.getElementById('clubPickBg');
  var clubPickSearchEl = document.getElementById('clubPickSearch');
  var clubPickListEl = document.getElementById('clubPickList');
  function closeClubPick() { unlockBodyScroll(); clubPickSheet.classList.remove('on'); clubPickBg.classList.remove('on'); }
  function openClubPick(onPick) {
    var followed = [], allClubs = [], currentClubs = [], expandedClubId = null;
    clubPickSearchEl.value = '';
    clubPickListEl.innerHTML = '<div class="loadwrap"><div class="spinner"></div></div>';

    function rowHtml(c) {
      var expanded = expandedClubId === c.id;
      var courses = c.courses || [];
      var html = '<button type="button" class="item" data-pick-club-row="' + c.id + '">' +
        avaHtml(c.avatarUrl || c.coverImageUrl, c.name) +
        '<span class="meta"><span class="d">' + esc(c.name || 'Golfplatz') + '</span>' +
        '<span class="s">' + (courses.length ? (courses.length + (courses.length === 1 ? ' Platz' : ' Plätze')) : 'Noch keine Plätze') +
        '</span></span><span class="chev">' + I.chev + '</span></button>';
      if (expanded && courses.length) {
        html += '<div class="list" style="margin:8px 0 0 54px">' + courses.map(function (course) {
          return '<button type="button" class="item" data-pick-course="' + course.id + '" data-pick-club="' + c.id + '">' +
            '<span class="meta"><span class="d">' + esc(course.name || 'Platz') + '</span>' +
            '<span class="s">' + course.holes + ' Löcher</span></span></button>';
        }).join('') + '</div>';
      }
      return html;
    }
    function renderList(query) {
      var q = (query || '').trim().toLowerCase();
      var source = q
        ? allClubs.filter(function (c) { return (c.name || '').toLowerCase().indexOf(q) >= 0; })
        : (followed.length ? followed : allClubs);
      currentClubs = source;
      clubPickListEl.innerHTML = source.length
        ? '<div class="list">' + source.map(rowHtml).join('') + '</div>'
        : '<div class="empty"><b>Nichts gefunden</b>Versuch einen anderen Suchbegriff.</div>';
    }
    function findClub(id) {
      return currentClubs.filter(function (c) { return c.id === id; })[0] ||
        allClubs.filter(function (c) { return c.id === id; })[0];
    }
    function onListClick(e) {
      var courseEl = e.target.closest('[data-pick-course]');
      if (courseEl) {
        var club = findClub(courseEl.getAttribute('data-pick-club'));
        var course = club && (club.courses || []).filter(function (x) { return x.id === courseEl.getAttribute('data-pick-course'); })[0];
        if (club && course) { closeClubPick(); cleanup(); onPick(club, course); }
        return;
      }
      var clubEl = e.target.closest('[data-pick-club-row]');
      if (clubEl) {
        var id = clubEl.getAttribute('data-pick-club-row');
        expandedClubId = (expandedClubId === id) ? null : id;
        renderList(clubPickSearchEl.value);
      }
    }
    function onSearchInput() { expandedClubId = null; renderList(clubPickSearchEl.value); }
    function onBgClick() { closeClubPick(); cleanup(); }
    function cleanup() {
      clubPickListEl.removeEventListener('click', onListClick);
      clubPickSearchEl.removeEventListener('input', onSearchInput);
      clubPickBg.removeEventListener('click', onBgClick);
    }
    clubPickListEl.addEventListener('click', onListClick);
    clubPickSearchEl.addEventListener('input', onSearchInput);
    clubPickBg.addEventListener('click', onBgClick);
    lockBodyScroll();
    clubPickSheet.classList.add('on'); clubPickBg.classList.add('on');

    Promise.all([Club.followedClubs(), Club.verifiedClubsList()]).then(function (res) {
      followed = res[0] || []; allClubs = res[1] || [];
      renderList(clubPickSearchEl.value);
    });
  }

  // Profilbild antippen zum Vergroessern - EIN delegierter Listener statt
