    function wireSignIn() {
      document.getElementById('btnToUp').addEventListener('click', function () {
        readEmail(); authMode = 'up'; drawAuth();
      });
      document.getElementById('btnIn').addEventListener('click', function () {
        var e = readEmail();
        var p = document.getElementById('fPass').value;
        if (!e || !p) { toast('Bitte E-Mail und Passwort eingeben.', true); return; }
        toast('Melde an …');
        Auth.signIn(e, p).then(function (r) {
          if (r.error) {
            if (isUnconfirmed(r.error)) {
              authMode = 'confirm'; drawAuth();
              toast('Bitte bestätige zuerst deine E-Mail.', true);
              return;
            }
            toast(loginError(r.error), true); return;
          }
          afterLogin();
        });
      });
      document.getElementById('btnForgot').addEventListener('click', function () {
        var e = readEmail();
        if (!e) { toast('Bitte zuerst deine E-Mail eintragen.', true); return; }
        toast('Schicke Mail …');
        Auth.resetPassword(e).then(function (r) {
          if (r.error) { toast(loginError(r.error), true); return; }
          // Bewusst neutral formuliert: die Antwort verraet nicht, ob es zu
          // dieser Adresse ueberhaupt ein Konto gibt.
          toast('Falls es ein Konto gibt, ist die Mail unterwegs. Auch im Spam schauen.');
        });
      });
    }

    function wireSignUp() {
      var passEl = document.getElementById('fPass');
      var pass2El = document.getElementById('fPass2');
      function paintRules() {
        var c = pwCheck(passEl.value);
        c.same = passEl.value.length > 0 && passEl.value === pass2El.value;
        Array.prototype.forEach.call(document.querySelectorAll('#pwRules li'), function (li) {
          li.classList.toggle('ok', !!c[li.getAttribute('data-r')]);
        });
      }
      passEl.addEventListener('input', paintRules);
      pass2El.addEventListener('input', paintRules);
      paintRules();

      document.getElementById('btnToIn').addEventListener('click', function () {
        readEmail(); authMode = 'in'; drawAuth();
      });
      document.getElementById('btnUp').addEventListener('click', function () {
        var e = readEmail();
        var p = passEl.value;
        if (!e || !p) { toast('Bitte E-Mail und Passwort eingeben.', true); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { toast('Bitte eine gültige E-Mail eingeben.', true); return; }
        var c = pwCheck(p);
        if (!c.len || !c.low || !c.up || !c.dig) {
          toast('Das Passwort erfüllt die Regeln noch nicht.', true); return;
        }
        if (p !== pass2El.value) { toast('Die beiden Passwörter stimmen nicht überein.', true); return; }
        if (!document.getElementById('fConsent').checked) {
          toast('Bitte bestätige die Datenschutzerklärung.', true); return;
        }
        toast('Lege Konto an …');
        Auth.signUp(e, p).then(function (r) {
          if (r.error) { toast(loginError(r.error), true); return; }
          if (r.data && r.data.session) { afterLogin(); return; }
          // Neutral: Supabase antwortet bei schon vorhandener Adresse
          // genauso wie bei einer neuen - das verraet nichts ueber Konten.
          lastResendAt = Date.now();
          authMode = 'confirm'; drawAuth();
        });
      });
    }

    function drawConfirm() {
      content.innerHTML =
        '<div class="panel"><h3>Bestätige deine E-Mail</h3>' +
        '<p>Wir haben einen Link an <b>' + esc(typedEmail) + '</b> geschickt. ' +
        'Tippe darauf, dann ist dein Konto aktiv und du kannst dich anmelden. ' +
        'Schau auch im Spam-Ordner nach.</p>' +
        '<div class="actions">' +
        '<button class="btn" id="btnToIn2">Zur Anmeldung</button>' +
        '<button class="btn ghost" id="btnResend">Mail erneut senden</button></div>' +
        '<p class="warn">Der Link ist eine Stunde gültig.</p></div>';
      document.getElementById('btnToIn2').addEventListener('click', function () {
        authMode = 'in'; drawAuth();
      });
      document.getElementById('btnResend').addEventListener('click', function () {
        var wait = 60 - Math.floor((Date.now() - lastResendAt) / 1000);
        if (wait > 0) { toast('Bitte in ' + wait + ' Sekunden nochmal versuchen.', true); return; }
        if (!typedEmail) { toast('Bitte zuerst deine E-Mail eintragen.', true); return; }
        lastResendAt = Date.now();
        Auth.resendConfirmation(typedEmail).then(function (r) {
          if (r.error) { toast(loginError(r.error), true); return; }
          toast('Mail ist unterwegs.');
        });
      });
    }

    function afterLogin() {
      var res = Store.claimLocal();
      Store.sync().then(function () {
        location.hash = ''; route();
        if (res.moved) {
          toastAction(res.moved + (res.moved === 1 ? ' lokale Runde' : ' lokale Runden') +
                      ' übernommen.', 'Rückgängig', function () {
            Store.undoClaim(res.ids);
            toast('Wieder entfernt.');
            route();
          });
        } else {
          toast('Angemeldet.');
        }
      });
    }

    keptAuthMode = 'in'; keptAuthEmail = '';
    if (authMode === 'confirm') authMode = 'in';
    drawAuth();
  }

  var keptAuthMode = 'in', keptAuthEmail = '';

  // Muss zu den Passwort-Regeln in Supabase passen (Mindestlaenge +
  // Gross-/Kleinbuchstabe + Ziffer, siehe supabase/config.toml). Der Server
  // prueft ohnehin selbst - das hier ist nur die freundliche Vorab-Anzeige.
  var PW_MIN = 10;
  function pwCheck(p) {
    return {
      len: p.length >= PW_MIN,
      low: /[a-zß-ÿ]/.test(p),
      up:  /[A-ZÀ-Þ]/.test(p),
      dig: /[0-9]/.test(p)
    };
  }

  function isUnconfirmed(err) {
    var m = (err && err.message ? err.message : '').toLowerCase();
    return (err && err.code === 'email_not_confirmed') || m.indexOf('not confirmed') >= 0;
  }

  function loginError(err) {
    var code = err && err.code ? String(err.code) : '';
    var m = (err && err.message ? err.message : '').toLowerCase();
    if (code === 'weak_password' || m.indexOf('password should') >= 0 || m.indexOf('weak password') >= 0)
      return 'Das Passwort erfüllt die Regeln nicht (mind. ' + PW_MIN + ' Zeichen, Groß-/Kleinbuchstaben und Ziffer).';
    if (code === 'same_password' || m.indexOf('different from the old') >= 0)
      return 'Das neue Passwort muss sich vom alten unterscheiden.';
    if (code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit' ||
        m.indexOf('rate limit') >= 0 || m.indexOf('too many') >= 0 || (err && err.status === 429))
      return 'Zu viele Versuche, bitte ein paar Minuten warten.';
    if (code === 'captcha_failed' || m.indexOf('captcha') >= 0)
      return 'Die Sicherheitsprüfung ist fehlgeschlagen, bitte nochmal versuchen.';
    if (m.indexOf('invalid login') >= 0)    return 'E-Mail oder Passwort stimmt nicht.';
    if (m.indexOf('already registered') >= 0) return 'Zu dieser E-Mail gibt es schon ein Konto.';
    if (isUnconfirmed(err))                 return 'Konto noch nicht bestätigt. Bitte den Link in der E-Mail antippen.';
    if (m.indexOf('signups not allowed') >= 0) return 'Registrierung ist derzeit geschlossen.';
    if (m.indexOf('provider is not enabled') >= 0 || m.indexOf('unsupported provider') >= 0)
      return 'Google ist in Supabase noch nicht als Anbieter aktiviert.';
    if (m.indexOf('failed to fetch') >= 0 || m.indexOf('network') >= 0)
      return 'Keine Verbindung. Bitte Internet prüfen.';
    return 'Es hat nicht geklappt. Bitte nochmal versuchen.';
  }

  /* ---------- Weiche ---------- */
  // Ordnet einer Adresse (hinter dem #) den passenden Reiter der unteren
  // Leiste zu, oder null, wenn keiner passt (Kontobereich, Sicherung,
  // Ueber, alles was jetzt im schlanken Menue oben rechts steckt).
  function activeTabFor(raw) {
    if (!raw) return 'home';
    if (raw === 'menu/stats')  return 'stats';
    if (raw === 'menu/friends')return 'friends';
    if (raw === 'menu/friendlist') return 'friends';
    if (raw === 'menu/addfriend') return 'friends';
    if (raw === 'menu/plan')   return 'cal';
    if (/^friend\//.test(raw)) return 'friends';
    if (raw === 'rounds')      return 'home';
    if (/^manual\//.test(raw)) return 'scan';
    if (raw === 'manual')      return 'scan';
    if (raw === 'menu/offers') return 'offers';
    if (/^club\//.test(raw))  return 'home';
    if (parseCode(raw).holes.length) return 'home';   // eigene Runde direkt per Link
    return null;
  }

  // Profil-Kachel unten links in der Desktop-Seitenleiste (am Handy per
  // .desktop-only ohnehin unsichtbar, das Patchen hier kostet trotzdem
  // nichts). Friends.loadProfile() cached intern, also kein zusaetzlicher
  // Netzwerk-Aufruf bei wiederholtem Rufen.
  function updateSidebarProfile() {
    var el = document.getElementById('btnSidebarProfile');
    if (!Auth.id()) {
      document.body.classList.remove('club-account');
      if (el) {
        el.querySelector('.ava').outerHTML = avaHtml(null, '?');
        el.querySelector('.sidebarname').textContent = 'Anmelden';
      }
      return;
    }
    Friends.loadProfile().then(function (p) {
      if (!p) return;
      // Golfplatz-Konten sehen eine eigene, reduzierte Nav-Leiste statt
      // der Spieler-Leiste (siehe .club-only/.player-only CSS).
      document.body.classList.toggle('club-account', p.account_type === 'club');
      if (el) {
        el.querySelector('.ava').outerHTML =
          avaHtml(p.avatar_url, p.display_name || Auth.email(), '', '', badgeTypeFor(p.is_admin, p.verified_role));
        el.querySelector('.sidebarname').textContent = p.display_name || 'Konto';
      }
    });
  }

  // route() wird ueber location.hash='X'; route(); direkt aufgerufen UND
  // (weil das Setzen von location.hash zusaetzlich ein natives
  // hashchange-Ereignis ausloest) kurz danach ein zweites Mal als
  // hashchange-Listener - fuer die meisten Seiten nur doppelte Arbeit,
  // bei Seiten mit eigenem asynchronem Nachladen (z.B. renderManualEntry()
  // mit vorausgewaehltem Platz) aber ein sichtbares Zuruecksetzen auf den
  // leeren Ausgangszustand, bevor der zweite Durchlauf erneut laedt. Ein
  // Listener bekommt automatisch das Event-Objekt als Parameter, ein
  // direkter Aufruf im Code dagegen nie - damit laesst sich genau das
  // native Echo eines gerade erst verarbeiteten Hashs erkennen und
  // ueberspringen, ohne echte Navigationen (anderer Hash) oder bewusste
  // direkte route()-Aufrufe (kein Event-Argument) zu beeintraechtigen.
  // Ohne Konto sind obere/untere Leiste weg (siehe body.loginscreen) - damit
  // man von Datenschutz/Impressum/Ueber trotzdem zurueckkommt, oben ein Knopf.
  function addLoggedOutBack() {
    if (Auth.id()) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'linkbtn';
    b.style.cssText = 'display:block;margin:0 0 14px;padding:6px 0';
    b.textContent = '\u2190 Zur\u00fcck zur Anmeldung';
    b.addEventListener('click', function () { location.hash = 'menu/login'; route(); });
    content.insertBefore(b, content.firstChild);
  }

  var lastRoutedRaw;
  function route(e) {
    var raw = (location.hash || '').replace(/^#/, '');
    if (e && raw === lastRoutedRaw) return;
    lastRoutedRaw = raw;
    closeMenu(); closeScanChoice(); closeHoleInfo(); window.scrollTo(0,0);
    document.body.classList.remove('wizard-fullscreen');
    LiveRoundNative.end();
    updateSidebarProfile();

    // Golfplatz-Konten sehen keine Spieler-Seiten (Statistik, Runde
    // Ohne Konto kommt man nicht in die App - einzige Ausnahmen sind die
    // Anmeldeseite selbst (deckt auch Registrierung und "neues Passwort
    // setzen" intern ab, siehe renderLogin()/Auth.isRecovery()) sowie
    // Datenschutz und "Ueber", die auch vor einer Registrierung lesbar
    // bleiben sollen. Greift bewusst ganz oben, vor jeder anderen Weiche.
    var LOGIN_EXEMPT_HASHES = ['menu/login', 'menu/privacy', 'menu/about', 'menu/impressum'];
    if (!Auth.id() && LOGIN_EXEMPT_HASHES.indexOf(raw) < 0) {
      location.hash = 'menu/login'; route(); return;
    }
    // Nur auf der eigentlichen Anmeldeseite (nicht auch auf Datenschutz/
    // Ueber) obere und untere Leiste ausblenden - siehe body.loginscreen-CSS.
    document.body.classList.toggle('loginscreen', !Auth.id() && LOGIN_EXEMPT_HASHES.indexOf(raw) >= 0);

    // eintragen, Freunde, Planen, eigene Runden) - reiner UX-Schutz vor
    // alten/falschen Links, keine Sicherheitsmassnahme (siehe Golfplatz-
    // Navigation-Lektion). Greift erst, sobald das Profil einmal geladen
    // wurde (Friends.isClub() ist bis dahin false, gleiche Einschraenkung
    // wie bei Friends.isAdmin()).
    var CLUB_BLOCKED_HASHES = ['manual', 'menu/stats', 'menu/friends', 'menu/friendlist', 'menu/addfriend', 'menu/plan', 'menu/clubs', 'menu/backup', 'rounds'];
    if (Friends.isClub() && (CLUB_BLOCKED_HASHES.indexOf(raw) >= 0 || parseCode(raw).holes.length)) {
      location.hash = ''; route(); return;
    }

    // Zurueck-Pfeil nur auf tieferen Seiten, nicht auf den drei direkt in
    // der unteren Leiste erreichbaren Hauptbereichen.
    var topLevel = (raw === '' || raw === 'menu/stats' || raw === 'menu/friends');
    document.getElementById('btnTopBack').classList.toggle('on', !topLevel);
    document.getElementById('brandFlag').classList.toggle('on', !raw);

    var tab = activeTabFor(raw);
    Array.prototype.forEach.call(document.querySelectorAll('.navitem[data-tab]'), function (el) {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });

    if (!raw)                 { renderHome(); return; }
    if (raw === 'menu/login') { renderLogin(); return; }
    if (raw === 'menu/friends'){ renderFeed(); return; }
    if (raw === 'menu/friendlist'){ renderFriendList(); return; }
    if (raw === 'menu/addfriend'){ renderAddFriend(); return; }
    if (raw === 'menu/stats')  { renderStats(); return; }
    if (raw === 'rounds')      { renderAllRounds(); return; }
    // Runde direkt aus einem Golfplatz-Profil starten (Platz angeklickt):
    // manual/<clubId>/<courseId>, vor der einfachen 'manual'-Zeile geprueft,
    // damit die spezifischere Route zuerst greift.
    var mc = /^manual\/([0-9a-f-]{36})\/([0-9a-f-]{36})(\/live)?$/.exec(raw);
    if (mc) { renderManualEntry({ clubId: mc[1], courseId: mc[2], autoLive: !!mc[3] }); return; }
    if (raw === 'manual')      { renderManualEntry(); return; }
    if (raw === 'menu/plan')   { renderPlan(); return; }

    // Freund: friend/<id>  oder  friend/<id>/<runde>
    var fm = /^friend\/([0-9a-f-]{36})(?:\/(.+))?$/.exec(raw);
    if (fm) {
      if (!fm[2]) { renderFriendRounds(fm[1]); return; }
      var fr = parseCode(fm[2]);
      if (!fr.holes.length) { location.hash = 'friend/' + fm[1]; route(); return; }
      Promise.all([Friends.list(), Friends.roundsOf(fm[1])]).then(function (res) {
        var d = res[0], rows = res[1];
        var f = null;
        d.friends.forEach(function (x) { if (x.userId === fm[1]) f = x; });
        if (!f) { location.hash = 'menu/friends'; route(); return; }

        // Die passende Datenbank-Zeile suchen, fuer id/confirmed (aus der
        // URL allein liesse sich das nicht rekonstruieren).
        var row = null;
        rows.forEach(function (x) {
          if (x.code === fr.data && (x.date || '') === (fr.date || '')) row = x;
        });

        var afterEligibility = function (eligible) {
          renderRound(fr, {
            owner: nameOf(f), back: 'friend/' + fm[1],
            roundId: row ? row.id : null,
            confirmed: row ? !!row.confirmed : false,
            eligible: eligible,
            location: row ? row.location : null,
            playmates: row ? row.playmates : null
          });
        };
        if (row && !row.confirmed) {
          Friends.hasRoundOnDate(fr.date).then(afterEligibility);
        } else {
          afterEligibility(false);
        }
      });
      return;
    }
    // Golfplatz-Profil zum Durchstoebern: club/<id>
    var cm = /^club\/([0-9a-f-]{36})$/.exec(raw);
    if (cm) { renderClubProfile(cm[1]); return; }
    var acm = /^menu\/admin\/club\/([0-9a-f-]{36})$/.exec(raw);
    if (acm) { renderAdminClubEdit(acm[1]); return; }
    if (raw === 'menu/backup') { renderBackup();     return; }
    if (raw === 'menu/impressum'){ renderImpressum(); addLoggedOutBack(); return; }
    if (raw === 'menu/privacy'){ renderPrivacy();    addLoggedOutBack(); return; }
    if (raw === 'menu/about')  { renderAbout();      addLoggedOutBack(); return; }
    if (raw === 'menu/offers') { renderClubOffers(); return; }
    if (raw === 'menu/clubs')  { renderClubSearch(); return; }
    if (raw === 'menu/admin')  { renderAdmin();      return; }
    if (Object.prototype.hasOwnProperty.call(PAGES, raw)) { renderPlaceholder(raw); return; }

    var r = parseCode(raw);
    if (!r.holes.length) {
      brand.textContent = 'Pocket Caddy';
      content.innerHTML =
        '<div class="empty"><b>Daten nicht lesbar</b>' +
        'Der Link scheint unvollst\u00e4ndig zu sein. Bitte den QR-Code neu scannen.</div>';
      return;
    }
    renderRound(r);
  }

  // Kommt man von einer fehlgeschlagenen Google-/Supabase-Anmeldung
  // zurueck, haengt Supabase "error=...&error_description=..." sowohl an
  // die Query ALS AUCH (identisch) an den #-Teil der Adresse. Ohne diese
  // Pruefung faellt das unbemerkt durch bis zu parseCode() weiter oben und
  // zeigt bestenfalls die irrefuehrende "Daten nicht lesbar"-Meldung, im
  // schlimmsten Fall gar nichts. Muss VOR dem ersten route()-Aufruf laufen
  // (siehe Auth.init() gleich danach), deshalb hier ganz oben im Boot-Ablauf.
  function clearAuthErrorFromUrl() {
    var fromQuery = new URLSearchParams(location.search);
    var fromHash  = new URLSearchParams(location.hash.replace(/^#/, ''));
    var err = fromQuery.get('error') || fromHash.get('error');
    if (!err) return;
    var ecode = fromQuery.get('error_code') || fromHash.get('error_code') || '';
    var desc = (ecode === 'otp_expired')
      ? 'Der Link ist abgelaufen oder wurde schon benutzt. Bitte fordere einen neuen an.'
      : (fromQuery.get('error_description') || fromHash.get('error_description') || err);
    toast('Anmeldung fehlgeschlagen: ' + desc, true);
    history.replaceState(null, '', location.pathname);
    location.hash = '';
  }
  clearAuthErrorFromUrl();

  // Erst den Kontostand ermitteln, dann zeichnen. Sonst wuerde kurz die
  // Ablage ohne Anmeldung angezeigt und danach umspringen.
  Auth.onChange(function () { buildMenu(); route(); });

  // Boot-Screen erst wieder wegnehmen, wenn BEIDES fertig ist: die feste
  // Animationsdauer (unten, Timeout) UND der Auth-Kontostand (hier) - je
  // nachdem was laenger dauert. Verhindert sowohl ein abruptes Abschneiden
  // der Animation als auch (bei langsamem Netz) eine sichtbare Luecke
  // danach.
  var bootScreen = document.getElementById('bootScreen');
  var bootAnimDone = false, bootAuthDone = false;
  function maybeHideBoot() {
    if (!bootAnimDone || !bootAuthDone || !bootScreen) return;
    bootScreen.classList.add('out');
    setTimeout(function () { if (bootScreen) { bootScreen.remove(); bootScreen = null; } }, 400);
  }
  setTimeout(function () { bootAnimDone = true; maybeHideBoot(); }, 2050);

  Auth.init(function () {
    buildMenu();
    route();
    if (Auth.id()) {
      Store.sync().then(function (r) { if (r && r.ok) route(); });
    }
    bootAuthDone = true;
    maybeHideBoot();
  });

  window.addEventListener('hashchange', route);

})();
</script>
<script>
  // Meldet den Service Worker an, damit die App auch bei schlechter oder
  // fehlender Verbindung sofort aufgeht. Schlaegt das fehl (z.B. sehr alter
  // Browser), laeuft die Seite trotzdem ganz normal weiter.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>
</body>
