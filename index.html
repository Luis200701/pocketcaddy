  /* ---------- Startseite ---------- */
  function renderHome() {
    // Golfplatz-Konten sehen hier ihre Platzverwaltung statt der Spieler-
    // Startseite. Synchron VOR dem Player-UI geprueft (statt nur im
    // asynchronen Friends.loadProfile()-Callback weiter unten), damit die
    // Spieler-Ansicht bei einer schon bekannten Golfplatz-Sitzung nicht
    // kurz aufblitzt. Beim allerersten Laden (Profil noch nicht gecacht)
    // greift weiterhin der bestehende asynchrone Check unten.
    if (Friends.isClub()) { renderClub(); return; }

    brand.textContent = 'Pocket Caddy';
    var arr = Store.all().map(function (x) {
      var p = parseCode(x.code);
      p.id = x.id; p.createdAt = x.createdAt;
      p.date = x.date || p.date;   // gespeichertes Datum hat Vorrang
      return p;
    }).filter(function (p) { return p.holes.length; });

    arr.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.createdAt - a.createdAt;
    });

    var profileHtml = '';
    if (Auth.id()) {
      // Platzhalter, wird gleich durch das echte Profil ersetzt sobald
      // geladen, damit die Seite nicht auf das Netzwerk warten muss.
      profileHtml =
        '<div class="profilehead" id="profileHead">' +
        '<span class="ava">' + esc((Auth.email() || '?').charAt(0).toUpperCase()) + '</span>' +
        '<div class="pname pulse-load">\u2026</div>' +
        '</div>';
    }

    var statsHtml = '';
    var listHtml = '';
    if (!arr.length) {
      listHtml =
        '<div class="empty"><b>Noch keine Runden</b>' +
        'Scanne den QR-Code auf deinem Pocket Caddy und tippe dort auf ' +
        '&bdquo;Runde speichern&ldquo;. Sie erscheint dann hier.' +
        (Store.available() ? '' :
          '<br><br>Achtung: Dieser Browser erlaubt kein Speichern (privater Modus?).') +
        '</div>';
    } else {
      var best = arr.reduce(function (m, r) { return r.diff < m.diff ? r : m; }, arr[0]);
      var avg  = arr.reduce(function (s, r) { return s + r.diff; }, 0) / arr.length;

      statsHtml =
        '<div class="stats">' +
          '<div class="stat"><div class="v">' + arr.length + '</div><div class="k">Runden</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(best.diff) + '">' +
            sign(best.diff) + '</div><div class="k">Beste</div></div>' +
          '<div class="stat"><div class="v" style="color:' + colorOf(avg) + '">' +
            (avg > 0 ? '+' : '') + avg.toFixed(1) + '</div><div class="k">Schnitt</div></div>' +
        '</div>';

      var items = arr.slice(0, 3).map(function (r) {
        var link = (r.date ? r.date + '-' : '') + r.data;
        return '<button class="item" data-code="' + esc(link) + '">' +
          '<span class="big" style="color:' + colorOf(r.diff) + '">' + sign(r.diff) + '</span>' +
          '<span class="meta"><span class="d">' + (fmtDate(r.date) || 'ohne Datum') + '</span>' +
          '<span class="s">' + r.holes.length + ' L\u00f6cher &middot; ' + r.strokes +
          ' Schl\u00e4ge &middot; Par ' + r.par + '</span></span>' +
          '<span class="chev">' + I.chev + '</span></button>';
      }).join('');

      listHtml =
        '<div class="sectionhead"><span class="t">Verlauf</span>' +
        (arr.length > 3 ? '<button class="linklike" id="btnAllRounds">Alle ansehen</button>' :
          '<span class="c">' + arr.length + (arr.length === 1 ? ' Runde' : ' Runden') + '</span>') +
        '</div><div class="list">' + items + '</div>';
    }

    content.innerHTML = profileHtml + statsHtml + listHtml + '<div id="clubSlot"></div>';

    Array.prototype.forEach.call(content.querySelectorAll('.item'), function (el) {
      el.addEventListener('click', function () {
        location.hash = el.getAttribute('data-code'); route();
      });
    });
    var allBtn = document.getElementById('btnAllRounds');
    if (allBtn) allBtn.addEventListener('click', function () {
      location.hash = 'rounds'; route();
    });

    // Golfplaetze, denen man folgt - als kompaktes 2-Spalten-Raster,
    // hoechstens 3 Zeilen (6 Kacheln). Die volle Liste zum Suchen/Folgen
    // sitzt im Menue unter "Golfplaetze" (renderClubSearch()).
    if (Auth.id() && Auth.isOnline()) {
      Club.followedClubs().then(function (clubs) {
        var slot = document.getElementById('clubSlot');
        if (!slot) return;
        if (!clubs.length) {
          slot.innerHTML =
            '<div class="sectionhead" style="margin-top:22px"><span class="t">Golfplätze</span></div>' +
            '<div class="empty"><b>Noch keinen Golfplätzen gefolgt</b>' +
            'Im Menü unter &bdquo;Golfplätze&ldquo; suchen.</div>';
          return;
        }
        slot.innerHTML =
          '<div class="sectionhead" style="margin-top:22px"><span class="t">Golfplätze</span></div>' +
          '<div class="clubgrid">' + clubs.slice(0, 6).map(function (c) {
            var n = c.courses.length;
            return '<div class="clubcard" data-club="' + c.id + '">' +
              '<button class="mini no cardx" data-unfollow="' + c.id + '" title="Entfolgen">' + I.x + '</button>' +
              avaHtml(c.avatarUrl || c.coverImageUrl, c.name, '', '', 'club') +
              '<span class="name">' + esc(c.name || 'Golfplatz') + '</span>' +
              '<span class="sub">' + (n ? (n + (n === 1 ? ' Platz' : ' Plätze')) : 'Noch keine Plätze') +
