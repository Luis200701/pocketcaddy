<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dieser Einladungslink ist nicht mehr gültig.">
<title>Link ungültig – Pocket Caddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13; --surface:#141922; --line:#252d3a;
    --lime:#a3e635; --ink:#f3f6ef; --mut:#8b93a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Work Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
    min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  a{color:inherit}
  .card{
    max-width:420px; width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:36px 30px; text-align:center;
  }
  .logo{width:44px;height:44px;border-radius:12px;margin-bottom:18px}
  .kicker{
    font-family:"IBM Plex Mono",monospace;color:var(--lime);font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;
  }
  h1{
    font-family:"League Spartan","Work Sans",sans-serif;font-weight:800;
    font-size:24px;margin:0 0 12px;letter-spacing:-.01em;
  }
  p{color:var(--mut);font-size:15px;margin:0}
  .back{
    display:inline-block;margin-top:26px;color:var(--mut);
    text-decoration:underline;font-size:14px;
  }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="icons/icon-192.png" alt="Pocket Caddy">
  <div class="kicker">Pocket Caddy</div>
  <h1>Link ungültig</h1>
  <p>Dieser Link ist nicht mehr gültig oder unvollständig. Bitte antworte direkt in der App unter „Planen“.</p>
  <a class="back" href="index.html">Zurück zur Website</a>
</div>
</body>
</html>
